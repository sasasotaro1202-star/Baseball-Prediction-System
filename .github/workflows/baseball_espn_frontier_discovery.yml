name: Baseball ESPN Frontier Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * *"

permissions:
  contents: read

concurrency:
  group: baseball-espn-frontier-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Discover MLB
        run: python -m data.espn_baseball_schedule MLB > espn_MLB.json
      - name: Discover NCAA
        run: python -m data.espn_baseball_schedule NCAA > espn_NCAA.json
      - name: Validate discovery artifacts
        run: python -c 'import json; [json.load(open(name, encoding="utf-8")) for name in ("espn_MLB.json", "espn_NCAA.json")]; print("ESPN discovery artifacts: PASS")'
      - name: Upload discovery artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-espn-frontier-${{ github.run_id }}
          path: |
            espn_MLB.json
            espn_NCAA.json
          if-no-files-found: error
          retention-days: 14