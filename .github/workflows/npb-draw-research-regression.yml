name: NPB Draw Research Regression

on:
  push:
    branches: [main]
    paths:
      - "research/npb_draw_research.py"
      - "tests/test_npb_draw_research.py"
      - "requirements.txt"
      - ".github/workflows/npb-draw-research-regression.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: npb-draw-research-regression
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run draw research regression
        run: python -m pytest -q tests/test_npb_draw_research.py
