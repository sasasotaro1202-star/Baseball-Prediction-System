name: NPB Draw Research Regression

on:
  push:
    branches: [main]
    paths:
      - "research/npb_draw_research.py"
      - "tests/test_npb_draw_research.py"
      - "requirements.txt"
      - ".github/workflows/npb-draw-research-regression.yml"
  workflow_dispatch: {}

concurrency:
  group: npb-draw-research-regression
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run draw research regression
        run: python -m pytest -q tests/test_npb_draw_research.py
