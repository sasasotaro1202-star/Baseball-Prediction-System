name: NPB Production Prediction

"on":
  push:
    branches: [main]
    paths:
      - "production_npb.py"
      - "baseball_backtest.py"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/npb-production.yml"
  schedule:
    - cron: "0 23,1,3,5,8,10,12,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: npb-production-prediction
  # Only the newest code/data contract should consume the production runner.
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve target date
        id: target
        shell: bash
        run: |
          echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          echo "data_dir=data" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: PIT and syntax gate
        run: |
          python -m py_compile baseball_backtest.py production_npb.py
          python -m pytest -q tests/test_pit_evidence.py tests/test_production_pit_gate.py
      - name: Acquire PIT-safe public NPB PBP data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          for ym in 2026-02 2026-03 2026-04 2026-05 2026-06 2026-07 2026-08 2026-09; do
            f="data/${ym}_pbp.csv"
            if [ ! -s "$f" ]; then
              curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 "https://github.com/armstjc/Nippon-Baseball-Data-Repository/releases/download/pbp/${ym}_pbp.csv" -o "$f"
            fi
            test -s "$f"
          done
      - name: Run NPB production prediction
        env:
          GITHUB_SHA: ${{ github.sha }}
          PIT_SAFE_STARTER_DATA: "1"
          BASEBALL_TIME_BUDGET_SEC: "4800"
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.target.outputs.date }}"
          data_dir="${{ steps.target.outputs.data_dir }}"

          python production_npb.py --date "$target" --data-dir "$data_dir"

          output="results/npb_production_${target}.json"
          if [ -s "$output" ] && python - "$output" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          raise SystemExit(0 if d.get("execution_status") == "BLOCKED_STARTERS" else 1)
          PY
          then
            # The official NPB starter page can roll forward after the day's
            # games begin. Try the next JST date once. A second BLOCKED_STARTERS
            # result is an explicit no-prediction state, not a hidden failure.
            next_date="$(TZ=Asia/Tokyo date -d "$target +1 day" +%F)"
            echo "Starter evidence for $target is unavailable; retrying next JST date: $next_date"
            python production_npb.py --date "$next_date" --data-dir "$data_dir"
          fi
      - name: Validate output
        run: |
          python - <<'PY'
          import glob, json, math
          p = glob.glob("results/npb_production_*.json")
          assert p, "production output missing"
          d = json.load(open(p[-1], encoding="utf-8"))
          assert d["execution_status"] in {"EXECUTED", "BLOCKED_STARTERS"}
          if d["execution_status"] == "BLOCKED_STARTERS":
              assert d["pit_status"] == "NOT_RUN"
              assert d["starter_gate"] == "BLOCKED"
              assert not d["predictions"]
          else:
              assert d["pit_status"] == "PASS"
              assert d["starter_gate"] == "PASS"
              assert d.get("data_quality_status") == "PASS"
              assert d.get("historical_score_mean_total", 0) >= 3.0
              preds = d["predictions"]
              assert len(preds) > 0
              assert len({x["game_id"] for x in preds}) == len(preds)
              for x in preds:
                  assert abs(x["home_win_pct"] + x["draw_pct"] + x["away_win_pct"] - 100) < 0.05
                  assert abs(x["low_pct"] + x["high_pct"] - 100) < 0.05
                  assert len(x["top4_exact_scores"]) == 4
                  names = [s["score"] for s in x["top4_exact_scores"]]
                  probs = [float(s["prob_pct"]) for s in x["top4_exact_scores"]]
                  assert len(set(names)) == 4
                  assert all(isinstance(s, str) and "-" in s for s in names)
                  assert all(math.isfinite(v) and 0 <= v <= 100 for v in probs)
                  assert all(0 <= x[k] <= 100 for k in ("home_win_pct","draw_pct","away_win_pct","low_pct","high_pct"))
                  assert math.isfinite(float(x["lambda_home"])) and math.isfinite(float(x["lambda_away"]))
                  assert 0.0 < float(x["lambda_home"]) <= 7.0
                  assert 0.0 < float(x["lambda_away"]) <= 7.0
              if len(preds) >= 3:
                  signatures = {(round(x["home_win_pct"],2), round(x["draw_pct"],2), round(x["away_win_pct"],2), round(x["low_pct"],2), round(x["high_pct"],2)) for x in preds}
                  assert len(signatures) >= 2
      - name: Upload production output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npb-production-output-${{ steps.target.outputs.date }}
          path: results/npb_production_*.json
