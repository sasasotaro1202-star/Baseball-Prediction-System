name: NPB Production Prediction

on:
  push:
    branches: [main]
    paths:
      - "production_npb.py"
      - "baseball_backtest.py"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/npb-production.yml"
  schedule:
    # JST 08:00, 10:00, 12:00, 14:00, then evening refreshes.\n    # Scheduled runs re-check official starters and PIT-safe history.\n    - cron: "0 23,1,3,5,8,10,12,14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date in JST (YYYY-MM-DD)"
        required: true
        type: string
      data_dir:
        description: "Historical NPB data directory"
        required: false
        default: "data"
        type: string

concurrency:
  group: npb-production-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve target date
        id: target
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          fi
          echo "data_dir=${{ inputs.data_dir || 'data' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: PIT and syntax gate
        run: |
          python -m py_compile baseball_backtest.py production_npb.py
          python -m pytest -q tests/test_pit_evidence.py tests/test_production_pit_gate.py
      - name: Acquire PIT-safe public NPB PBP data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          for ym in 2026-02 2026-03 2026-04 2026-05 2026-06 2026-07 2026-08 2026-09; do
            f="data/${ym}_pbp.csv"
            if [ ! -s "$f" ]; then
              curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 "https://github.com/armstjc/Nippon-Baseball-Data-Repository/releases/download/pbp/${ym}_pbp.csv" -o "$f"
            fi
            test -s "$f"
          done
      - name: Run NPB production prediction
        env:
          GITHUB_SHA: ${{ github.sha }}
          PIT_SAFE_STARTER_DATA: "1"
          BASEBALL_TIME_BUDGET_SEC: "4800"
        run: python production_npb.py --date "${{ steps.target.outputs.date }}" --data-dir "${{ steps.target.outputs.data_dir }}"
      - name: Validate output
        run: |
          python - <<'PY'
          import glob, json, math
          p = glob.glob("results/npb_production_*.json")
          assert p, "production output missing"
          d = json.load(open(p[-1], encoding="utf-8"))
          assert d["execution_status"] in {"EXECUTED", "BLOCKED_STARTERS"}
          if d["execution_status"] == "BLOCKED_STARTERS":
              assert d["pit_status"] == "NOT_RUN"
              assert d["starter_gate"] == "BLOCKED"
              assert not d["predictions"]
              print("PRODUCTION BLOCKED SAFELY: OFFICIAL STARTERS NOT YET ANNOUNCED")
          else:
              assert d["pit_status"] == "PASS"
              assert d["starter_gate"] == "PASS"
              assert d.get("data_quality_status") == "PASS"
              assert d.get("historical_score_mean_total", 0) >= 3.0
              preds = d["predictions"]
              assert len(preds) > 0
              assert len({x["game_id"] for x in preds}) == len(preds)
              for x in preds:
                  assert abs(x["home_win_pct"] + x["draw_pct"] + x["away_win_pct"] - 100) < 0.05
                  assert abs(x["low_pct"] + x["high_pct"] - 100) < 0.05
                  assert len(x["top4_exact_scores"]) == 4
                  score_probs = [s["prob_pct"] for s in x["top4_exact_scores"]]
                  score_names = [s["score"] for s in x["top4_exact_scores"]]
                  assert len(set(score_names)) == 4
                  assert all(isinstance(s, str) and "-" in s for s in score_names)
                  assert all(math.isfinite(float(v)) and 0 <= float(v) <= 100 for v in score_probs)
                  assert all(0 <= x[k] <= 100 for k in ("home_win_pct","draw_pct","away_win_pct","low_pct","high_pct"))
                  assert math.isfinite(float(x["lambda_home"])) and math.isfinite(float(x["lambda_away"]))
                  assert 0.0 < float(x["lambda_home"]) <= 7.0
                  assert 0.0 < float(x["lambda_away"]) <= 7.0
              if len(preds) >= 3:
                  signatures = {
                      (round(x["home_win_pct"], 2), round(x["draw_pct"], 2), round(x["away_win_pct"], 2),
                       round(x["low_pct"], 2), round(x["high_pct"], 2))
                      for x in preds
                  }
                  assert len(signatures) >= 2, "degenerate production output: games received effectively identical forecasts"
              print("PRODUCTION OUTPUT VERIFIED: PIT + probability integrity + non-degenerate game forecasts")
          PY
      - name: Upload production output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npb-production-output-${{ steps.target.outputs.date }}
          path: results/npb_production_*.json
