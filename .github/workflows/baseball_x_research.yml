name: Baseball X Research Collection

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'X search query (keep narrow and baseball-specific)'
        required: true
        type: string
      hours:
        description: 'Lookback window in hours (max 168 for Recent Search)'
        required: false
        default: '24'
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - id: gate
        env:
          TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN}" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'X credential present; research collection enabled.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'X_BEARER_TOKEN is not configured; safely skipping X collection.'
          fi

  collect:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Collect X observations
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          QUERY: ${{ inputs.query }}
          HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os
          from data.x_acquisition import collect
          hours = max(1, min(int(os.environ.get('HOURS', '24')), 168))
          end = datetime.now(timezone.utc)
          start = end - timedelta(hours=hours)
          result = collect([os.environ['QUERY']], start, end)
          if result['errors']:
              raise SystemExit('X collection returned source errors; no prediction artifact is produced.')
          print(result)
          PY

      - name: Upload X research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-x-research-${{ github.run_id }}
          path: |
            data/x/**
            data/pit/x_source_snapshots.jsonl
          if-no-files-found: ignore
          retention-days: 30
