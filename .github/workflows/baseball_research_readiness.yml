name: Baseball Research Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lightweight validation dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements-ci.txt

      - name: Compile all Baseball sources
        run: python -m compileall -q .

      - name: Run deterministic Action preflight
        run: python research/action_preflight.py

      - name: Validate research runner without heavy execution
        run: |
          set -euo pipefail
          python research_runner.py --help >/dev/null
          python research_runner.py --league NPB --preflight-only
          python research_runner.py --league MLB --preflight-only
          python research_runner.py --league BOTH --preflight-only

      - name: Validate workflow files and required contracts
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/baseball_research.yml \
            .github/workflows/baseball_research_preflight.yml \
            .github/workflows/baseball_pit_acquisition.yml \
            .github/workflows/baseball_v44_compatibility.yml; do
            test -s "$f"
            grep -q 'workflow_dispatch:' "$f"
          done
          test -s requirements.txt
          test -s requirements-ci.txt
          test -s requirements-pit.txt
          test -s research_runner.py
          test -s research/action_preflight.py

      - name: Validate external source reachability
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import requests

          today = datetime.now(timezone.utc).date().isoformat()
          checks = [
              ("MLB_STATS_API", f"https://statsapi.mlb.com/api/v1/schedule?sportId=1&date={today}", True),
              ("NPB_OFFICIAL", "https://npb.jp/", True),
              ("SPAIA_OPTIONAL", "https://spaia.jp/baseball/npb/api/weekly_schedule", False),
          ]
          session = requests.Session()
          session.headers.update({"User-Agent": "Baseball-Prediction-System/1.1"})
          failures = []
          for name, url, required in checks:
              try:
                  r = session.get(url, timeout=20, allow_redirects=True)
                  ok = 200 <= r.status_code < 400
                  print(f"{name}: HTTP {r.status_code} -> {'OK' if ok else 'FAIL'}")
                  if not ok and required:
                      failures.append(f"{name}: HTTP {r.status_code}")
                  elif not ok:
                      print(f"{name}: optional/non-blocking source failure")
              except Exception as exc:
                  print(f"{name}: ERROR {type(exc).__name__}: {exc}")
                  if required:
                      failures.append(f"{name}: {type(exc).__name__}")
                  else:
                      print(f"{name}: optional/non-blocking source error")
          if failures:
              raise SystemExit("Required external source checks failed: " + "; ".join(failures))
          print("External source readiness OK; optional source failures do not block execution.")
          PY

      - name: Write readiness summary
        if: always()
        run: |
          {
            echo '## Baseball execution readiness'
            echo ''
            echo '- Python source compilation: completed'
            echo '- Deterministic preflight: completed'
            echo '- Research CLI contract: completed'
            echo '- Required workflow/manual-dispatch contracts: checked'
            echo '- Required external sources: checked'
            echo '- Optional source failures: non-blocking, matching PIT acquisition fallback behavior'
            echo '- Heavy backtest/research: intentionally not executed by this readiness check'
          } >> "$GITHUB_STEP_SUMMARY"
