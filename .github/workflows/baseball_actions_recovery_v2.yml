name: Baseball Actions Recovery v2

on:
  workflow_run:
    workflows:
      - Baseball User Prediction Request
      - NPB Production Prediction
      - Baseball Regression Tests
      - Baseball Research Preflight
      - Baseball Research Readiness
      - Baseball Autonomous Control Plane
      - Baseball Closed Loop Research
      - Baseball Candidate OOS Validation
      - Baseball 24h Research Autopilot
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-actions-recovery-v2
  cancel-in-progress: true

jobs:
  recover:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect current main snapshot
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt
            for attempt in 1 2 3; do
              if gh "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 5))
            done
          }

          current_sha="$(gh_retry api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current_sha"
          echo "current_main_sha=$current_sha" >> "$GITHUB_OUTPUT"

          if [ "$current_sha" != "$PARENT_SHA" ]; then
            echo "Parent run is superseded; recovery refused."
            echo "recoverable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "recoverable=true" >> "$GITHUB_OUTPUT"
          echo "parent_workflow=$WORKFLOW_NAME" >> "$GITHUB_OUTPUT"
          echo "parent_path=$WORKFLOW_PATH" >> "$GITHUB_OUTPUT"
          echo "parent_event=$WORKFLOW_EVENT" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Classify and recover transient failure
        if: steps.inspect.outputs.recoverable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        shell: bash
        run: |
          set -euo pipefail

          failed_steps="$(gh run view "$RUN_ID" --repo "$GH_REPO" --json jobs --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | join("
")')"
          job_count="$(gh run view "$RUN_ID" --repo "$GH_REPO" --json jobs --jq '.jobs | length')"

          retryable=0
          non_retryable=0
          while IFS= read -r step; do
            [ -n "$step" ] || continue
            case "$step" in
              "Install dependencies"|"Install production dependencies"|"Install control-plane test dependency"|"Install focused test dependency"|"Install repository prediction dependencies"|"Install dependencies for user prediction"|"Resolve NPB historical source snapshot for cache"|"Restore NPB historical PBP cache"|"Stage PIT-safe NPB history for prediction"|"Acquire current PIT observations"|"Acquire PIT-safe public NPB PBP data"|"Run PIT acquisition"|"Commit PIT observations")
                retryable=$((retryable + 1))
                ;;
              *)
                non_retryable=$((non_retryable + 1))
                ;;
            esac
          done <<< "$failed_steps"

          if [ "$job_count" -eq 0 ]; then
            retryable=0
            non_retryable=0
            echo "zero_job_startup_failure=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$job_count" -gt 0 ] && [ "$retryable" -gt 0 ] && [ "$non_retryable" -eq 0 ]; then
            echo "Rerunning failed jobs for transient-only failure."
            gh run rerun "$RUN_ID" --failed --repo "$GH_REPO"
            exit 0
          fi

          if [ "$job_count" -gt 0 ]; then
            echo "No safe transient-only recovery identified; preserving parent failure."
            exit 0
          fi

      - name: Bounded zero-job redispatch
        if: steps.inspect.outputs.recoverable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        shell: bash
        run: |
          set -euo pipefail

          job_count="$(gh run view "$RUN_ID" --repo "$GH_REPO" --json jobs --jq '.jobs | length')"
          if [ "$job_count" -ne 0 ]; then
            exit 0
          fi

          case "$WORKFLOW_PATH" in
            .github/workflows/baseball-user-prediction-request.yml|.github/workflows/npb-production.yml|.github/workflows/baseball_regression_tests.yml|.github/workflows/baseball_research_preflight.yml|.github/workflows/baseball_research_readiness.yml|.github/workflows/baseball_autonomous_control_plane.yml|.github/workflows/baseball_closed_loop.yml|.github/workflows/baseball_candidate_oos.yml|.github/workflows/baseball_24h_research_autopilot_canonical.yml)
              ;;
            *)
              echo "Workflow path is not in zero-job recovery allowlist: $WORKFLOW_PATH"
              exit 0
              ;;
          esac

          recent="$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW_PATH" --branch main --limit 12 --json databaseId,status,conclusion,createdAt)"
          prior="$(printf '%s' "$recent" | jq --arg rid "$RUN_ID" '[.[] | select(.databaseId != ($rid | tonumber)) | select(.status == "completed") | select(.conclusion == "failure") | ((now - (.createdAt | fromdateiso8601)) / 60)] | map(select(. < 30)) | length')"

          if [ "$prior" -gt 0 ]; then
            echo "Zero-job cooldown active; no redispatch."
            exit 0
          fi

          gh workflow run "$WORKFLOW_PATH" --repo "$GH_REPO" --ref main

          verified=0
          for attempt in 1 2 3 4 5; do
            sleep 3
            count="$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW_PATH" --branch main --limit 10 --json databaseId,status,createdAt | jq --arg rid "$RUN_ID" '[.[] | select(.databaseId != ($rid | tonumber)) | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"
            if [ "$count" -gt 0 ]; then
              verified=1
              break
            fi
          done

          if [ "$verified" -ne 1 ]; then
            echo "Zero-job redispatch was accepted but not observable."
            exit 1
          fi
