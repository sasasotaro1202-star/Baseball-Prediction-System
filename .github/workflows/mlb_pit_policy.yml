name: MLB PIT Evidence Policy

on:
  push:
    branches: ["main"]
    paths:
      - "core/mlb_pit_policy.py"
      - "tests/test_mlb_pit_policy.py"
      - ".github/workflows/mlb_pit_policy.yml"
  pull_request:
    paths:
      - "core/mlb_pit_policy.py"
      - "tests/test_mlb_pit_policy.py"
      - ".github/workflows/mlb_pit_policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-pit-policy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run policy tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_mlb_pit_policy.py
