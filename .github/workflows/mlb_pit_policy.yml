name: MLB PIT Evidence Policy

on:
  push:
    branches: ["main"]
    paths:
      - "core/mlb_pit_policy.py"
      - "tests/test_mlb_pit_policy.py"
      - ".github/workflows/mlb_pit_policy.yml"
  pull_request:
    paths:
      - "core/mlb_pit_policy.py"
      - "tests/test_mlb_pit_policy.py"
      - ".github/workflows/mlb_pit_policy.yml"
  workflow_dispatch:

concurrency:
  group: mlb-pit-policy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run policy tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_mlb_pit_policy.py
