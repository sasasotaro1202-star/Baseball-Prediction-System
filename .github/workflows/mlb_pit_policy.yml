name: MLB PIT Evidence Policy

on:
  push:
    branches: ["main"]
    paths:
      - "core/mlb_pit_policy.py"
      - "tests/test_mlb_pit_policy.py"
      - ".github/workflows/mlb_pit_policy.yml"
  pull_request:
    paths:
      - "core/mlb_pit_policy.py"
      - "tests/test_mlb_pit_policy.py"
      - ".github/workflows/mlb_pit_policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-pit-policy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run policy tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_mlb_pit_policy.py
