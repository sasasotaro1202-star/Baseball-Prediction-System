name: Baseball Regime Router Tests

on:
  push:
    branches: ["main"]
    paths:
      - "research/regime_router.py"
      - "tests/test_regime_router.py"
      - "baseball_backtest.py"
      - ".github/workflows/baseball_regime_tests.yml"
  pull_request:
    paths:
      - "research/regime_router.py"
      - "tests/test_regime_router.py"
      - "baseball_backtest.py"
      - ".github/workflows/baseball_regime_tests.yml"
  workflow_dispatch:

concurrency:
  group: baseball-regime-tests
  cancel-in-progress: true

jobs:
  regime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Compile touched Python
        run: python -m py_compile research/regime_router.py tests/test_regime_router.py baseball_backtest.py
      - name: Run regime router tests
        run: python -m pytest -q tests/test_regime_router.py
