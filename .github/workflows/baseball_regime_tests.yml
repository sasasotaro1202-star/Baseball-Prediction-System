name: Baseball Regime Router Tests

on:
  push:
    branches: ["main"]
    paths:
      - "research/regime_router.py"
      - "research/correlated_score.py"
      - "tests/test_correlated_score.py"
      - "tests/test_regime_router.py"
      - "core/pit_evidence.py"
      - "tests/test_pit_evidence.py"
      - "baseball_backtest.py"
      - "production_pit_gate.py"
      - "tests/test_production_pit_gate.py"
      - ".github/workflows/baseball_regime_tests.yml"
  pull_request:
    paths:
      - "research/regime_router.py"
      - "research/correlated_score.py"
      - "tests/test_correlated_score.py"
      - "tests/test_regime_router.py"
      - "core/pit_evidence.py"
      - "tests/test_pit_evidence.py"
      - "baseball_backtest.py"
      - ".github/workflows/baseball_regime_tests.yml"
  workflow_dispatch:

concurrency:
  group: baseball-regime-tests
  cancel-in-progress: true

jobs:
  regime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Compile touched Python
        run: python -m py_compile research/regime_router.py research/correlated_score.py core/pit_evidence.py production_pit_gate.py tests/test_regime_router.py tests/test_correlated_score.py tests/test_pit_evidence.py tests/test_production_pit_gate.py baseball_backtest.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_regime_router.py tests/test_correlated_score.py tests/test_pit_evidence.py tests/test_production_pit_gate.py
