name: Baseball Closed Loop Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-closed-loop-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover stale queued closed-loop runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt output rc
            for attempt in 1 2 3 4; do
              if output="$(gh "$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                rc=$?
                echo "gh retry $attempt/4 failed (rc=${rc}): $output" >&2
                if [ "$attempt" -lt 4 ]; then
                  sleep $((attempt * 2))
                else
                  return "$rc"
                fi
              fi
            done
          }

          now=$(date -u +%s)
          current_sha="$(gh_retry api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          runs_json="$(gh_retry run list --repo "${REPO}" --workflow baseball_closed_loop.yml --limit 20 --json databaseId,status,conclusion,createdAt,headSha)"

          active="$(printf '%s' "${runs_json}" | jq '[.[] | select(.status == "in_progress")] | length')"
          blocked="$(printf '%s' "${runs_json}" | jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          echo "current_main_sha=${current_sha}"
          echo "active=${active} blocked=${blocked}"

          printf '%s' "${runs_json}" |
          jq -c '.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")' |
          while IFS= read -r row; do
            [ -n "${row}" ] || continue
            id="$(printf '%s' "${row}" | jq -r '.databaseId')"
            status="$(printf '%s' "${row}" | jq -r '.status')"
            created="$(printf '%s' "${row}" | jq -r '.createdAt')"
            head_sha="$(printf '%s' "${row}" | jq -r '.headSha // empty')"
            created_epoch="$(date -d "${created}" +%s)"
            age=$((now - created_epoch))

            # A newer main SHA supersedes scheduler-blocked runs immediately.
            # Never cancel an in-progress run here: chronological OOS may be
            # resumable and should not be interrupted by this watchdog.
            if [ -n "${head_sha}" ] && [ "${head_sha}" != "${current_sha}" ]; then
              echo "Cancelling superseded ${status} closed-loop run ${id} (${head_sha})"
              gh_retry run cancel "${id}" --repo "${REPO}"
            elif [ "${age}" -ge 2700 ]; then
              echo "Cancelling stale ${status} closed-loop run ${id} (age=${age}s)"
              gh_retry run cancel "${id}" --repo "${REPO}"
            fi
          done

          # Dispatch remains exclusively owned by baseball_24h_supervisor.yml.
          # This watchdog only drains scheduler-blocked closed-loop runs.
          if [ "${active}" -eq 0 ] && [ "${blocked}" -eq 0 ]; then
            echo 'No active or blocked canonical run; 24h supervisor owns dispatch.'
          fi
