name: Baseball Closed Loop Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-closed-loop-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover stale queued closed-loop runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt output rc
            for attempt in 1 2 3 4; do
              if output="$(gh "$@" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              else
                rc=$?
                echo "gh retry $attempt/4 failed (rc=${rc}): $output" >&2
                if [ "$attempt" -lt 4 ]; then
                  sleep $((attempt * 2))
                else
                  return "$rc"
                fi
              fi
            done
          }

          now=$(date -u +%s)
          current_sha="$(gh_retry api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          runs_json="$(gh_retry run list --repo "${REPO}" --workflow baseball_closed_loop.yml --limit 20 --json databaseId,status,conclusion,createdAt,headSha)"

          active="$(printf '%s' "${runs_json}" | jq '[.[] | select(.status == "in_progress")] | length')"
          blocked="$(printf '%s' "${runs_json}" | jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"

          echo "current_main_sha=${current_sha}"
          echo "active=${active} blocked=${blocked}"

          printf '%s' "${runs_json}" |
          jq -c '.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")' |
          while IFS= read -r row; do
            [ -n "${row}" ] || continue
            id="$(printf '%s' "${row}" | jq -r '.databaseId')"
            status="$(printf '%s' "${row}" | jq -r '.status')"
            created="$(printf '%s' "${row}" | jq -r '.createdAt')"
            head_sha="$(printf '%s' "${row}" | jq -r '.headSha // empty')"
            created_epoch="$(date -d "${created}" +%s)"
            age=$((now - created_epoch))

            # A newer main SHA supersedes scheduler-blocked runs immediately.
            # Never cancel an in-progress run here: chronological OOS may be
            # resumable and should not be interrupted by this watchdog.
            if [ -n "${head_sha}" ] && [ "${head_sha}" != "${current_sha}" ]; then
              echo "Cancelling superseded ${status} closed-loop run ${id} (${head_sha})"
              gh_retry run cancel "${id}" --repo "${REPO}"
            elif [ "${age}" -ge 2700 ]; then
              echo "Cancelling stale ${status} closed-loop run ${id} (age=${age}s)"
              gh_retry run cancel "${id}" --repo "${REPO}"
            fi
          done

          # Normal closed-loop dispatch remains owned by the Supervisor.
          # Emergency role only: when both the Supervisor and the Forever
          # heartbeat are stale/absent, restore the Supervisor itself. This
          # watchdog never dispatches the research workflow directly.
          supervisor_runs="$(gh_retry run list --repo "${REPO}" --workflow baseball_24h_supervisor.yml --branch main --limit 10 --json databaseId,status,conclusion,createdAt,headSha,event)"
          forever_runs="$(gh_retry run list --repo "${REPO}" --workflow baseball_forever_autopilot.yml --branch main --limit 10 --json databaseId,status,conclusion,createdAt,headSha,event)"

          supervisor_active="$(printf '%s' "${supervisor_runs}" | jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"
          forever_active="$(printf '%s' "${forever_runs}" | jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"

          supervisor_latest="$(printf '%s' "${supervisor_runs}" | jq -c 'sort_by(.createdAt) | reverse | .[0] // {}')"
          supervisor_created="$(printf '%s' "${supervisor_latest}" | jq -r '.createdAt // empty')"
          supervisor_conclusion="$(printf '%s' "${supervisor_latest}" | jq -r '.conclusion // empty')"
          supervisor_age=999999
          if [ -n "${supervisor_created}" ]; then
            supervisor_age=$(( (now - $(date -d "${supervisor_created}" +%s)) / 60 ))
          fi

          forever_latest="$(printf '%s' "${forever_runs}" | jq -c 'sort_by(.createdAt) | reverse | .[0] // {}')"
          forever_created="$(printf '%s' "${forever_latest}" | jq -r '.createdAt // empty')"
          forever_conclusion="$(printf '%s' "${forever_latest}" | jq -r '.conclusion // empty')"
          forever_age=999999
          if [ -n "${forever_created}" ]; then
            forever_age=$(( (now - $(date -d "${forever_created}" +%s)) / 60 ))
          fi

          echo "supervisor_active=${supervisor_active} supervisor_age=${supervisor_age} supervisor_conclusion=${supervisor_conclusion}"
          echo "forever_active=${forever_active} forever_age=${forever_age} forever_conclusion=${forever_conclusion}"

          supervisor_recovery_count="$(printf '%s' "${supervisor_runs}" | jq '[.[] | select(.event == "workflow_dispatch") | select((.createdAt | fromdateiso8601) >= (now - 86400))] | length')"

          supervisor_healthy=0
          if [ "${supervisor_active}" -gt 0 ]; then
            supervisor_healthy=1
          elif [ "${supervisor_conclusion}" = "success" ] && [ "${supervisor_age}" -lt 20 ]; then
            supervisor_healthy=1
          fi

          forever_healthy=0
          if [ "${forever_active}" -gt 0 ]; then
            forever_healthy=1
          elif [ "${forever_conclusion}" = "success" ] && [ "${forever_age}" -lt 15 ]; then
            forever_healthy=1
          fi

          if [ "${supervisor_healthy}" -eq 0 ] &&
             [ "${forever_healthy}" -eq 0 ] &&
             [ "${supervisor_recovery_count}" -lt 2 ]; then
            echo 'Emergency control-plane bootstrap: Supervisor and Forever heartbeat are both stale/absent.'
            gh_retry workflow run baseball_24h_supervisor.yml --repo "${REPO}" --ref main

            verified=0
            for attempt in 1 2 3 4 5; do
              sleep 3
              current_supervisor_runs="$(gh_retry run list --repo "${REPO}" --workflow baseball_24h_supervisor.yml --branch main --limit 10 --json databaseId,status,conclusion,createdAt,headSha,event)"
              active_after="$(printf '%s' "${current_supervisor_runs}" | jq --arg sha "${current_sha}" '[.[] | select(.event == "workflow_dispatch") | select(.headSha == $sha) | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"
              echo "Supervisor failover verification ${attempt}/5: current_sha_active=${active_after}"
              if [ "${active_after}" -gt 0 ]; then
                verified=1
                break
              fi
            done

            if [ "${verified}" -ne 1 ]; then
              echo 'Supervisor failover dispatch accepted but current-main run was not observed.' >&2
              exit 1
            fi
            echo 'Supervisor failover dispatch verified.'
          else
            echo 'Supervisor/Forever heartbeat healthy enough; watchdog remains non-invasive.'
          fi
