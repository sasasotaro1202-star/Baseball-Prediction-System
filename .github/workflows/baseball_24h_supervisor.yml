name: Baseball 24h Supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/baseball_24h_supervisor.yml"
      - ".github/workflows/baseball_autonomous_control_plane.yml"
      - "research/autonomous_control_plane.py"
      - "research/project_governance.py"
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-24h-supervisor
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout supervisor context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate control-plane code
        run: |
          set -euo pipefail
          test -s ".github/workflows/baseball_autonomous_control_plane.yml"
          test -s "research/autonomous_control_plane.py"
          python -m py_compile research/autonomous_control_plane.py

      - name: Keep Autonomous Control Plane alive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Deterministic failures must not enter an unbounded retry loop.
          gh_retry() {
            local attempt=1
            while true; do
              if gh "$@"; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          now_epoch="$(date +%s)"
          runs="$(gh_retry run list --repo "$GH_REPO" --workflow baseball_autonomous_control_plane.yml --branch main --limit 20 --json databaseId,status,conclusion,createdAt,event)"
          active="$(printf "%s" "$runs" | jq "[.[] | select(.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\" or .status == \"in_progress\")] | length")"
          latest="$(printf "%s" "$runs" | jq -c "sort_by(.createdAt) | last // empty")"
          latest_age=999999
          if [ -n "$latest" ]; then
            created="$(printf "%s" "$latest" | jq -r ".createdAt // empty")"
            if [ -n "$created" ]; then
              created_epoch="$(date -d "$created" +%s)"
              latest_age=$(( (now_epoch - created_epoch) / 60 ))
            fi
          fi

          dispatches_24h="$(printf "%s" "$runs" | jq "[.[] | select(.event == \"workflow_dispatch\") | select(((.createdAt | fromdateiso8601) >= ((now - 86400))))] | length")"
          latest_dispatch="$(printf "%s" "$runs" | jq -r "[.[] | select(.event == \"workflow_dispatch\") | select(((.createdAt | fromdateiso8601) >= ((now - 86400))))] | sort_by(.createdAt) | reverse | .[0].createdAt // empty")"
          dispatch_age=999999
          if [ -n "$latest_dispatch" ]; then
            dispatch_epoch="$(date -d "$latest_dispatch" +%s)"
            dispatch_age=$(( (now_epoch - dispatch_epoch) / 60 ))
          fi

          echo "Control Plane active=$active latest_age=${latest_age}m dispatches_24h=$dispatches_24h"
          recover=0
          if [ "$active" -eq 0 ] && { [ -z "$latest" ] || [ "$latest_age" -ge 20 ]; }; then
            recover=1
          fi

          if [ "$recover" -eq 1 ]; then
            if [ "$dispatches_24h" -ge 4 ]; then
              printf "%s\n" "Control Plane watchdog: DAILY_CAP; preserving state." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$dispatch_age" -lt 15 ]; then
              printf "%s\n" "Control Plane watchdog: COOLDOWN; preserving state." >> "$GITHUB_STEP_SUMMARY"
            else
              dispatch_epoch="$(date +%s)"
              gh_retry workflow run baseball_autonomous_control_plane.yml --repo "$GH_REPO" --ref main
              verified=0
              for attempt in 1 2 3 4 5; do
                sleep 3
                after="$(gh_retry run list --repo "$GH_REPO" --workflow baseball_autonomous_control_plane.yml --branch main --limit 20 --json databaseId,status,conclusion,createdAt,event)"
                active_after="$(printf "%s" "$after" | jq "[.[] | select(.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\" or .status == \"in_progress\")] | length")"
                new_after="$(printf "%s" "$after" | jq --argjson cutoff "$dispatch_epoch" "[.[] | select(.event == \"workflow_dispatch\") | select((.createdAt | fromdateiso8601) >= $cutoff)] | length")"
                if [ "$active_after" -gt 0 ] || [ "$new_after" -gt 0 ]; then
                  verified=1
                  break
                fi
              done
              if [ "$verified" -ne 1 ]; then
                printf "%s\n" "Control Plane watchdog: FAILED_REDISPATCH; fail-closed." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              printf "%s\n" "Control Plane watchdog: REDISPATCH_VERIFIED." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf "%s\n" "Control Plane watchdog: HEALTHY_OR_WITHIN_WINDOW." >> "$GITHUB_STEP_SUMMARY"
          fi