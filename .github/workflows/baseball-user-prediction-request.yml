name: Baseball User Prediction Request

on:
  push:
    branches: [main]
    paths:
      - "prediction_requests/inbox/active.json"
  workflow_dispatch:
    inputs:
      request_file:
        description: "Tracked prediction request JSON file"
        required: true
        default: "prediction_requests/inbox/active.json"
        type: string

permissions:
  contents: write

concurrency:
  # User prediction is a latest-request-wins lane. A stale queued/in-progress
  # request must never monopolize the only useful runner slot for a newer request.
  group: baseball-user-prediction-request
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout triggering request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository prediction dependencies
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Resolve NPB historical source snapshot for cache
        id: npb-history-cache-key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_FILE: ${{ github.event.inputs.request_file || 'prediction_requests/inbox/active.json' }}
        run: |
          set -euo pipefail
          competition="$(python - "$REQUEST_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              obj = json.load(fh)
          print(str(obj.get("competition_id") or obj.get("league") or "").strip().upper())
          PY
          )"
          echo "competition=$competition" >> "$GITHUB_OUTPUT"
          if [ "$competition" != "NPB" ]; then
            exit 0
          fi
          target="$(python - "$REQUEST_FILE" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          with open(sys.argv[1], encoding="utf-8") as fh:
              obj = json.load(fh)
          value = str(obj.get("target_date") or "").strip().lower()
          if not value or value == "today":
              value = datetime.now(timezone.utc).astimezone(ZoneInfo("Asia/Tokyo")).strftime("%Y-%m-%d")
          print(value)
          PY
          )"
          year="$(printf '%s' "$target" | cut -d- -f1)"
          month="$(printf '%s' "$target" | cut -d- -f2)"
          month_num=$((10#$month))
          if [ "$month_num" -gt 2 ]; then
            history_until="$(printf '%04d-%02d' "$year" $((month_num - 1)))"
          else
            history_until="$(printf '%04d-%02d' "$year" 1)"
          fi
          tag_sha="$(gh api repos/armstjc/Nippon-Baseball-Data-Repository/git/ref/tags/pbp --jq '.object.sha')"
          test -n "$tag_sha"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "history_until=$history_until" >> "$GITHUB_OUTPUT"
          echo "source_tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "NPB PBP cache source=$tag_sha history_until=$history_until" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore NPB historical PBP cache
        if: steps.npb-history-cache-key.outputs.competition == 'NPB'
        id: npb-history-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: data/*_pbp.csv
          key: ${{ runner.os }}-npb-pbp-${{ steps.npb-history-cache-key.outputs.source_tag_sha }}-${{ steps.npb-history-cache-key.outputs.history_until }}
          restore-keys: |
            ${{ runner.os }}-npb-pbp-${{ steps.npb-history-cache-key.outputs.source_tag_sha }}-
          
      - name: Stage PIT-safe NPB history for prediction router
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_FILE: ${{ github.event.inputs.request_file || 'prediction_requests/inbox/active.json' }}
        run: |
          set -euo pipefail
          competition="$(python - "$REQUEST_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              obj = json.load(fh)
          print(str(obj.get("competition_id") or obj.get("league") or "").strip().upper())
          PY
          )"
          if [ "$competition" != "NPB" ]; then
            echo "No NPB history staging required for competition=$competition."
            exit 0
          fi
          mkdir -p data
          target="$(python - "$REQUEST_FILE" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          with open(sys.argv[1], encoding="utf-8") as fh:
              obj = json.load(fh)
          value = str(obj.get("target_date") or "").strip().lower()
          if not value or value == "today":
              value = datetime.now(timezone.utc).astimezone(ZoneInfo("Asia/Tokyo")).strftime("%Y-%m-%d")
          print(value)
          PY
          )"
          year="$(printf '%s' "$target" | cut -d- -f1)"
          month="$(printf '%s' "$target" | cut -d- -f2)"
          month_num=$((10#$month))
          if [ "$month_num" -gt 2 ]; then
            for m in $(seq 2 $((month_num - 1))); do
              mm="$(printf '%02d' "$m")"
              f="data/${year}-${mm}_pbp.csv"
              if [ -s "$f" ]; then
                continue
              fi
              gh release download pbp \
                --repo armstjc/Nippon-Baseball-Data-Repository \
                --pattern "${year}-${mm}_pbp.csv" \
                --dir data \
                --clobber
              test -s "$f"
            done
          fi
          count="$(find data -maxdepth 1 -name '*_pbp.csv' -type f | wc -l | tr -d ' ')"
          if [ "$count" -lt 1 ]; then
            echo "PIT-safe NPB history staging produced no readable PBP file." >&2
            exit 1
          fi
          echo "PIT-safe NPB history staged: $count monthly PBP file(s) for target=$target. cache_hit=${{ steps.npb-history-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate requested prediction through repository router
        id: generate
        env:
          GITHUB_SHA: ${{ github.sha }}
          REQUEST_FILE: ${{ github.event.inputs.request_file || 'prediction_requests/inbox/active.json' }}
        run: |
          set -euo pipefail
          python scripts/prediction_request.py --request-file "$REQUEST_FILE"
          request_id="$(python - "$REQUEST_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              obj = json.load(fh)
          value = str(obj.get("request_id", "")).strip()
          if not value:
              raise SystemExit("request_id missing")
          print(value)
          PY
          )"
          result="prediction_requests/results/${request_id}.json"
          test -s "$result"
          echo "result_path=$result" >> "$GITHUB_OUTPUT"

      - name: Validate and upload request result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-user-prediction-${{ github.run_id }}
          path: ${{ steps.generate.outputs.result_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit immutable request result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction_requests/results
          if git diff --cached --quiet; then
            echo "No new request result to commit."
            exit 0
          fi
          git commit -m "Archive baseball prediction request result"
          for attempt in 1 2 3; do
            if git fetch origin main && git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "request-result push conflict could not be reconciled safely" >&2
              exit 1
            fi
          done
          echo "bounded request-result push recovery exhausted" >&2
          exit 1
