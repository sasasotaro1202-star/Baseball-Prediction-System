name: Baseball Research Candidate Unit Tests

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'research/individually_calibrated_ensemble.py'
      - 'tests/test_individually_calibrated_ensemble.py'
      - 'evaluation/calibration.py'
      - 'requirements.txt'
      - '.github/workflows/baseball_research_candidate_tests.yml'
  pull_request:
    paths:
      - 'research/individually_calibrated_ensemble.py'
      - 'tests/test_individually_calibrated_ensemble.py'
      - 'evaluation/calibration.py'
      - 'requirements.txt'
      - '.github/workflows/baseball_research_candidate_tests.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Compile focused sources
        run: |
          set -euo pipefail
          python -m py_compile evaluation/calibration.py research/individually_calibrated_ensemble.py research/npb_candidate_replay.py research/mlb_candidate_replay.py tests/test_individually_calibrated_ensemble.py
      - name: Run focused tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_individually_calibrated_ensemble.py
