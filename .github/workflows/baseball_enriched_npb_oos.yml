name: One-off Enriched Data NPB OOS Validation

on:
  push:
    branches: [research/data-integration-20260928]
    paths:
      - 'baseball_backtest.py'
      - 'data/npb_pbp_adapter.py'
      - 'data/npb_enrichment_contract.py'
      - 'research/**'
      - 'tests/test_enriched_feature_integration.py'
      - '.github/workflows/baseball_enriched_npb_oos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-enriched-npb-oos
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  BASEBALL_ENABLE_PIT_SAFE_BULLPEN_USAGE: '1'
  PIT_SAFE_STARTER_DATA: '0'

jobs:
  npb-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile and focused contract tests
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m compileall -q baseball_backtest.py data research tests/test_enriched_feature_integration.py
          python -m pytest -q tests/test_enriched_feature_integration.py

      - name: Stage NPB historical release data
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            existing=$(find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" | wc -l | tr -d ' ')
            if [ "$existing" -gt 0 ]; then
              echo "NPB ${year}: cached (${existing})"
              continue
            fi
            ok=0
            for attempt in 1 2 3; do
              if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber; then
                ok=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "failed to stage NPB ${year}" >&2
              exit 1
            fi
          done
          test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -ge 7

      - name: Run NPB chronological OOS
        timeout-minutes: 180
        env:
          BASEBALL_TIME_BUDGET_SEC: '7200'
          BASEBALL_HARD_CAP_SEC: '9000'
          BASEBALL_FAST_OOS: '1'
          BASEBALL_MAX_FIT_ROWS: '6000'
          BASEBALL_FAST_MODEL_POOL_NPB: 'Logistic,HistGB,ExtraTrees,HierarchicalDrawResult'
          BASEBALL_FAST_MODEL_POOL: 'Logistic,HistGB,ExtraTrees'
          BASEBALL_SCORE_FAST_VALIDATION: '1'
          BASEBALL_SCORE_TREE_ESTIMATORS: '60'
          BASEBALL_SCORE_HIST_MAX_ITER: '100'
          NPB_RETRAIN_EVERY: '300'
          BASEBALL_CATBOOST_DETERMINISTIC: '1'
        run: |
          set -euo pipefail
          python -m research.real_data_validation --league NPB --mlb-start 2020 --mlb-end 2026

      - name: Validate and print evidence
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test -s results/real_data_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('results/real_data_validation.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'status': obj.get('status'),
              'execution_status': obj.get('execution_status'),
              'overall_decision': obj.get('overall_decision'),
              'runs': obj.get('runs'),
              'blockers': obj.get('blockers'),
          }, ensure_ascii=False, indent=2))
          if obj.get('execution_status') != 'EXECUTED':
              raise SystemExit('NPB OOS did not execute successfully')
          if any(run.get('execution_status') == 'FAILED' or run.get('stage') == 'error' for run in obj.get('runs', [])):
              raise SystemExit('NPB OOS contains execution failure')
          if obj.get('overall_decision') not in {'ADOPT','HOLD'}:
              raise SystemExit('invalid explicit OOS decision')
          PY

      - name: Upload NPB OOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-enriched-npb-oos-${{ github.run_id }}
          path: |
            results/real_data_validation.json
            results/npb_candidate_development.json
            results/npb_locked_holdout.json
            results/npb_backtest_summary.csv
            results/npb_model_comparison.csv
            pit_readiness_audit.json
            results/research_execution_manifest.json
            results/audit_log.csv
          if-no-files-found: warn
          retention-days: 30
