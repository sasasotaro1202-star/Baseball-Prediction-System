name: Baseball PIT Acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: baseball-pit-acquisition
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: 1

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pit.txt

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements-pit.txt

      - name: Run PIT acquisition
        run: |
          set -euo pipefail
          python -m py_compile data/pit_acquisition.py core/pit_snapshot.py core/pit_replay.py
          python -m data.pit_acquisition

      - name: Validate PIT ledger
        run: |
          set -euo pipefail
          test -s data/pit/acquisition_runs.jsonl
          test -s data/pit/source_snapshots.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          allowed = {"KNOWN", "OBSERVED", "OBSERVED_UNVERIFIABLE_ANNOUNCEMENT_TIME", "UNAVAILABLE", "MISSING", "UNVERIFIABLE"}
          required = [
              Path("data/pit/source_snapshots.jsonl"),
              Path("data/pit/event_observations.jsonl"),
              Path("data/pit/availability_observations.jsonl"),
              Path("data/pit/acquisition_runs.jsonl"),
          ]
          for path in required:
              if not path.exists():
                  raise SystemExit(f"Missing PIT ledger file: {path}")
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  obj = json.loads(line)
                  status = obj.get("status")
                  if status is not None and status not in allowed:
                      raise SystemExit(f"Unexpected status {status} in {path}: {status}")
          print("PIT ledger validation OK")
          PY

      - name: Commit PIT observations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/pit/*.jsonl
          if git diff --cached --quiet; then
            echo 'No PIT changes to commit.'
          else
            git commit -m 'Update Baseball PIT observations'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              if [ "$attempt" -lt 3 ]; then
                git fetch origin main
                git rebase origin/main
                sleep $((attempt * 3))
              fi
            done
            exit 1
          fi

      - name: Upload acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-pit-${{ github.run_id }}
          path: data/pit/**
          if-no-files-found: warn
          retention-days: 14
