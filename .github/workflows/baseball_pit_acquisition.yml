name: Baseball PIT Acquisition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baseball_pit_acquisition.yml'
      - 'data/pit_acquisition.py'
      - 'core/pit_snapshot.py'
      - 'core/pit_replay.py'
      - 'research/pit_readiness_audit.py'
      - 'tools_pit_ledger_validator.py'
      - 'requirements-pit.txt'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: baseball-pit-acquisition
  # PIT acquisition is append-only evidence collection. Never interrupt a live
  # acquisition; keep at most one pending run for the next collection cycle.
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: 1
  PIT_ENABLE_MLB_GAME_PROBES: "1"
  PIT_MLB_PROBE_MIN_INTERVAL_MINUTES: "60"
  PIT_MLB_PROBE_LOOKAHEAD_HOURS: "48"
  PIT_MLB_PROBE_MAX_GAMES: "16"
  PIT_MLB_PROBE_TIMEOUT_SECONDS: "8"
  PIT_MLB_PROBE_RETRIES: "2"

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pit.txt

      - name: Install acquisition dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements-pit.txt

      - name: Run PIT acquisition
        run: |
          set -euo pipefail
          python -m py_compile data/pit_acquisition.py core/pit_snapshot.py core/pit_replay.py tools_pit_ledger_validator.py
          python -m data.pit_acquisition

      - name: Validate PIT ledger
        run: |
          set -euo pipefail
          test -s data/pit/acquisition_runs.jsonl
          test -s data/pit/source_snapshots.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          allowed = {"KNOWN", "OBSERVED", "OBSERVED_UNVERIFIABLE_ANNOUNCEMENT_TIME", "UNAVAILABLE", "MISSING", "UNVERIFIABLE"}
          required = [
              Path("data/pit/source_snapshots.jsonl"),
              Path("data/pit/event_observations.jsonl"),
              Path("data/pit/availability_observations.jsonl"),
              Path("data/pit/acquisition_runs.jsonl"),
          ]
          for path in required:
              if not path.exists():
                  raise SystemExit(f"Missing PIT ledger file: {path}")
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  obj = json.loads(line)
                  status = obj.get("status")
                  if status is not None and status not in allowed:
                      raise SystemExit(f"Unexpected status {status} in {path}: {status}")
          print("PIT ledger validation OK")
          PY

      - name: Audit PIT readiness evidence
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -m research.pit_readiness_audit | tee pit_readiness_audit.json
          test -s pit_readiness_audit.json

      - name: Validate PIT evidence consistency
        run: |
          set -euo pipefail
          python tools_pit_ledger_validator.py

      - name: Commit PIT observations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/pit/*.jsonl
          if git diff --cached --quiet; then
            echo 'No PIT changes to commit.'
          else
            git commit -m 'Update Baseball PIT observations'
            for attempt in 1 2 3 4 5 6 7 8; do
              if git push; then exit 0; fi
              if [ "$attempt" -lt 8 ]; then
                git fetch origin main
                git rebase origin/main
                sleep_seconds=$((attempt * 5))
                echo "PIT push race detected; retrying in ${sleep_seconds}s (attempt ${attempt}/8)."
                sleep "${sleep_seconds}"
              fi
            done
            echo 'PIT observation commit failed after 8 bounded push/rebase attempts.' >&2
            exit 1
          fi

      - name: Upload acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-pit-${{ github.run_id }}
          path: data/pit/**
          if-no-files-found: warn
          retention-days: 14
