name: Baseball Ultimate Predictive Intelligence v18 Contract

on:
  workflow_dispatch:
  push:
    branches:
      - "research/**"
    paths:
      - "research/ultimate_v18_intelligence.py"
      - "tests/test_ultimate_v18_intelligence.py"
      - ".github/workflows/baseball_ultimate_v18_contract.yml"
  pull_request:
    paths:
      - "research/ultimate_v18_intelligence.py"
      - "tests/test_ultimate_v18_intelligence.py"
      - ".github/workflows/baseball_ultimate_v18_contract.yml"

permissions:
  contents: read

concurrency:
  group: baseball-ultimate-v18-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        timeout-minutes: 8
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 90 --prefer-binary -r requirements-ci.txt

      - name: Compile v18 layer
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m py_compile research/ultimate_v18_intelligence.py tests/test_ultimate_v18_intelligence.py

      - name: Run v18 contract tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_ultimate_v18_intelligence.py

      - name: Enforce research-only isolation
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("research/ultimate_v18_intelligence.py").read_text(encoding="utf-8")
          assert "production Champion" in source
          assert "research_only" in source
          assert "forecast_action" in source
          print("v18 research-only isolation contract: PASS")
          PY
