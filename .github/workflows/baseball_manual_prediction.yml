name: Baseball Manual On-Demand Prediction

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League to predict at request time"
        required: true
        type: choice
        options:
          - NPB
          - MLB

permissions:
  contents: read

concurrency:
  group: baseball-manual-prediction-${{ inputs.league }}
  # A newer same-league on-demand prediction supersedes stale work.
  cancel-in-progress: true

jobs:
  predict:
    name: Manual ${{ inputs.league }} prediction
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIT_SAFE_STARTER_DATA: "1"
      BASEBALL_TIME_BUDGET_SEC: "3600"
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Record actual checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test -n "${checked_out_sha}"
          echo "BASEBALL_CHECKED_OUT_SHA=${checked_out_sha}" >> "${GITHUB_ENV}"
          echo "Manual prediction will record the actual checked-out main commit: ${checked_out_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      
      - name: Resolve published NPB PBP release fingerprint
        if: inputs.league == 'NPB'
        id: pbp_ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(gh api repos/armstjc/Nippon-Baseball-Data-Repository/git/ref/tags/pbp --jq '.object.sha')"
          test -n "${release_sha}"
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Restore NPB historical PBP cache
        if: inputs.league == 'NPB'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: data/*_pbp.csv
          key: ${{ runner.os }}-npb-pbp-${{ steps.pbp_ref.outputs.sha }}-${{ hashFiles('requirements.txt', 'data/npb_pbp_adapter.py') }}
          # Do not restore a different published PBP release. The release
          # fingerprint is part of the cache identity and must remain PIT-safe.
          restore-keys: |
            ${{ runner.os }}-npb-pbp-${{ steps.pbp_ref.outputs.sha }}-

      - name: Install production dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Acquire PIT-safe NPB history for manual request
        if: inputs.league == 'NPB'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          target="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          year="$(printf '%s' "$target" | cut -d- -f1)"
          month="$(printf '%s' "$target" | cut -d- -f2)"
          month_num=$((10#$month))
          if [ "$month_num" -gt 2 ]; then
            for m in $(seq 2 $((month_num - 1))); do
              mm="$(printf '%02d' "$m")"
              f="data/${year}-${mm}_pbp.csv"
              if [ -s "$f" ]; then
                continue
              fi
              gh release download pbp \
                --repo armstjc/Nippon-Baseball-Data-Repository \
                --pattern "${year}-${mm}_pbp.csv" \
                --dir data \
                --clobber
              test -s "$f"
            done
          fi
          test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -ge 1
          echo "PIT-safe NPB history staged for manual request target vicinity."

      - name: Run current production runtime on demand
        id: prediction
        shell: bash
        run: |
          set -euo pipefail
          output="results/manual_prediction.json"
          mkdir -p results

          if [ "${{ inputs.league }}" = "NPB" ]; then
            # Fast NPB path: canonical PIT/model computation with observation-only
            # enrichment deferred. This remains explicit RESEARCH_SHADOW when
            # NPB production is not formally adopted.
            #
            # Do not treat stdout as the result protocol. The fast wrapper writes
            # an atomic JSON file, while diagnostics may legitimately be emitted
            # by the underlying model runtime. Copy only that result file into
            # the stable manual-result path.
            target="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
            set +e
            python scripts/npb_fast_prediction.py \
              --date "${target}" \
              --data-dir data \
              --research-shadow \
              --minimum-lead-minutes 0 \
              > results/npb_fast_stdout.log \
              2> results/npb_fast_stderr.log
            rc=$?
            set -e
            source_output="results/npb_shadow_${target}.json"
            if [ -s "${source_output}" ]; then
              cp "${source_output}" "${output}"
            fi
          else
            set +e
            python -m prediction.current_production \
              --league "${{ inputs.league }}" \
              --data-dir data \
              > "${output}"
            rc=$?
            set -e
          fi

          if [ ! -s "${output}" ]; then
            echo "prediction runtime produced no JSON output (rc=${rc}); preserving the original runtime failure." >&2
            exit "${rc:-1}"
          fi

          # Manual on-demand consumers require stable request metadata. This
          # annotation changes provenance metadata only; it never changes
          # probabilities or PIT evidence.
          python - "${output}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              obj = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit("manual prediction output is not valid JSON") from exc
          obj["prediction_request_mode"] = "on_demand"
          for pred in obj.get("predictions", []):
              if not isinstance(pred, dict):
                  continue
              pred["prediction_source"] = "MANUAL_LIVE"
              pred["prediction_schedule"] = "on_demand"
              pred["prediction_request_mode"] = "on_demand"
              try:
                  generated = datetime.fromisoformat(
                      str(pred["prediction_generated_at"]).replace("Z", "+00:00")
                  )
                  game_time = datetime.fromisoformat(
                      str(pred["datetime_jst"]).replace("Z", "+00:00")
                  )
                  if generated.tzinfo is not None and game_time.tzinfo is not None:
                      pred["prediction_target_lead_minutes"] = round(
                          (game_time - generated).total_seconds() / 60.0, 3
                      )
              except Exception:
                  pass
          path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python - "${output}" "${rc}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          rc = int(sys.argv[2])
          obj = json.loads(path.read_text(encoding="utf-8"))
          status = str(obj.get("execution_status", "UNKNOWN"))

          allowed = {
              "EXECUTED",
              "NO_FUTURE_GAMES",
              "BLOCKED_NO_CURRENT_PRODUCTION_RUNTIME",
              "BLOCKED_STALE_TARGET_DATE",
              "BLOCKED_STARTERS",
              "BLOCKED_PRODUCTION_GATE",
              "RESEARCH_SHADOW_EXECUTED",
          }
          if status not in allowed:
              raise SystemExit("unexpected manual prediction status: " + status)
          if status == "BLOCKED_STALE_TARGET_DATE":
              raise SystemExit(2)
          if status in {"EXECUTED", "RESEARCH_SHADOW_EXECUTED"} and rc != 0:
              raise SystemExit("prediction execution failed with rc=" + str(rc))
          print(json.dumps({
              "status": status,
              "prediction_rows": len(obj.get("predictions", [])),
              "exit_code": rc,
          }, ensure_ascii=False))
          PY

      - name: Validate on-demand metadata when a prediction was emitted
        run: |
          set -euo pipefail
          output="results/manual_prediction.json"
          python - "${output}" <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          obj = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if obj.get("execution_status") == "RESEARCH_SHADOW_EXECUTED":
              if obj.get("scope") != "RESEARCH_SHADOW":
                  raise SystemExit("research-shadow manual prediction has incorrect scope")
              if obj.get("production_eligibility") is not False:
                  raise SystemExit("research-shadow manual prediction incorrectly claims production eligibility")
          if obj.get("execution_status") not in {"EXECUTED", "RESEARCH_SHADOW_EXECUTED"}:
              print("Manual request did not emit a production prediction:", obj.get("execution_status"))
              raise SystemExit(0)

          if obj.get("prediction_request_mode") != "on_demand":
              raise SystemExit("manual request was not marked on_demand")

          for pred in obj.get("predictions", []):
              if pred.get("prediction_source") != "MANUAL_LIVE":
                  raise SystemExit("prediction source is not MANUAL_LIVE")
              if pred.get("prediction_schedule") != "on_demand":
                  raise SystemExit("prediction schedule is not on_demand")
              generated = datetime.fromisoformat(
                  str(pred["prediction_generated_at"]).replace("Z", "+00:00")
              )
              game_time = datetime.fromisoformat(
                  str(pred["datetime_jst"]).replace("Z", "+00:00")
              )
              if generated >= game_time:
                  raise SystemExit("manual prediction was generated at/after first pitch")
              if pred.get("pit_status") != "PASS":
                  raise SystemExit("manual prediction is not PIT PASS")
              if "prediction_target_lead_minutes" not in pred:
                  raise SystemExit("manual prediction is missing target lead metadata")
              # The canonical NPB runtime emits probabilities under the
              # home_win_pct/draw_pct/away_win_pct + low_pct/high_pct schema.
              # Fail closed when any probability or ranked exact-score output
              # is missing; a successful process without usable predictions is
              # not a successful prediction result.
              required_numeric = (
                  "home_win_pct", "draw_pct", "away_win_pct",
                  "low_pct", "high_pct", "lambda_home", "lambda_away",
              )
              for key in required_numeric:
                  try:
                      value = float(pred[key])
                  except (KeyError, TypeError, ValueError) as exc:
                      raise SystemExit(f"manual prediction missing numeric field: {key}") from exc
                  if not (0.0 <= value <= 100.0 if key.endswith("_pct") else value >= 0.0):
                      raise SystemExit(f"manual prediction has invalid numeric field: {key}")
              top4 = pred.get("top4_exact_scores")
              if not isinstance(top4, list) or len(top4) != 4:
                  raise SystemExit("manual prediction is missing exactly four exact-score candidates")
              for candidate in top4:
                  if not isinstance(candidate, dict) or not str(candidate.get("score", "")).strip():
                      raise SystemExit("manual prediction contains an invalid exact-score candidate")
              probs = [float(pred["home_win_pct"]), float(pred["draw_pct"]), float(pred["away_win_pct"])]
              if abs(sum(probs) - 100.0) > 0.15:
                  raise SystemExit("manual NPB class probabilities do not sum to 100%")
              hilo = [float(pred["low_pct"]), float(pred["high_pct"])]
              if abs(sum(hilo) - 100.0) > 0.15:
                  raise SystemExit("manual NPB low/high probabilities do not sum to 100%")
          print("Manual on-demand PIT/metadata validation passed.")
          PY

      - name: Archive manual experience snapshot when a production prediction exists
        run: |
          set -euo pipefail
          output="results/manual_prediction.json"
          if ! grep -q '"execution_status": "EXECUTED"' "${output}"; then
            echo "No executed prediction to archive."
            exit 0
          fi
          python -m research.experience_ledger --archive "${output}" --run-id "${GITHUB_RUN_ID}"

      - name: Upload manual prediction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-manual-prediction-${{ inputs.league }}-${{ github.run_id }}
          path: |
            manual_target_date_jst.txt
            results/manual_prediction.json
            data/experience/**
          if-no-files-found: warn
          retention-days: 14
