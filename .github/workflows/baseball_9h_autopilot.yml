name: Baseball 9h Autopilot
# Hardened after CI diagnosis: deterministic gates run before expensive phases.
# Retry trigger after action-preflight parser hardening.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/baseball_9h_autopilot.yml'

permissions:
  contents: read

concurrency:
  group: baseball-9h-autopilot
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  phase1-preflight-pit:
    name: Phase 1 - Preflight + PIT
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Compile and regression baseline
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m pytest -q tests
      - name: Acquire PIT observations
        run: |
          set -euo pipefail
          export PIT_ENABLE_MLB_GAME_PROBES=0
          python -m data.pit_acquisition
      - name: Validate PIT governance
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.closed_loop_governance import pit_stage
          stage = pit_stage()
          print(stage)
          if stage.status != "READY":
              raise SystemExit("PIT stage blocked: " + "; ".join(stage.blockers))
          PY
      - name: Save phase evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-9h-phase1-${{ github.run_id }}
          path: |
            data/pit/**
            results/**
          if-no-files-found: warn
          retention-days: 14

  phase2-oos:
    name: Phase 2 - Chronological OOS Research
    needs: phase1-preflight-pit
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Stage NPB historical data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            for attempt in 1 2 3; do
              if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber; then
                break
              fi
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
              [ "$attempt" -eq 3 ] && exit 1
            done
          done
          test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -ge 7
      - name: Run chronological OOS
        timeout-minutes: 115
        env:
          BASEBALL_TIME_BUDGET_SEC: '6600'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: python -u research_runner_v6.py --league BOTH --mlb-start 2020 --mlb-end 2026 --retries 3
      - name: Verify manifest
        run: |
          set -euo pipefail
          test -s results/research_execution_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("results/research_execution_manifest.json").read_text())
          if obj.get("overall_status") != "SUCCESS":
              raise SystemExit("research manifest is not SUCCESS")
          for row in obj.get("results", []):
              if row.get("status") != "SUCCESS" or int(row.get("predictions",0)) <= 0:
                  raise SystemExit("invalid result: " + repr(row))
          print(json.dumps(obj, ensure_ascii=False, indent=2))
          PY
      - name: Upload OOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-9h-phase2-${{ github.run_id }}
          path: |
            results/**
            data/*.csv
          if-no-files-found: warn
          retention-days: 14

  phase3-candidate:
    name: Phase 3 - Candidate OOS + Robustness
    needs: phase2-oos
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        league: [NPB, MLB]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Stage NPB data
        if: matrix.league == 'NPB'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber
          done
      - name: Candidate validation
        timeout-minutes: 115
        env:
          BASEBALL_TIME_BUDGET_SEC: '6600'
          NPB_RETRAIN_EVERY: '300'
          MLB_ENRICH_STARTERS: '0'
          PIT_SAFE_STARTER_DATA: '0'
        run: python -m research.real_data_validation --league "${{ matrix.league }}" --mlb-start 2020 --mlb-end 2026
      - name: Enforce explicit decision
        run: |
          set -euo pipefail
          test -s results/real_data_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("results/real_data_validation.json").read_text())
          if obj.get("status") != "COMPLETED_WITH_FAIL_CLOSED_DECISION":
              raise SystemExit("candidate lifecycle contract not satisfied")
          if obj.get("overall_decision") not in {"ADOPT","HOLD"}:
              raise SystemExit("candidate decision missing")
          print(json.dumps(obj, ensure_ascii=False, indent=2))
          PY
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-9h-phase3-${{ matrix.league }}-${{ github.run_id }}
          path: results/**
          if-no-files-found: warn
          retention-days: 14

  phase4-final:
    name: Phase 4 - Final Governance + Verification
    needs: phase3-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Full regression and production gates
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m pytest -q tests
          python production_pit_gate.py
      - name: Closed-loop governance
        run: |
          set -euo pipefail
          python -m research.closed_loop_execute
          python -m research.closed_loop_governance
          test -s results/lifecycle_execution.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("results/lifecycle_execution.json").read_text())
          print(json.dumps(obj, ensure_ascii=False, indent=2))
          if obj.get("status") != "READY":
              raise SystemExit("final lifecycle gate blocked: " + "; ".join(obj.get("blockers", [])))
          PY
      - name: Final evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-9h-final-${{ github.run_id }}
          path: |
            results/**
            data/pit/**
          if-no-files-found: warn
          retention-days: 30
