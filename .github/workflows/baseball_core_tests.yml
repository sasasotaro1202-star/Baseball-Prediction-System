name: Baseball Core Experience Tests

on:
  pull_request:
    paths:
      - "research/experience_ledger.py"
      - "research/shadow_experience.py"
      - "scripts/archive_user_prediction_experience.py"
      - "research/experience_*.py"
      - "config/experience_epoch.json"
      - "tests/test_experience_ledger.py"
      - "tests/test_shadow_experience.py"
      - "tests/test_archive_user_prediction_experience.py"
      - "tests/test_experience_automation_contract.py"
      - ".github/workflows/baseball_core_tests.yml"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "research/experience_ledger.py"
      - "research/shadow_experience.py"
      - "research/experience_*.py"
      - "config/experience_epoch.json"
      - "tests/test_experience_ledger.py"
      - "tests/test_shadow_experience.py"
      - ".github/workflows/baseball_core_tests.yml"
      - "requirements.txt"
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: read

concurrency:
  group: baseball-core-experience-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 120 --prefer-binary -r requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Compile Experience modules
        run: |
          set -euo pipefail
          python -m py_compile             research/experience_ledger.py             research/shadow_experience.py             scripts/archive_user_prediction_experience.py             tests/test_experience_ledger.py             tests/test_shadow_experience.py             tests/test_archive_user_prediction_experience.py             tests/test_experience_automation_contract.py

      - name: Run Experience tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_experience_ledger.py             tests/test_shadow_experience.py             tests/test_archive_user_prediction_experience.py             tests/test_experience_automation_contract.py

      - name: Verify epoch contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("config/experience_epoch.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema_version") != "baseball-experience-epoch-v1":
              raise SystemExit("invalid Experience epoch schema")
          raw = str(payload.get("epoch_utc") or "")
          if not raw:
              raise SystemExit("Experience epoch is missing")
          epoch = datetime.fromisoformat(raw.replace("Z", "+00:00"))
          if epoch.tzinfo is None:
              raise SystemExit("Experience epoch must be timezone-aware")
          if epoch > datetime.now(timezone.utc):
              raise SystemExit("Experience epoch is in the future")
          print("Experience epoch contract: PASS", epoch.astimezone(timezone.utc).isoformat())
          PY
