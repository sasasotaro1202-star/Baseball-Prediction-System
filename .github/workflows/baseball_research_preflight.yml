name: Baseball Research Preflight

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/pit/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-research-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements-ci.txt

      - name: Compile all sources
        run: python -m compileall -q .

      - name: Run deterministic preflight
        run: python research/action_preflight.py

      - name: Validate research CLI contract
        run: |
          set -euo pipefail
          python research_runner.py --help
          python research_runner.py --league BOTH --preflight-only

      - name: Validate workflow-critical files
        run: |
          set -euo pipefail
          test -s .github/workflows/baseball_research.yml
          test -s .github/workflows/baseball_pit_acquisition.yml
          test -s research_runner.py
          test -s requirements.txt
          test -s requirements-ci.txt
          test -s requirements-pit.txt
          echo 'Baseball Research preflight OK'
