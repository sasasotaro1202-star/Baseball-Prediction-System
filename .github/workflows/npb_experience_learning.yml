name: NPB Experience Learning Loop

on:
  workflow_dispatch:
  push:
    branches:
      - "research/experience-learning-loop-20261001"
    paths:
      - "research/experience_learning.py"
      - "research/experience_learning_gate.py"
      - "tests/test_experience_learning.py"
      - "tests/test_experience_learning_gate.py"
      - ".github/workflows/npb_experience_learning.yml"
  pull_request:
    paths:
      - "research/experience_learning.py"
      - "research/experience_learning_gate.py"
      - "tests/test_experience_learning.py"
      - "tests/test_experience_learning_gate.py"
      - ".github/workflows/npb_experience_learning.yml"
      - "data/experience/experience_ledger.csv"
  workflow_run:
    workflows:
      - NPB Prediction Experience Reconciliation
      - NPB Postgame Experience Reconciliation
    types: [completed]
  schedule:
    - cron: "45 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: npb-experience-learning
  cancel-in-progress: false

jobs:
  learn:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements-ci.txt

      - name: Compile and test experience learner
        run: |
          set -euo pipefail
          python -m compileall -q research/experience_learning.py research/experience_learning_gate.py tests/test_experience_learning.py tests/test_experience_learning_gate.py
          python -m pytest -q tests/test_experience_learning.py tests/test_experience_learning_gate.py

      - name: Detect usable Experience input
        id: experience_input
        run: |
          set -euo pipefail
          if [ ! -s data/experience/experience_ledger.csv ]; then
            echo "No canonical Experience ledger yet; learning publication is deferred."
            echo "has_experience=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rows="$(python - <<'PY'
          import pandas as pd
          from pathlib import Path
          path = Path("data/experience/experience_ledger.csv")
          try:
              df = pd.read_csv(path)
          except Exception as exc:
              raise SystemExit(f"Experience ledger is unreadable: {exc}")
          print(len(df))
          PY
          )"
          echo "experience_rows=$rows"
          if [ "$rows" -le 0 ]; then
            echo "Experience ledger contains zero rows; learning publication is deferred."
            echo "has_experience=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_experience=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PIT-safe learned policy
        if: steps.experience_input.outputs.has_experience == 'true'
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m research.experience_learning \
            --input data/experience/experience_ledger.csv \
            --min-group-rows 30 \
            --prior-strength 50 \
            --correction-strength 0.50 \
            --max-log-ratio 0.35

      - name: Evaluate locked chronological holdout
        if: steps.experience_input.outputs.has_experience == 'true'
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m research.experience_learning_gate \
            --input data/experience/experience_ledger.csv

      - name: Validate learned-policy contract
        if: steps.experience_input.outputs.has_experience == 'true'
        run: |
          set -euo pipefail
          test -s results/experience_learning_policy.json
          test -s results/experience_learning_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          obj = json.loads(Path("results/experience_learning_policy.json").read_text(encoding="utf-8"))
          allowed = {"READY", "INSUFFICIENT_EXPERIENCE", "NO_EXPERIENCE", "NO_MATURED_EXPERIENCE"}
          if obj.get("status") not in allowed:
              raise SystemExit(f"invalid learner status: {obj.get('status')}")

          gate = json.loads(Path("results/experience_learning_gate.json").read_text(encoding="utf-8"))
          if gate.get("promotion_status") not in {"HOLD", "PROMOTION_CANDIDATE"}:
              raise SystemExit(f"invalid experience gate status: {gate.get('promotion_status')}")
          gate_contract = gate.get("selection_contract", {})
          if gate_contract.get("holdout_outcomes_used_to_build_policy") is not False:
              raise SystemExit("holdout outcomes were allowed into policy construction")
          if gate_contract.get("holdout_used_for_parameter_selection") is not False:
              raise SystemExit("holdout was used for parameter selection")
          if gate_contract.get("production_modified") is not False or gate_contract.get("auto_promotion") is not False:
              raise SystemExit("experience gate may not modify or promote production")
          print(json.dumps({
              "gate_status": gate.get("status"),
              "gate_promotion_status": gate.get("promotion_status"),
              "holdout_cases": gate.get("holdout_cases"),
              "improvement": gate.get("improvement"),
              "uncertainty": gate.get("uncertainty"),
          }, ensure_ascii=False, indent=2))

          contract = obj.get("replay_contract", {})
          required = {
              "chronological_prediction_cutoff",
              "experience_available_at_le_prediction_time",
              "current_row_excluded_from_learning",
              "future_outcomes_excluded",
              "production_model_modified",
              "promotion_enabled",
          }
          missing = sorted(required - set(contract))
          if missing:
              raise SystemExit(f"missing replay contract fields: {missing}")
          if contract["chronological_prediction_cutoff"] is not True:
              raise SystemExit("chronological replay contract is not enforced")
          if contract["experience_available_at_le_prediction_time"] is not True:
              raise SystemExit("experience availability PIT contract is not enforced")
          if contract["current_row_excluded_from_learning"] is not True:
              raise SystemExit("current-row leakage guard is not enforced")
          if contract["future_outcomes_excluded"] is not True:
              raise SystemExit("future-outcome leakage guard is not enforced")
          if contract["production_model_modified"] is not False:
              raise SystemExit("learner must not modify production models")
          if contract["promotion_enabled"] is not False:
              raise SystemExit("learner must not auto-promote")
          print(json.dumps({
              "status": obj.get("status"),
              "matured_rows": obj.get("matured_rows"),
              "policy_rows": len(obj.get("policy", {})),
              "replay": obj.get("replay", {}),
              "policy_hash": obj.get("policy_hash"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Persist changed learned policy
        if: github.event_name != 'pull_request' && steps.experience_input.outputs.has_experience == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.experience_input.outputs.has_experience }}" != "true" ]; then
            echo "No eligible Experience input; persistence is deferred."
            exit 0
          fi
          if [ ! -s results/experience_learning_policy.json ]; then
            echo "Learning policy artifact was not produced; persistence is deferred fail-closed."
            exit 0
          fi
          if [ ! -s results/experience_learning_gate.json ]; then
            echo "Learning gate artifact was not produced; persistence is deferred fail-closed."
            exit 0
          fi
          mkdir -p data/experience
          new_hash="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("results/experience_learning_policy.json").read_text(encoding="utf-8")).get("policy_hash", ""))
          PY
          )"

          old_hash=""
          if [ -s data/experience/experience_learning_policy.json ]; then
            old_hash="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              obj=json.loads(Path("data/experience/experience_learning_policy.json").read_text(encoding="utf-8"))
          except Exception:
              obj={}
          print(obj.get("policy_hash",""))
          PY
          )"
          fi

          status="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("results/experience_learning_policy.json").read_text(encoding="utf-8")).get("status",""))
          PY
          )"

          if [ "${status}" != "READY" ]; then
            echo "No publishable learned policy: status=${status}"
            exit 0
          fi

          if [ -n "${new_hash}" ] && [ "${new_hash}" = "${old_hash}" ]; then
            echo "Learned policy hash unchanged; no commit required."
            exit 0
          fi

          cp results/experience_learning_policy.json data/experience/experience_learning_policy.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experience/experience_learning_policy.json
          if git diff --cached --quiet; then
            echo "No policy file changes to commit."
            exit 0
          fi
          git commit -m "Update PIT-safe experience learning policy"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

      - name: Upload experience-learning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npb-experience-learning-${{ github.run_id }}
          path: |
            results/experience_learning_policy.json
            results/experience_learning_replay.csv
            results/experience_learning_gate.json
            data/experience/experience_learning_policy.json
          if-no-files-found: warn
          retention-days: 14
