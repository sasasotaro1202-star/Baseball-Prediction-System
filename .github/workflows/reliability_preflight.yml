name: Reliability Preflight

on:
  push:
    branches: [main]
    paths:
      - "research/action_preflight.py"
      - "tests/test_action_preflight.py"
      - ".github/workflows/**"
      - "requirements-ci.txt"
  pull_request:
    paths:
      - "research/action_preflight.py"
      - "tests/test_action_preflight.py"
      - ".github/workflows/**"
      - "requirements-ci.txt"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reliability-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 --prefer-binary -r requirements-ci.txt

      - name: Run reliability tests
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_action_preflight.py
          python research/action_preflight.py
