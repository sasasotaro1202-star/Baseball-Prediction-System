name: Baseball Scope Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches:
      - "research/**"
    paths:
      - "data/competition_registry.py"
      - "research/scope_discovery.py"
      - "tests/test_scope_discovery.py"
      - "data/espn_baseball_schedule.py"
      - "tests/test_espn_baseball_schedule.py"
      - ".github/workflows/baseball_scope_discovery.yml"

permissions:
  contents: read

concurrency:
  group: baseball-scope-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 pytest pandas

      - name: Compile scope discovery
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m py_compile data/competition_registry.py research/scope_discovery.py tests/test_scope_discovery.py

      - name: Run scope discovery tests
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_scope_discovery.py tests/test_espn_baseball_schedule.py

      - name: Probe public competition sources
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python research/scope_discovery.py

      - name: Probe ESPN MLB game discovery
        id: espn_mlb
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p results/espn
          python -m data.espn_baseball_schedule MLB > results/espn/mlb.json

      - name: Probe ESPN NCAA game discovery
        id: espn_ncaa
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p results/espn
          python -m data.espn_baseball_schedule NCAA > results/espn/ncaa.json

      - name: Preserve ESPN acquisition status
        if: always()
        timeout-minutes: 1
        env:
          ESPN_MLB_OUTCOME: ${{ steps.espn_mlb.outcome }}
          ESPN_NCAA_OUTCOME: ${{ steps.espn_ncaa.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("results/espn")
          rows = {}
          for league in ("mlb", "ncaa"):
              path = root / f"{league}.json"
              if path.exists() and path.stat().st_size > 0:
                  try:
                      payload = json.loads(path.read_text(encoding="utf-8"))
                      rows[league] = {
                          "status": payload.get("status", "UNKNOWN"),
                          "event_count": int(payload.get("event_count", 0) or 0),
                          "pit_status": payload.get("pit_status", "UNVERIFIED"),
                      }
                  except Exception as exc:
                      rows[league] = {
                          "status": "ARTIFACT_INVALID",
                          "error_type": type(exc).__name__,
                      }
              else:
                  outcome = os.environ.get(f"ESPN_{league.upper()}_OUTCOME", "")
                  rows[league] = {
                      "status": "DEFERRED",
                      "step_outcome": outcome or "unknown",
                      "error": "provider acquisition failed or produced no artifact",
                  }

          Path("results/espn/acquisition_status.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "status": "RECORDED",
                  "mlb": rows["mlb"],
                  "ncaa": rows["ncaa"],
                  "non_fatal_provider_failure_allowed": True,
                  "failure_visibility": "EXPLICIT",
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY

      - name: Verify artifact
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python -c 'import json; from pathlib import Path; d=json.loads(Path("results/scope_discovery.json").read_text(encoding="utf-8")); assert d["status"] == "EXECUTED"; assert d["policy"]["production_promotion"] == "NEVER_BY_DISCOVERY"; assert d["policy"]["unknown_pit"] == "FAIL_CLOSED"; print("scope discovery artifact: PASS")'

      - name: Upload discovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: baseball-scope-discovery-${{ github.sha }}
          path: |
            results/scope_discovery.json
            results/espn/*.json
          if-no-files-found: error
          retention-days: 14