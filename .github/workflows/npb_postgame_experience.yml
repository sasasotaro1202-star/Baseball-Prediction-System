name: NPB Postgame Experience Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - "data/experience/predictions/**"
      - "data/experience/research_shadow/predictions/**"
      - ".github/workflows/npb_postgame_experience.yml"
  schedule:
    # Reconcile several times each day so afternoon/evening results are learned quickly.
    # A workflow-file push also forces an immediate fail-closed reconciliation after pipeline repairs.
    # UTC -> JST: 01:30, 04:30, 07:30, 10:30, 13:30, 16:30, 19:30, 22:30.
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npb-postgame-experience
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Reconcile against official completed NPB results
        run: |
          set -euo pipefail
          python -m research.experience_ledger --reconcile

      - name: Build full snapshot experience and situation rollups
        run: |
          set -euo pipefail
          python -m research.experience_rollup

      - name: Audit immutable prediction evidence
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m research.experience_integrity_audit > data/experience/experience_integrity_audit.json
          test -s data/experience/experience_integrity_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("data/experience/experience_integrity_audit.json").read_text(encoding="utf-8"))
          if audit.get("status") not in {"PASS", "PASS_WITH_LEGACY_QUARANTINE", "NO_PREDICTIONS"}:
              raise SystemExit(f"invalid prediction integrity status: {audit.get('status')}")
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          PY

      - name: Reconcile research-shadow experience
        run: |
          set -euo pipefail
          if [ -d data/experience/research_shadow/predictions ]; then
            python -m research.shadow_experience --reconcile
            test -s data/experience/research_shadow/shadow_experience_summary.json
          else
            echo "No research-shadow prediction directory yet."
          fi

      - name: Validate experience evidence
        run: |
          set -euo pipefail
          test -s data/experience/experience_summary.json
          test -s data/experience/experience_case_summary.json
          test -s data/experience/experience_training_index.json
          test -s data/experience/experience_integrity_audit.json
          if [ -f data/experience/experience_ledger.csv ]; then
            test -s data/experience/experience_ledger.csv
            test -s data/experience/experience_ledger.jsonl
          fi
          if [ -f data/experience/snapshot_experience_ledger.csv ]; then
            test -s data/experience/snapshot_experience_ledger.csv
            test -s data/experience/snapshot_experience_ledger.jsonl
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("data/experience/experience_summary.json").read_text(encoding="utf-8"))
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          status = summary.get("status")
          if status not in {"UPDATED", "NO_COMPLETED_RESULTS", "NO_PREDICTIONS"}:
              raise SystemExit(f"invalid experience reconciliation status: {status}")
          if status == "UPDATED" and int(summary.get("matched_rows_total", 0)) <= 0:
              raise SystemExit("updated experience ledger has no matched rows")
          PY

      - name: Commit experience results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated Experience artifacts are derived state. If another
          # workflow updates main between reconciliation and publication,
          # discard the stale local artifacts, reset to the new main tip,
          # rerun the full reconciliation, and republish from a clean tree.
          # This avoids rebasing generated CSV/JSONL artifacts and guarantees
          # deterministic conflict recovery without masking failures.
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              PYTHONPATH=. PYTHONUNBUFFERED=1 python -m research.experience_ledger --reconcile
              PYTHONPATH=. PYTHONUNBUFFERED=1 python -m research.experience_rollup
              if [ -d data/experience/research_shadow/predictions ]; then
                PYTHONPATH=. PYTHONUNBUFFERED=1 python -m research.shadow_experience --reconcile
                test -s data/experience/research_shadow/shadow_experience_summary.json
              fi
              PYTHONPATH=. PYTHONUNBUFFERED=1 python -m research.experience_integrity_audit > data/experience/experience_integrity_audit.json
              test -s data/experience/experience_integrity_audit.json
            fi

            git add data/experience/

            if git diff --cached --quiet; then
              echo "No new postgame experience to commit."
              exit 0
            fi

            git commit -m "Record NPB postgame prediction experience"
            if git push origin HEAD:main; then
              exit 0
            fi

            # Push race: never rebase generated state. Reset to the latest
            # origin/main and recompute all derived artifacts on the next try.
            git reset --hard HEAD^
          done
          exit 1
