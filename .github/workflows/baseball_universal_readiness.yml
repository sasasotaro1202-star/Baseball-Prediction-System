name: Baseball Universal Readiness Audit

on:
  schedule:
    - cron: "31 2 * * *"
  push:
    paths:
      - "research/universal_readiness.py"
      - "research/competition_catalog.py"
      - "research/universal_source_matrix.py"
      - "data/source_registry.py"
      - "tests/test_universal_readiness.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest
      - name: Test readiness state machine
        run: python -m pytest -q tests/test_universal_readiness.py
      - name: Generate readiness report
        run: python -m research.universal_readiness > universal_readiness.json
      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: baseball-universal-readiness
          path: universal_readiness.json
          if-no-files-found: error
          retention-days: 14
