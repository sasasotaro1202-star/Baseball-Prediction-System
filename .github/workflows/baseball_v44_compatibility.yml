name: Baseball v4.4 Bridge Compatibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Baseball sources
        run: python -m compileall -q .

      - name: Run Baseball compatibility tests
        env:
          BASEBALL_TIME_BUDGET_SEC: '120'
        run: python -m pytest -q tests --ignore=tests/test_parallel_smoke.py
