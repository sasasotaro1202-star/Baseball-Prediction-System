name: Baseball Regression Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/baseball_regression_tests.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/baseball_regression_tests.yml'

permissions:
  contents: read

concurrency:
  # Scope cancellation to one ref so PR/main verification cannot cancel
  # another ref regression evidence.
  group: baseball-regression-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile repository
        timeout-minutes: 5
        run: python -m compileall -q .

      - name: Run regression tests
        timeout-minutes: 10
        run: python -m pytest -q tests
