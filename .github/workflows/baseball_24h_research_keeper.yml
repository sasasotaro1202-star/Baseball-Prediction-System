name: Baseball 24h Research Keeper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-24h-research-keeper
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check 24h autopilot state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: baseball_24h_research_autopilot.yml
        shell: bash
        run: |
          set -euo pipefail
          gh_retry() {
            local attempt out rc
            for attempt in 1 2 3 4; do
              if out="$(gh "$@" 2>&1)"; then printf '%s\n' "$out"; return 0; fi
              rc=$?
              echo "gh attempt ${attempt}/4 failed rc=${rc}: ${out}" >&2
              [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
            done
            return "$rc"
          }
          runs="$(gh_retry run list --repo "$GH_REPO" --workflow "$TARGET" --limit 30 --json databaseId,status,conclusion,createdAt,updatedAt)"
          active="$(printf '%s' "$runs" | jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"
          echo "active=${active}"
          if [ "$active" -gt 0 ]; then
            echo '24h autopilot already active.'
            exit 0
          fi
          now="$(date -u +%s)"
          # Reset the failure cooldown after a verified successful autopilot run.
          # Count only failures after the latest success, rather than historical
          # failures in a rolling window that can incorrectly keep the breaker open.
          latest_success_at="$(printf '%s' "$runs" | jq -r '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | last.createdAt // empty')"
          if [ -n "$latest_success_at" ]; then
            latest_success_epoch="$(date -d "$latest_success_at" +%s)"
            failures_after_success="$(printf '%s' "$runs" | jq --argjson cutoff "$latest_success_epoch" '[.[] | select(.conclusion == "failure") | select((.createdAt | fromdateiso8601) > $cutoff)] | length')"
          else
            failures_after_success="$(printf '%s' "$runs" | jq '[.[] | select(.conclusion == "failure")] | length')"
          fi
          echo "latest_success_at=${latest_success_at:-<none>}"
          echo "failures_after_latest_success=${failures_after_success}"
          if [ "$failures_after_success" -ge 3 ]; then
            echo 'Circuit breaker open: three or more consecutive failed autopilot runs since the latest success.' >&2
            exit 1
          fi
          latest="$(printf '%s' "$runs" | jq 'sort_by(.createdAt) | last // {}')"
          latest_conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // empty')"
          echo "latest_conclusion=${latest_conclusion:-<none>}"
          echo 'No active 24h run; dispatching a fresh research window.'
          gh_retry workflow run "$TARGET" --repo "$GH_REPO" --ref main
          verified=0
          for i in 1 2 3 4 5; do
            sleep 3
            active_after="$(gh_retry run list --repo "$GH_REPO" --workflow "$TARGET" --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"
            echo "dispatch verification ${i}/5 active=${active_after}"
            if [ "$active_after" -gt 0 ]; then verified=1; break; fi
          done
          test "$verified" -eq 1
          echo '24h research autopilot dispatch verified.'