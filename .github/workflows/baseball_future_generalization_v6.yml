name: Baseball Future Generalization v6 Research

on:
  pull_request:
    paths:
      - 'research/future_generalization_v2.py'
      - 'research/future_generalization_v6.py'
      - 'research/run_future_generalization_v6_npb.py'
      - 'research/future_generalization_v6_audit.py'
      - 'tests/test_future_generalization_v*.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q tests/test_future_generalization_v2.py tests/test_future_generalization_v6.py

  e2e-npb:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - name: Run NPB v6 end-to-end
        env:
          PIT_SAFE_STARTER_DATA: '0'
          BASEBALL_FAST_OOS: '1'
          BASEBALL_SCORE_FAST_VALIDATION: '1'
        run: python research/run_future_generalization_v6_npb.py
      - name: Audit artifact and generate report
        run: python research/future_generalization_v6_audit.py research_outputs/future_generalization_v6_npb.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: future-generalization-v6-npb
          path: |
            research_outputs/future_generalization_v6_npb.json
            research_outputs/future_generalization_v6_audit.json
            research_outputs/future_generalization_v6_report.md
          if-no-files-found: error
