name: Baseball Universal Scope Matrix Gate

on:
  push:
    paths:
      - "research/competition_catalog.py"
      - "research/universal_source_matrix.py"
      - "data/source_registry.py"
      - "tests/test_universal_source_matrix.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest
      - name: Run universal scope/PIT contract tests
        run: python -m pytest -q tests/test_universal_source_matrix.py
