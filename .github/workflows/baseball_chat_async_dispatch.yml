name: Baseball Chat Async Dispatcher

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: baseball-chat-async-dispatch
  # A newer explicit user command supersedes an older dispatcher waiting on
  # the runner queue. This prevents stale requests from blocking prediction.
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      ${{ github.event.issue.number == 74 &&
      github.event.comment.user.login == 'sasasotaro1202-star' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMAND: ${{ github.event.comment.body }}
      OPERATOR: sasasotaro1202-star
    steps:
      - name: Route exact trusted command
        id: route
        shell: bash
        run: |
          set -euo pipefail
          case "${COMMAND}" in
            "/baseball-async closed-loop")
              echo 'workflow=baseball_closed_loop.yml' >> "${GITHUB_OUTPUT}"
              echo 'label=Closed Loop Research' >> "${GITHUB_OUTPUT}"
              ;;
            "/baseball-async candidate-oos")
              echo 'workflow=baseball_candidate_oos.yml' >> "${GITHUB_OUTPUT}"
              echo 'label=Candidate OOS Validation' >> "${GITHUB_OUTPUT}"
              ;;
            "/baseball-async research-24h")
              echo 'workflow=baseball_24h_research_autopilot.yml' >> "${GITHUB_OUTPUT}"
              echo 'label=24h Research Autopilot' >> "${GITHUB_OUTPUT}"
              ;;
            "/baseball-predict NPB")
              echo 'workflow=baseball_manual_prediction.yml' >> "${GITHUB_OUTPUT}"
              echo 'inputs={"league":"NPB"}' >> "${GITHUB_OUTPUT}"
              echo 'label=Manual NPB Prediction' >> "${GITHUB_OUTPUT}"
              ;;
            "/baseball-predict MLB")
              echo 'workflow=baseball_manual_prediction.yml' >> "${GITHUB_OUTPUT}"
              echo 'inputs={"league":"MLB"}' >> "${GITHUB_OUTPUT}"
              echo 'label=Manual MLB Prediction' >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "ignored=true" >> "${GITHUB_OUTPUT}"
              echo 'No matching trusted async command; no workflow was dispatched.'
              ;;
          esac

      - name: Dispatch heavy work immediately
        if: steps.route.outputs.ignored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: ${{ steps.route.outputs.workflow }}
          TARGET_INPUTS: ${{ steps.route.outputs.inputs }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${TARGET_INPUTS}" ]; then
            payload="$(jq -cn --argjson inputs "${TARGET_INPUTS}" '{ref:"main", inputs:$inputs}')"
            printf '%s' "${payload}" |
              timeout --signal=TERM --kill-after=3s 10s \
                gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "repos/${GH_REPO}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
                --input -
          else
            jq -cn '{ref:"main"}' |
              timeout --signal=TERM --kill-after=3s 10s \
                gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "repos/${GH_REPO}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
                --input -
          fi

          echo "Async request accepted: ${{ steps.route.outputs.label }} dispatched on main. No run polling or completion wait is performed." >> "${GITHUB_STEP_SUMMARY}"

      - name: Record ignored command
        if: steps.route.outputs.ignored == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Async dispatcher ignored an unrecognized command. No workflow was dispatched." >> "${GITHUB_STEP_SUMMARY}"
