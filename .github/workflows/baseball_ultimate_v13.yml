name: Baseball Ultimate Future-Generalization v13

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/future_generalization_v13.py'
      - 'research/ultimate_v13_control.py'
      - 'research/ultimate_v13_operational_controls.py'
      - 'research/ultimate_v13_real_oos.py'
      - 'tests/test_future_generalization_v13.py'
      - 'tests/test_ultimate_v13_control.py'
      - 'tests/test_ultimate_v13_operational_controls.py'
      - 'tests/test_ultimate_v13_real_oos.py'
      - '.github/workflows/baseball_ultimate_v13.yml'
      - 'baseball_backtest.py'

permissions:
  contents: read

concurrency:
  group: baseball-ultimate-v13
  cancel-in-progress: false

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 90 --prefer-binary -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Targeted v13 tests
        run: python -m pytest -q tests/test_future_generalization_v13.py tests/test_ultimate_v13_control.py tests/test_ultimate_v13_operational_controls.py tests/test_ultimate_v13_real_oos.py
      - name: Full regression suite
        run: python -m pytest -q tests
      - name: Research-only E2E
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import json
          from pathlib import Path
          from research.future_generalization_v13 import _self_test
          result = _self_test()
          Path('results/future_generalization_v13_report.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Operational v13 synthetic E2E
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research.ultimate_v13_operational_controls import build_forecast_contract, fallback_policy, output_format
          report = {
              'evidence_scope': 'synthetic_operational_e2e',
              'output_format': output_format(predictability=.58, uncertainty=.42, ood=.12),
              'fallback': fallback_policy(health={'router': True, 'calibration': True}),
              'contract': build_forecast_contract(
                  prediction_time='2026-09-26T12:00:00Z',
                  valid_until='2026-09-26T13:00:00Z',
                  model_version='research-v13', strategy='RESEARCH',
                  output_format_name='PROBABILITY_INTERVAL',
                  confidence=.72, predictability=.58, uncertainty=.42,
                  failure_risk=.18, ood_score=.12, pit_status='PASS',
                  data_snapshot_id='synthetic-v13',
              ),
          }
          Path('results/ultimate_v13_operational_smoke.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
      - name: Real OOS bridge synthetic contract check
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from research.ultimate_v13_real_oos import run_real_oos_bridge
          from pathlib import Path
          base = pd.Timestamp('2026-01-01T00:00:00Z')
          rows = []
          for i in range(120):
              pt = base + pd.Timedelta(hours=i)
              rows.append({
                  'game_id': f'g{i}', 'prediction_time': pt,
                  'available_at': pt - pd.Timedelta(minutes=30),
                  'pred_home': .65, 'pred_away': .35,
                  'actual_home_score': 1 if i % 3 else 0,
                  'actual_away_score': 0 if i % 3 else 1,
              })
          p = Path('results/ultimate_v13_real_oos_smoke.csv')
          p.parent.mkdir(parents=True, exist_ok=True)
          pd.DataFrame(rows).to_csv(p, index=False)
          out = run_real_oos_bridge(p, league='MLB', data_snapshot_id='synthetic-v13')
          if out.get('status') != 'EXECUTED' or out.get('promotion_status') != 'HOLD':
              raise SystemExit('real OOS bridge synthetic contract failed: ' + repr(out))
          if set(out.get('metrics', {})) != {'Accuracy', 'LogLoss', 'Brier', 'ECE'}:
              raise SystemExit('real OOS bridge metric contract failed')
          print('Real OOS bridge synthetic contract: PASS; promotion HOLD')
          PY
      - name: Artifact integrity
        run: |
          set -euo pipefail
          test -s results/future_generalization_v13_report.json
          test -s results/ultimate_v13_operational_smoke.json
          test -s results/ultimate_v13_real_oos_smoke.csv
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/future_generalization_v13_report.json').read_text(encoding='utf-8'))
          required = {'status', 'policy', 'routing', 'predictability', 'failure', 'time_to_failure', 'diagnostic_metrics'}
          missing = required - set(obj)
          if missing:
              raise SystemExit('missing report keys: ' + ','.join(sorted(missing)))
          if obj.get('status') != 'READY':
              raise SystemExit('v13 E2E did not reach READY')
          if abs(sum(obj['routing'].values()) - 1.0) > 1e-9:
              raise SystemExit('routing weights do not sum to one')
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-ultimate-v13-${{ github.run_id }}
          path: |
            results/future_generalization_v13_report.json
            results/ultimate_v13_operational_smoke.json
            results/ultimate_v13_real_oos_smoke.csv
          if-no-files-found: error
          retention-days: 7
