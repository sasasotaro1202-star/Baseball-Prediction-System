name: Baseball Feature-Model Matrix OOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "baseball_backtest.py"
      - "production_npb.py"
      - "research/feature_set_variants.py"
      - "research/feature_set_router.py"
      - "research/feature_model_matrix.py"
      - "scripts/verify_feature_model_matrix.py"
      - "config/feature_model_matrix.json"
      - "evaluation/**"
      - "core/**"
      - "tests/test_feature_set_router.py"
      - "tests/test_feature_set_variants.py"
      - "tests/test_feature_integrity.py"
      - ".github/workflows/baseball_feature_set_oos.yml"

permissions:
  contents: read

concurrency:
  group: baseball-feature-model-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target:
          - npb-linear
          - npb-broad
          - npb-diverse
          - mlb-linear
          - mlb-broad
          - mlb-diverse

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        timeout-minutes: 12
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Verify main snapshot is current
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          echo "expected_sha=$EXPECTED_SHA"
          echo "current_main_sha=$CURRENT_SHA"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "main moved while the matrix run was starting; fail closed" >&2
            exit 1
          fi

      - name: Compile and tests
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m py_compile             baseball_backtest.py             production_npb.py             research/feature_set_variants.py             research/feature_set_router.py             research/feature_model_matrix.py             scripts/verify_feature_model_matrix.py
          python -m pytest -q             tests/test_feature_set_router.py             tests/test_feature_set_variants.py             tests/test_feature_integrity.py

      - name: Stage NPB historical data
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          case "$TARGET" in
            npb-*)
              mkdir -p data
              for year in 2020 2021 2022 2023 2024 2025 2026; do
                if find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" -print -quit | grep -q .; then
                  continue
                fi
                ok=0
                for attempt in 1 2 3; do
                  if timeout --signal=TERM --kill-after=10s 150s gh release download pbp                     --repo armstjc/Nippon-Baseball-Data-Repository                     --pattern "${year}-*_pbp.csv"                     --dir data --clobber; then
                    ok=1
                    break
                  fi
                  sleep $((attempt * 3))
                done
                if [ "$ok" -ne 1 ]; then
                  echo "failed to stage NPB ${year}" >&2
                  exit 1
                fi
              done
              test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -ge 7
              ;;
            mlb-*)
              echo "MLB uses the repository's bounded Stats API loader."
              ;;
            *)
              echo "unknown matrix target: $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Run exhaustive Development OOS matrix
        timeout-minutes: 120
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          TARGET: ${{ matrix.target }}
          BASEBALL_TIME_BUDGET_SEC: "6900"
          BASEBALL_HARD_CAP_SEC: "7200"
          BASEBALL_CATBOOST_DETERMINISTIC: "1"
          BASEBALL_FAST_OOS: "1"
          BASEBALL_SCORE_FAST_VALIDATION: "1"
          PIT_SAFE_STARTER_DATA: "0"
          BASEBALL_MAX_FIT_ROWS: "0"
        run: |
          set -euo pipefail
          case "$TARGET" in
            npb-linear|mlb-linear)
              export LEAGUE=${TARGET%%-*}
              export LEAGUE=${LEAGUE^^}
              export POOL=LINEAR_TREE
              export POOL_NAMES='Logistic,HistGB'
              ;;
            npb-broad|mlb-broad)
              export LEAGUE=${TARGET%%-*}
              export LEAGUE=${LEAGUE^^}
              export POOL=BROAD_TREE
              export POOL_NAMES='Logistic,HistGB,RandomForest,ExtraTrees'
              ;;
            npb-diverse|mlb-diverse)
              export LEAGUE=${TARGET%%-*}
              export LEAGUE=${LEAGUE^^}
              export POOL=DIVERSE
              export POOL_NAMES='Logistic,HistGB,RandomForest,ExtraTrees,KNNAnalog'
              ;;
            *)
              echo "unknown matrix target: $TARGET" >&2
              exit 1
              ;;
          esac
          export BASEBALL_FEATURE_SCREEN_MODEL_POOL="$POOL_NAMES"
          python -m research.feature_model_matrix             --league "$LEAGUE"             --half-life 600             --half-life 900             --half-life 1800             --half-life 3600             --half-life 7200             --model-pool "$POOL"             --max-configs 165             --mlb-start 2020             --mlb-end 2026

      - name: Verify evidence and locked holdout
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            npb-*) FILE=results/feature_model_matrix_npb.json ;;
            mlb-*) FILE=results/feature_model_matrix_mlb.json ;;
            *) echo "invalid target" >&2; exit 1 ;;
          esac
          python scripts/verify_feature_model_matrix.py "$FILE"

      - name: Verify main snapshot after experiment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "main changed during evidence generation; refusing mixed-snapshot evidence" >&2
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-feature-model-matrix-${{ matrix.target }}-${{ github.run_id }}
          path: results/feature_model_matrix_*.json
          if-no-files-found: error
          retention-days: 30
