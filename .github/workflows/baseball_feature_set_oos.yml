name: Baseball Feature Set OOS Comparison

"on":
  push:
    branches: [main]
    paths:
      - "research/feature_set_router.py"
      - "research/feature_set_variants.py"
      - "tests/test_feature_set_router.py"
      - "tests/test_feature_set_variants.py"
      - "baseball_backtest.py"
      - "research/real_data_validation.py"
      - ".github/workflows/baseball_feature_set_oos.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: baseball-feature-set-oos
  cancel-in-progress: false

jobs:
  screen-npb:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile canonical feature-set code and tests
        run: |
          set -euo pipefail
          python -m py_compile baseball_backtest.py production_npb.py research/feature_set_variants.py research/feature_set_router.py research/feature_set_screen.py
          python -m pytest -q tests/test_feature_set_variants.py tests/test_feature_set_router.py tests/test_feature_integrity.py

      - name: Stage NPB historical PBP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            if find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" -print -quit | grep -q .; then
              continue
            fi
            ok=0
            for attempt in 1 2 3; do
              if timeout --signal=TERM --kill-after=10s 150s gh release download pbp                 --repo armstjc/Nippon-Baseball-Data-Repository                 --pattern "${year}-*_pbp.csv"                 --dir data --clobber; then
                ok=1
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$ok" -ne 1 ]; then
              echo "failed to stage NPB ${year}" >&2
              exit 1
            fi
          done
          test "$(find data -maxdepth 1 -name "*_pbp.csv" | wc -l | tr -d " ")" -ge 7

      - name: Run all registered feature-set variants on identical chronological folds
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          BASEBALL_FEATURE_SET_VARIANT: "FULL_VALIDATED_ENSEMBLE"
          BASEBALL_FAST_OOS: "1"
          BASEBALL_TIME_BUDGET_SEC: "2400"
          BASEBALL_HARD_CAP_SEC: "3000"
          NPB_RETRAIN_EVERY: "250"
          BASEBALL_CATBOOST_DETERMINISTIC: "1"
          PIT_SAFE_STARTER_DATA: "0"
        run: |
          set -euo pipefail
          python -m research.feature_set_screen --data-dir data

      - name: Verify screening result
        run: |
          set -euo pipefail
          test -s results/feature_set_screening.json
          test -s results/feature_set_screening.csv
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/feature_set_screening.json").read_text(encoding="utf-8"))
          assert d.get("status") == "SCREENING_COMPLETED"
          assert d.get("production_promotion") == "NOT_RUN"
          from research.feature_set_variants import SCREENING_VARIANTS
          assert int(d.get("variants_tested", 0)) == len(SCREENING_VARIANTS)
          assert int(d.get("variants_tested", 0)) >= 30
          results=d["results"]
          assert results[0]["mean_metrics"]["LogLoss"] == min(r["mean_metrics"]["LogLoss"] for r in results)
          print(json.dumps({
              "variants_tested": d["variants_tested"],
              "winner_by_mean_logloss": d["winner_by_mean_logloss"],
              "baseline_logloss": d["baseline_mean_logloss"],
              "results": [
                  {
                      "variant": r["feature_set_variant"],
                      "features": r["feature_count"],
                      "logloss": r["mean_metrics"]["LogLoss"],
                      "brier": r["mean_metrics"]["Brier"],
                      "accuracy": r["mean_metrics"]["Accuracy"],
                      "ece": r["mean_metrics"]["ECE"],
                      "newest_logloss": r["newest_fold_metrics"]["LogLoss"],
                      "rel_improvement": r["relative_logloss_improvement_vs_baseline"],
                  }
                  for r in results
              ]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Write screening summary
        if: always()
        run: |
          {
            echo "## NPB Feature Set Screening"
            if [ -s results/feature_set_screening.json ]; then
              cat results/feature_set_screening.json
            else
              echo "Result: NOT PRODUCED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screening evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-feature-set-screening-${{ github.run_id }}
          path: |
            results/feature_set_screening.json
            results/feature_set_screening.csv
            results/**
          if-no-files-found: warn
          retention-days: 30
