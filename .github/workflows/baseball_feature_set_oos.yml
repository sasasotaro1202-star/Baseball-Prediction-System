name: Baseball Feature-Model Matrix OOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "baseball_backtest.py"
      - "production_npb.py"
      - "research/feature_set_variants.py"
      - "research/feature_set_router.py"
      - "research/feature_model_matrix.py"
      - "scripts/verify_feature_model_matrix.py"
      - "evaluation/**"
      - "core/**"
      - "config/feature_policy.json"
      - "tests/test_feature_set_router.py"
      - "tests/test_feature_set_variants.py"
      - ".github/workflows/baseball_feature_set_oos.yml"

permissions:
  contents: read

concurrency:
  group: baseball-feature-model-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        league: [NPB, MLB]
        model_pool: [LINEAR_TREE, BROAD_TREE, DIVERSE]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Verify main snapshot is evidence-current
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current_main="$(git rev-parse origin/main)"
          echo "matrix_snapshot_sha=$GITHUB_SHA"
          echo "current_main_sha=$current_main"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Feature/model matrix snapshot is stale; refusing mixed-snapshot evidence." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        timeout-minutes: 12
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile and feature tests
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m py_compile baseball_backtest.py production_npb.py research/feature_set_variants.py research/feature_set_router.py research/feature_model_matrix.py scripts/verify_feature_model_matrix.py
          python -m pytest -q tests/test_feature_set_router.py tests/test_feature_set_variants.py tests/test_feature_integrity.py

      - name: Stage NPB historical data
        if: matrix.league == 'NPB'
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            if find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" -print -quit | grep -q .; then
              continue
            fi
            ok=0
            for attempt in 1 2 3; do
              if timeout --signal=TERM --kill-after=10s 150s gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber; then
                ok=1
                break
              fi
              [ "$attempt" -lt 3 ] && sleep $((attempt * 3))
            done
            if [ "$ok" -ne 1 ]; then
              echo "failed to stage NPB ${year}" >&2
              exit 1
            fi
          done
          test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -ge 7

      - name: Run matrix experiment
        timeout-minutes: 115
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          BASEBALL_TIME_BUDGET_SEC: "6600"
          BASEBALL_HARD_CAP_SEC: "6900"
          BASEBALL_CATBOOST_DETERMINISTIC: "1"
          BASEBALL_FAST_OOS: "1"
          BASEBALL_SCORE_FAST_VALIDATION: "1"
          PIT_SAFE_STARTER_DATA: "0"
          BASEBALL_MAX_FIT_ROWS: "0"
        shell: bash
        run: |
          set -euo pipefail
          python -m research.feature_model_matrix --league "${{ matrix.league }}" --half-life 600 --half-life 900 --half-life 1800 --half-life 3600 --half-life 7200 --model-pool "${{ matrix.model_pool }}" --max-configs 165 --mlb-start 2020 --mlb-end 2026

      - name: Verify research-only decision
        shell: bash
        run: |
          set -euo pipefail
          lower="$(printf '%s' "${{ matrix.league }}" | tr '[:upper:]' '[:lower:]')"
          python scripts/verify_feature_model_matrix.py "results/feature_model_matrix_${lower}.json" "${{ matrix.model_pool }}"

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-feature-model-matrix-${{ matrix.league }}-${{ matrix.model_pool }}-${{ github.run_id }}
          path: results/feature_model_matrix_*.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "## Baseball Feature × Model Matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "League: ${{ matrix.league }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Model pool: ${{ matrix.model_pool }}" >> "$GITHUB_STEP_SUMMARY"
          if ls results/feature_model_matrix_*.json >/dev/null 2>&1; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat results/feature_model_matrix_*.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
