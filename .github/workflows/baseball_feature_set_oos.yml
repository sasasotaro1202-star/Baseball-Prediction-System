name: Baseball Feature-Model Matrix OOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "baseball_backtest.py"
      - "production_npb.py"
      - "research/feature_set_variants.py"
      - "research/feature_set_router.py"
      - "research/feature_model_matrix.py"
      - "config/feature_model_matrix.json"
      - "evaluation/**"
      - "core/**"
      - "tests/test_feature_set_router.py"
      - "tests/test_feature_set_variants.py"
      - "tests/test_feature_integrity.py"
      - ".github/workflows/baseball_feature_set_oos.yml"

permissions:
  contents: read

concurrency:
  group: baseball-feature-model-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - league: NPB
            model_pool: LINEAR_TREE
            model_names: "Logistic,HistGB"
            output_file: feature_model_matrix_npb.json
          - league: NPB
            model_pool: BROAD_TREE
            model_names: "Logistic,HistGB,RandomForest,ExtraTrees"
            output_file: feature_model_matrix_npb.json
          - league: NPB
            model_pool: DIVERSE
            model_names: "Logistic,HistGB,RandomForest,ExtraTrees,KNNAnalog"
            output_file: feature_model_matrix_npb.json
          - league: MLB
            model_pool: LINEAR_TREE
            model_names: "Logistic,HistGB"
            output_file: feature_model_matrix_mlb.json
          - league: MLB
            model_pool: BROAD_TREE
            model_names: "Logistic,HistGB,RandomForest,ExtraTrees"
            output_file: feature_model_matrix_mlb.json
          - league: MLB
            model_pool: DIVERSE
            model_names: "Logistic,HistGB,RandomForest,ExtraTrees,KNNAnalog"
            output_file: feature_model_matrix_mlb.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        timeout-minutes: 12
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile and tests
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m py_compile             baseball_backtest.py             production_npb.py             research/feature_set_variants.py             research/feature_set_router.py             research/feature_model_matrix.py
          python -m pytest -q             tests/test_feature_set_router.py             tests/test_feature_set_variants.py             tests/test_feature_integrity.py

      - name: Stage NPB historical data
        if: matrix.league == 'NPB'
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            if find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" -print -quit | grep -q .; then
              continue
            fi
            ok=0
            for attempt in 1 2 3; do
              if timeout --signal=TERM --kill-after=10s 150s gh release download pbp                 --repo armstjc/Nippon-Baseball-Data-Repository                 --pattern "${year}-*_pbp.csv"                 --dir data --clobber; then
                ok=1
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$ok" -ne 1 ]; then
              echo "failed to stage NPB ${year}" >&2
              exit 1
            fi
          done
          test "$(find data -maxdepth 1 -name "*_pbp.csv" | wc -l | tr -d ' ')" -ge 7

      - name: Run exhaustive Development OOS matrix
        timeout-minutes: 120
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          BASEBALL_FEATURE_SCREEN_MODEL_POOL: ${{ matrix.model_names }}
          BASEBALL_TIME_BUDGET_SEC: "6900"
          BASEBALL_HARD_CAP_SEC: "7200"
          BASEBALL_CATBOOST_DETERMINISTIC: "1"
          BASEBALL_FAST_OOS: "1"
          BASEBALL_SCORE_FAST_VALIDATION: "1"
          PIT_SAFE_STARTER_DATA: "0"
          BASEBALL_MAX_FIT_ROWS: "0"
        run: |
          set -euo pipefail
          python -m research.feature_model_matrix             --league "${{ matrix.league }}"             --half-life 600             --half-life 900             --half-life 1800             --half-life 3600             --half-life 7200             --model-pool "${{ matrix.model_pool }}"             --max-configs 165             --mlb-start 2020             --mlb-end 2026

      - name: Verify evidence and research-only gate
        run: |
          set -euo pipefail
          test -s "results/${{ matrix.output_file }}"
          python - <<'PY'
import json
from pathlib import Path

path = Path("results") / "${{ matrix.output_file }}"
obj = json.loads(path.read_text(encoding="utf-8"))

if obj.get("status") != "RESEARCH_ONLY":
    raise SystemExit("matrix result is not research-only")
if obj.get("decision") != "NO_AUTO_ADOPTION":
    raise SystemExit("automatic adoption is forbidden")
if obj.get("selection_basis") != "Development OOS only":
    raise SystemExit("selection basis is not Development OOS only")
if not obj.get("holdout_locked_before_selection"):
    raise SystemExit("locked holdout contract missing")
if obj.get("matrix_size_executed", 0) < 1:
    raise SystemExit("no matrix configurations executed")
if obj.get("successful_configs", 0) < 1:
    raise SystemExit("no successful matrix configurations")
print(json.dumps({
    "league": obj.get("league"),
    "model_pool": "${{ matrix.model_pool }}",
    "matrix_requested": obj.get("matrix_size_requested"),
    "matrix_executed": obj.get("matrix_size_executed"),
    "successful": obj.get("successful_configs"),
    "failed": obj.get("failed_configs"),
    "winner": obj.get("winner", {}).get("config_id"),
    "holdout_rows": obj.get("locked_holdout_rows"),
}, ensure_ascii=False, indent=2))
PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-feature-model-matrix-${{ matrix.league }}-${{ matrix.model_pool }}-${{ github.run_id }}
          path: results/feature_model_matrix_*.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Baseball Feature × Model Matrix"
            echo "League: ${{ matrix.league }}"
            echo "Model pool: ${{ matrix.model_pool }}"
            if [ -s "results/${{ matrix.output_file }}" ]; then
              echo "### Result"
              python - <<'PY'
import json
from pathlib import Path
obj = json.loads((Path("results") / "${{ matrix.output_file }}").read_text(encoding="utf-8"))
print(json.dumps({
    "status": obj.get("status"),
    "executed": obj.get("matrix_size_executed"),
    "successful": obj.get("successful_configs"),
    "winner": obj.get("winner", {}).get("config_id"),
    "holdout_rows": obj.get("locked_holdout_rows"),
}, ensure_ascii=False, indent=2))
PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
