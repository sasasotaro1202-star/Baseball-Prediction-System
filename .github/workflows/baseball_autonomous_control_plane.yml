name: Baseball Autonomous Control Plane

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  # The control plane is intentionally schedule-driven. Target workflow_run
  # completions are too bursty and caused self-cancellation/queue storms.
  # The 15-minute loop is the single orchestration heartbeat; target workflows
  # retain their own workflow_run hooks for evidence-specific tasks.
permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-autonomous-control-plane
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install control-plane test dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 "pytest>=8.3,<9"

      - name: Run control-plane unit tests
        id: control_plane_tests
        run: |
          set -euo pipefail
          python -m py_compile research/autonomous_control_plane.py tests/test_autonomous_control_plane.py
          python -m pytest -q tests/test_autonomous_control_plane.py

      - name: Preserve test-failure evidence
        if: ${{ failure() && steps.control_plane_tests.outcome == 'failure' }}
        run: |
          set -euo pipefail
          mkdir -p results/control_plane
          python -c 'import json, os; from pathlib import Path; Path("results/control_plane/test_failure.json").write_text(json.dumps({"schema_version": 1, "status": "FAILED", "reason": "control_plane_unit_tests_failed", "git_commit": os.environ["GITHUB_SHA"]}, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")'

      - name: Execute bounded autonomous control plane
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m research.autonomous_control_plane --repo "${GITHUB_REPOSITORY}" --output results/control_plane/autonomous_control_plane.json --max-dispatches-per-cycle 2

      - name: Publish control-plane summary
        if: always()
        run: |
          set -euo pipefail
          report="results/control_plane/autonomous_control_plane.json"
          if [ -s "$report" ]; then
            python -c 'import json, os; d=json.load(open("results/control_plane/autonomous_control_plane.json", encoding="utf-8")); out=open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8"); out.write("## Baseball Autonomous Control Plane\n"); out.write("- status: " + str(d.get("control_plane_status")) + "\n"); out.write("- dispatches: " + str(d.get("cycle_dispatch_count")) + "\n"); out.write("- heavy_dispatches: " + str(d.get("cycle_heavy_dispatch_count")) + "\n"); [out.write("- " + str(x.get("workflow")) + ": " + str(x.get("decision")) + " (" + str(x.get("reason")) + ")\n") for x in d.get("targets", [])]; out.close()'
          else
            echo "## Baseball Autonomous Control Plane" >> "$GITHUB_STEP_SUMMARY"
            echo "- status: FAILED_BEFORE_EXECUTION" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload control-plane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-autonomous-control-plane-${{ github.run_id }}
          path: results/control_plane/
          if-no-files-found: warn
          retention-days: 14
