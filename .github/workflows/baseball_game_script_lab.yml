name: Baseball Game Script Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: baseball-game-script-lab
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'

jobs:
  game-script:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Verify snapshot did not move
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q tests/test_game_script_lab.py

      - name: Stage historical NPB PBP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            found="$(find data -maxdepth 1 -name "$year-*_pbp.csv" | wc -l | tr -d ' ')"
            if [ "$found" -gt 0 ]; then
              continue
            fi
            gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository \
              --pattern "$year-*_pbp.csv" --dir data --clobber
          done
          test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -gt 0

      - name: State reconstruction and PIT gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from research.game_script_lab import load_pbp, resolve_columns, build_half_innings
          raw, files = load_pbp(Path("data"))
          columns = resolve_columns(raw)
          halves = build_half_innings(raw, columns)
          if (halves[["home_runs","away_runs"]] < 0).any().any():
              raise SystemExit("negative run delta")
          print(json.dumps({
              "raw_rows": int(len(raw)),
              "half_inning_rows": int(len(halves)),
              "files": [str(path) for path in files],
              "transition_pit": "PASS_FOR_TRANSITION_LEARNING",
              "production_pregame_pit": "UNVERIFIABLE"
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run chronological OOS and Monte Carlo
        env:
          GAME_SCRIPT_SIMULATIONS: '2500'
        run: python -u -m research.game_script_lab --data-dir data --output-dir results/game_script_lab --git-commit "$GITHUB_SHA"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-game-script-lab
          path: results/game_script_lab/**
          if-no-files-found: warn
          retention-days: 14
