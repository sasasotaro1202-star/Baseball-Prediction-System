name: Baseball Workflow Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go version
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          test -x "$(go env GOPATH)/bin/actionlint"

      - name: Validate all workflows
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" -color