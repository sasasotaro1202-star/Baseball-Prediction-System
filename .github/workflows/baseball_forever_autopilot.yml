name: Baseball Forever Autopilot

# Single lightweight liveness entrypoint. The forever heartbeat is the single orchestration entrypoint; it executes the bounded control plane locally.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/baseball_forever_autopilot.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-forever-autopilot
  cancel-in-progress: true

jobs:
  heartbeat:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify current main snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current_sha"
          echo "current_main_sha=$current_sha" >> "$GITHUB_OUTPUT"
          if [ "$current_sha" != "$EVENT_SHA" ]; then
            echo "event snapshot is superseded; refusing orchestration"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"

      - name: Checkout current main
        if: steps.snapshot.outputs.superseded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Execute bounded autonomous control plane
        id: control_plane
        if: steps.snapshot.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/forever_autopilot results/control_plane
          set +e
          python -m research.autonomous_control_plane --repo "${GITHUB_REPOSITORY}" --output results/control_plane/forever_autonomous_control_plane.json --max-dispatches-per-cycle 2 > results/control_plane/forever_runtime.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - "$rc" <<'PY'
import json
import os
import sys
from pathlib import Path
Path("results/control_plane/forever_runtime_failure.json").write_text(json.dumps({
    "schema_version": 1,
    "status": "FAILED",
    "failure_class": "FOREVER_AUTONOMOUS_CONTROL_PLANE",
    "exit_code": int(sys.argv[1]),
    "git_commit": os.environ.get("GITHUB_SHA"),
    "log_path": "results/control_plane/forever_runtime.log",
}, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
PY
            echo "Autonomous control plane failed; preserving failure evidence." >&2
            exit "$rc"
          fi

      - name: Publish control-plane heartbeat evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s results/control_plane/forever_autonomous_control_plane.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
import json
from pathlib import Path
d=json.loads(Path("results/control_plane/forever_autonomous_control_plane.json").read_text(encoding="utf-8"))
print("## Baseball Forever Autopilot")
print(f"- control_plane_status: {d.get('control_plane_status')}")
print(f"- cycle_dispatch_count: {d.get('cycle_dispatch_count')}")
print(f"- cycle_heavy_dispatch_count: {d.get('cycle_heavy_dispatch_count')}")
print(f"- deterministic_failure_targets: {len(d.get('deterministic_failure_targets', []))}")
print("- fail_closed: true")
print("- auto_promotion: false")
PY
          else
            echo "## Baseball Forever Autopilot" >> "$GITHUB_STEP_SUMMARY"
            echo "- control_plane_status: FAILED_OR_SUPERSEDED" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Supervise user prediction request
        id: request_watchdog
        if: steps.snapshot.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          REQUEST_WORKFLOW: baseball-user-prediction-request.yml
          REQUEST_FILE: prediction_requests/inbox/active.json
          REQUEST_STALE_MINUTES: "20"
          REQUEST_FAILURE_COOLDOWN_MINUTES: "10"
          REQUEST_DAILY_DISPATCH_CAP: "4"
        shell: bash
        run: |
          set -euo pipefail

          gh_retry() {
            local attempt out rc
            for attempt in 1 2 3 4; do
              if out="$(gh "$@" 2>&1)"; then
                printf '%s\n' "$out"
                return 0
              fi
              rc=$?
              echo "gh attempt $attempt/4 failed rc=$rc: $out" >&2
              if printf '%s' "$out" | grep -Eq 'HTTP (400|401|403|404)' &&
                 ! printf '%s' "$out" | grep -Eq 'HTTP (408|409|429)'; then
                return "$rc"
              fi
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 2))
              else
                return "$rc"
              fi
            done
          }

          now="$(date -u +%s)"
          current_sha="$(gh_retry api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current_sha"
          if [ "$current_sha" != "$EVENT_SHA" ]; then
            echo "current main advanced during this run; preserving fail-closed state" >&2
            exit 0
          fi

          mkdir -p results/forever_autopilot
          request_id="$(gh_retry api "repos/$GH_REPO/contents/$REQUEST_FILE?ref=main" --jq '.content' | tr -d '\n' | base64 --decode | jq -r '.request_id // empty')"
          test -n "$request_id"
          request_result="prediction_requests/results/${request_id}.json"
          request_result_exists=0
          if gh_retry api "repos/$GH_REPO/contents/${request_result}?ref=main" --silent >/dev/null 2>&1; then
            request_result_exists=1
          fi

          request_runs="$(gh_retry api "repos/$GH_REPO/actions/workflows/$REQUEST_WORKFLOW/runs?branch=main&per_page=30")"
          request_dispatch_count="$(printf '%s' "$request_runs" | jq --argjson now "$now" '[.workflow_runs[] | select((.created_at | fromdateiso8601) >= ($now - 86400))] | length')"
          request_latest="$(printf '%s' "$request_runs" | jq -c '.workflow_runs | sort_by(.created_at) | reverse | .[0] // {}')"
          request_latest_id="$(printf '%s' "$request_latest" | jq -r '.id // empty')"
          request_latest_status="$(printf '%s' "$request_latest" | jq -r '.status // empty')"
          request_latest_conclusion="$(printf '%s' "$request_latest" | jq -r '.conclusion // empty')"
          request_latest_created="$(printf '%s' "$request_latest" | jq -r '.created_at // empty')"
          request_latest_sha="$(printf '%s' "$request_latest" | jq -r '.head_sha // empty')"
          request_age=999999
          if [ -n "$request_latest_created" ]; then
            request_age=$(( (now - $(date -d "$request_latest_created" +%s)) / 60 ))
          fi

          request_bootstrap=0
          request_cancel=0
          request_reason="request_result_present"
          if [ "$request_result_exists" -eq 1 ]; then
            request_reason="request_result_present"
          elif [ "$request_dispatch_count" -ge "$REQUEST_DAILY_DISPATCH_CAP" ]; then
            request_reason="request_daily_dispatch_cap_reached"
          elif [ "$request_latest_status" = "queued" ] || [ "$request_latest_status" = "pending" ] || [ "$request_latest_status" = "waiting" ] || [ "$request_latest_status" = "requested" ] || [ "$request_latest_status" = "in_progress" ]; then
            if [ "$request_age" -ge "$REQUEST_STALE_MINUTES" ]; then
              request_bootstrap=1
              request_cancel=1
              request_reason="stale_request_run"
            else
              request_reason="active_request_run"
            fi
          elif [ -z "$request_latest_id" ]; then
            request_bootstrap=1
            request_reason="no_request_run"
          elif [ "$request_latest_conclusion" = "failure" ] || [ "$request_latest_conclusion" = "startup_failure" ] || [ "$request_latest_conclusion" = "timed_out" ] || [ "$request_latest_conclusion" = "cancelled" ]; then
            if [ "$request_age" -ge "$REQUEST_FAILURE_COOLDOWN_MINUTES" ]; then
              request_bootstrap=1
              request_reason="recoverable_request_terminal_state"
            else
              request_reason="request_failure_cooldown"
            fi
          else
            request_reason="request_run_not_successfully_archived"
          fi

          request_verified_run_id=""
          request_rerun_attempt=""
          if [ "$request_cancel" -eq 1 ] && [ -n "$request_latest_id" ]; then
            gh_retry run cancel "$request_latest_id" --repo "$GH_REPO"
          fi
          if [ "$request_bootstrap" -eq 1 ]; then
            if [ -z "$request_latest_id" ]; then
              request_reason="no_existing_request_run_to_rerun"
            elif [ "$request_latest_sha" != "$current_sha" ]; then
              request_reason="latest_request_run_superseded"
            else
              request_rerun_attempt="$(gh_retry api "repos/$GH_REPO/actions/runs/$request_latest_id" --jq '.run_attempt')"
              gh_retry run rerun "$request_latest_id" --repo "$GH_REPO"
              for attempt in 1 2 3 4 5; do
                sleep 2
                current_attempt="$(gh_retry api "repos/$GH_REPO/actions/runs/$request_latest_id" --jq '.run_attempt')"
                if [ "$current_attempt" -gt "$request_rerun_attempt" ]; then
                  request_verified_run_id="$request_latest_id"
                  break
                fi
              done
              if [ -z "$request_verified_run_id" ]; then
                echo "request run rerun accepted but run attempt did not advance" >&2
                exit 1
              fi
            fi
          fi

          jq -n \
            --arg current "$current_sha" \
            --arg event "$EVENT_SHA" \
            --arg request_id "$request_id" \
            --arg latest_id "$request_latest_id" \
            --arg latest_status "$request_latest_status" \
            --arg latest_conclusion "$request_latest_conclusion" \
            --arg latest_sha "$request_latest_sha" \
            --arg reason "$request_reason" \
            --arg verified "$request_verified_run_id" \
            --arg rerun_attempt "$request_rerun_attempt" \
            --argjson result_exists "$request_result_exists" \
            --argjson age "$request_age" \
            --argjson dispatch_count "$request_dispatch_count" \
            --argjson bootstrap "$request_bootstrap" \
            --argjson cancel "$request_cancel" \
            '{schema_version:1,status:"EXECUTED",current_main_sha:$current,event_sha:$event,request_id:$request_id,result_exists:($result_exists==1),latest_run_id:$latest_id,latest_status:$latest_status,latest_conclusion:$latest_conclusion,latest_head_sha:$latest_sha,latest_age_minutes:$age,workflow_runs_24h:$dispatch_count,decision:$reason,bootstrapped:($bootstrap==1),cancelled_stale_run:($cancel==1),verified_rerun_run:$verified,run_attempt_before_rerun:$rerun_attempt,fail_closed:true,production_mutation:false}' > results/forever_autopilot/request_watchdog.json

          control_status="UNVERIFIABLE"
          if [ -s results/control_plane/forever_autonomous_control_plane.json ]; then
            control_status="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("results/control_plane/forever_autonomous_control_plane.json").read_text(encoding="utf-8")).get("control_plane_status", "UNVERIFIABLE"))')"
          fi
          jq -n \
            --arg current "$current_sha" \
            --arg event "$EVENT_SHA" \
            --arg control_status "$control_status" \
            '{schema_version:1,status:"EXECUTED",current_main_sha:$current,event_sha:$event,control_plane_status:$control_status,request_watchdog:true,fail_closed:true,auto_promotion:false}' > results/forever_autopilot/heartbeat.json

      - name: Upload heartbeat evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-forever-autopilot-${{ github.run_id }}
          path: results/forever_autopilot/
          if-no-files-found: warn
          retention-days: 14
