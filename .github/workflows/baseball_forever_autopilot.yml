name: Baseball Forever Autopilot

# Registration bootstrap: this workflow intentionally has a narrow push trigger so
# its first commit can create a live heartbeat even when legacy workflow
# registrations or scheduled delivery are unhealthy.

# Registration bootstrap: this workflow intentionally has a narrow push trigger so
# its first commit can create a live heartbeat even when legacy workflow
# registrations or scheduled delivery are unhealthy.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/baseball_forever_autopilot.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-forever-autopilot
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bootstrap canonical control plane
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          now_epoch="$(date +%s)"
          current_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test -n "${current_sha}"

          workflow="baseball_autonomous_control_plane_canonical.yml"
          runs_json="$(gh run list --repo "${GH_REPO}" --workflow "${workflow}" --branch main --limit 30 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,event)"
          test -n "${runs_json}"

          active_count="$(printf '%s' "${runs_json}" | jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"
          latest_json="$(printf '%s' "${runs_json}" | jq -c 'sort_by(.createdAt) | last // {}')"
          latest_id="$(printf '%s' "${latest_json}" | jq -r '.databaseId // empty')"
          latest_status="$(printf '%s' "${latest_json}" | jq -r '.status // empty')"
          latest_created="$(printf '%s' "${latest_json}" | jq -r '.createdAt // empty')"
          latest_sha="$(printf '%s' "${latest_json}" | jq -r '.headSha // empty')"

          latest_age_minutes=999999
          if [ -n "${latest_created}" ]; then
            latest_epoch="$(date -d "${latest_created}" +%s)"
            latest_age_minutes=$(( (now_epoch - latest_epoch) / 60 ))
          fi

          dispatch_24h_count="$(printf '%s' "${runs_json}" | jq '[.[] | select(.event == "workflow_dispatch") | select((.createdAt | fromdateiso8601) >= (now - 86400))] | length')"

          bootstrap=0
          reason="healthy_or_active"

          active_json="$(printf '%s' "${runs_json}" | jq -c '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | sort_by(.createdAt) | reverse | .[0] // {}')"
          active_id="$(printf '%s' "${active_json}" | jq -r '.databaseId // empty')"
          active_status="$(printf '%s' "${active_json}" | jq -r '.status // empty')"
          active_created="$(printf '%s' "${active_json}" | jq -r '.createdAt // empty')"
          active_sha="$(printf '%s' "${active_json}" | jq -r '.headSha // empty')"
          active_age_minutes=0
          if [ -n "${active_created}" ]; then
            active_epoch="$(date -d "${active_created}" +%s)"
            active_age_minutes=$(( (now_epoch - active_epoch) / 60 ))
          fi

          if [ "${dispatch_24h_count}" -ge 3 ]; then
            reason="bootstrap_daily_cap_reached"
          elif [ -n "${active_id}" ] && [ -n "${active_sha}" ] && [ "${active_sha}" != "${current_sha}" ]; then
            bootstrap=1
            reason="active_control_plane_on_superseded_sha"
          elif [ -n "${active_id}" ] && { [ "${active_status}" = "queued" ] || [ "${active_status}" = "pending" ] || [ "${active_status}" = "waiting" ] || [ "${active_status}" = "requested" ]; } && [ "${active_age_minutes}" -ge 20 ]; then
            bootstrap=1
            reason="control_plane_scheduler_stuck"
          elif [ -n "${active_id}" ] && [ "${active_status}" = "in_progress" ] && [ "${active_age_minutes}" -ge 15 ]; then
            bootstrap=1
            reason="control_plane_runtime_stale"
          elif [ "${active_count}" -gt 0 ]; then
            reason="control_plane_active"
          elif [ -z "${latest_id}" ]; then
            reason="bootstrap_daily_cap_reached"
          elif [ -z "${latest_id}" ]; then
            bootstrap=1
            reason="no_control_plane_history"
          elif [ -n "${latest_sha}" ] && [ "${latest_sha}" != "${current_sha}" ]; then
            bootstrap=1
            reason="latest_control_plane_on_superseded_sha"
          elif [ "${latest_status}" = "completed" ] && [ "${latest_age_minutes}" -ge 20 ]; then
            bootstrap=1
            reason="control_plane_heartbeat_stale"
          fi

          if [ "${bootstrap}" -eq 1 ]; then
            echo "Bootstrapping canonical control plane: ${reason}"
            if [ -n "${active_id}" ]; then
              echo "Cancelling stale/superseded control-plane run ${active_id}"
              gh run cancel "${active_id}" --repo "${GH_REPO}"
            fi
            gh workflow run "${workflow}" --repo "${GH_REPO}" --ref main

            verified=0
            for attempt in 1 2 3 4 5 6; do
              sleep 2
              fresh="$(gh run list --repo "${GH_REPO}" --workflow "${workflow}" --branch main --limit 10 --json databaseId,status,conclusion,createdAt,event)"
              new_id="$(printf '%s' "${fresh}" | jq -r --argjson cutoff "${now_epoch}" '[.[] | select(.event == "workflow_dispatch") | select((.createdAt | fromdateiso8601) >= $cutoff)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
              active_after="$(printf '%s' "${fresh}" | jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")] | length')"
              echo "bootstrap verification ${attempt}/6: new_run=${new_id:-<none>} active=${active_after}"
              if [ -n "${new_id}" ] || [ "${active_after}" -gt 0 ]; then
                verified=1
                break
              fi
            done
            if [ "${verified}" -ne 1 ]; then
              echo "Control-plane dispatch was accepted but no run was observable." >&2
              exit 1
            fi
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap_reason=${reason}" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            echo "bootstrap_reason=${reason}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bounded autonomous control plane
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/forever_autopilot

          cap=2
          if [ "${{ steps.bootstrap.outputs.bootstrapped }}" = "true" ]; then
            cap=1
          fi

          set +e
          python -m research.autonomous_control_plane \
            --repo "${GITHUB_REPOSITORY}" \
            --output results/forever_autopilot/control_plane.json \
            --max-dispatches-per-cycle "${cap}" \
            2>&1 | tee results/forever_autopilot/control_plane.log
          rc="${PIPESTATUS[0]}"
          set -e

          if [ "${rc}" -ne 0 ]; then
            python - "${rc}" "${{ steps.bootstrap.outputs.bootstrap_reason }}" <<'PY'
import json
import os
import sys
from pathlib import Path

Path("results/forever_autopilot/runtime_failure.json").write_text(
    json.dumps(
        {
            "schema_version": 1,
            "status": "FAILED",
            "failure_class": "FOREVER_AUTOPILOT_CONTROL_PLANE",
            "exit_code": int(sys.argv[1]),
            "bootstrap_reason": sys.argv[2],
            "git_commit": os.environ.get("GITHUB_SHA"),
        },
        ensure_ascii=False,
        indent=2,
    )
    + "\\n",
    encoding="utf-8",
)
PY
            exit "${rc}"
          fi

      - name: Validate automation contract
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_forever_autopilot_contract.py
          python -m py_compile research/autonomous_control_plane.py

      - name: Publish heartbeat summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Baseball Forever Autopilot"
            echo "- main_sha: ${GITHUB_SHA}"
            echo "- control_plane_bootstrap: ${{ steps.bootstrap.outputs.bootstrapped }}"
            echo "- bootstrap_reason: ${{ steps.bootstrap.outputs.bootstrap_reason }}"
            if [ -s results/forever_autopilot/control_plane.json ]; then
              python - <<'PY'
import json
from pathlib import Path
obj=json.loads(Path("results/forever_autopilot/control_plane.json").read_text(encoding="utf-8"))
print(f"- control_plane_status: {obj.get('control_plane_status')}")
print(f"- cycle_dispatch_count: {obj.get('cycle_dispatch_count')}")
print(f"- cycle_heavy_dispatch_count: {obj.get('cycle_heavy_dispatch_count')}")
for item in obj.get("targets", []):
    if item.get("decision") not in {"NOOP"}:
        print(f"- {item.get('workflow')}: {item.get('decision')} ({item.get('reason')})")
PY
            else
              echo "- control_plane_report: unavailable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload forever-autopilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-forever-autopilot-${{ github.run_id }}
          path: results/forever_autopilot/
          if-no-files-found: warn
          retention-days: 14
