name: Baseball 30m Pregame Auto Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: baseball-30m-pregame-auto-prediction
  cancel-in-progress: false

jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Scan current-production runtimes for due games
        run: |
          set -euo pipefail
          python -m py_compile prediction/pregame_scheduler.py
          python prediction/pregame_scheduler.py > pregame_scheduler.json
          cat pregame_scheduler.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path("pregame_scheduler.json").read_text(encoding="utf-8"))
          if obj.get("status") not in {"DUE", "NO_DUE_GAMES"}:
              raise SystemExit("unexpected scheduler status: " + str(obj.get("status")))
          for row in obj.get("due_games", []):
              if float(row["lead_minutes"]) < 30.0:
                  raise SystemExit("scheduler selected a game after the 30-minute deadline")
          Path("due_dates.txt").write_text(
              "\n".join(str(x) for x in obj.get("due_dates", [])) + ("\n" if obj.get("due_dates") else ""),
              encoding="utf-8",
          )
          PY

      - name: Install production dependencies only when a game is due
        run: |
          set -euo pipefail
          if [ ! -s due_dates.txt ]; then
            echo "No due pregame games; skipping heavy prediction environment."
            exit 0
          fi
          python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Acquire historical NPB PBP only when a game is due
        env:
          GH_TOKEN: $GITHUB_TOKEN
        run: |
          set -euo pipefail
          if [ ! -s due_dates.txt ]; then
            exit 0
          fi
          mkdir -p data
          date="$(head -n 1 due_dates.txt)"
          year="$(echo "$date" | cut -d- -f1)"
          month="$(echo "$date" | cut -d- -f2)"
          month_num=$((10#$month))
          if [ "$month_num" -le 2 ]; then
            exit 0
          fi
          for m in $(seq 2 $((month_num - 1))); do
            mm=$(printf "%02d" "$m")
            f="data/$year-$mm"_pbp.csv
            if [ -s "$f" ]; then
              continue
            fi
            gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository               --pattern "$year-$mm"_pbp.csv --dir data --clobber
            test -s "$f"
          done

      - name: Predict every due NPB game with hard 30-minute cutoff
        env:
          GITHUB_SHA: $GITHUB_SHA
          PIT_SAFE_STARTER_DATA: "1"
          BASEBALL_TIME_BUDGET_SEC: "3600"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ ! -s due_dates.txt ]; then
            exit 0
          fi
          while IFS= read -r date; do
            [ -n "$date" ] || continue
            echo "=== 30m pregame prediction: $date ==="
            python -m prediction.current_production --league NPB --date "$date" --data-dir data --pregame-only
            output="results/npb_production_$date.json"
            test -s "$output"
            python - "$output" <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          obj = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          status = obj.get("execution_status")
          if status not in {"EXECUTED", "BLOCKED_STARTERS", "NO_DUE_PREGAME_GAMES"}:
              raise SystemExit("unexpected production status: " + str(status))
          if status != "EXECUTED":
              print(json.dumps({"status": status, "block_reason": obj.get("block_reason")}, ensure_ascii=False))
              continue
          for pred in obj.get("predictions", []):
              cutoff = datetime.fromisoformat(pred["prediction_cutoff_utc"].replace("Z", "+00:00"))
              generated = datetime.fromisoformat(pred["prediction_generated_at"].replace("Z", "+00:00"))
              observed = datetime.fromisoformat(pred["starter_evidence_observed_at_utc"].replace("Z", "+00:00"))
              if generated > cutoff:
                  raise SystemExit("prediction generated after 30-minute cutoff")
              if observed > cutoff:
                  raise SystemExit("starter evidence observed after 30-minute cutoff")
              if pred.get("pit_status") != "PASS":
                  raise SystemExit("prediction is not PIT PASS")
          print("30-minute PIT deadline validation passed")
          PY
          done < due_dates.txt

      - name: Archive all executed pregame snapshots into experience
        run: |
          set -euo pipefail
          if [ ! -s due_dates.txt ]; then
            exit 0
          fi
          while IFS= read -r date; do
            [ -n "$date" ] || continue
            output="results/npb_production_$date.json"
            if [ -s "$output" ]; then
              python -m research.experience_ledger --archive "$output" --run-id "$GITHUB_RUN_ID"
            fi
          done < due_dates.txt

      - name: Persist new experience snapshots
        run: |
          set -euo pipefail
          if [ ! -d data/experience/predictions ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experience/predictions/
          if git diff --cached --quiet; then
            echo "No new experience snapshots to commit."
            exit 0
          fi
          git commit -m "Archive 30m pregame prediction experience"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "bounded experience push recovery exhausted" >&2
          exit 1

      - name: Upload scheduler and prediction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-pregame-30m
          path: |
            pregame_scheduler.json
            due_dates.txt
            results/npb_production_*.json
          if-no-files-found: warn
          retention-days: 14
