name: Baseball Closed Loop Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'data/pit/**'
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: baseball-closed-loop
  # Never cancel a long-running research job because a new commit arrived.
  # Queue the newer run instead; this avoids losing an otherwise healthy OOS run.
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    # Leave enough headroom for OOS research plus governance/artifact steps.
    # Individual expensive steps remain bounded below.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt

      - name: Compile and preflight
        run: |
          set -euo pipefail
          python -m compileall -q .
          python research/action_preflight.py

      - name: Acquire current PIT observations
        run: python -m data.pit_acquisition

      - name: Validate PIT before research
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.closed_loop_governance import pit_stage
          stage = pit_stage()
          print(stage)
          if stage.status != 'READY':
              raise SystemExit('PIT stage blocked: ' + '; '.join(stage.blockers))
          PY

      - name: Stage historical NPB PBP release data
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p data
          success=0
          for year in $(seq 2020 2026); do
            downloaded=0
            for attempt in 1 2 3; do
              if gh release download pbp \
                --repo armstjc/Nippon-Baseball-Data-Repository \
                --pattern "${year}-*_pbp.csv" \
                --dir data \
                --clobber; then
                downloaded=1
                success=$((success + 1))
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            echo "NPB release year ${year}: downloaded=${downloaded}"
          done
          echo "NPB PBP release years successfully staged: $success/7"
          total_files=$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')
          echo "NPB PBP files staged: $total_files"
          # The research horizon is 2020-2026. Do not silently continue with a
          # partial historical source set; fail closed and let the next scheduled
          # run retry the acquisition instead of producing a biased backtest.
          if [ "$success" -lt 7 ] || [ "$total_files" -lt 7 ]; then
            echo "NPB historical release set is incomplete; refusing partial backtest" >&2
            exit 1
          fi

      - name: Run chronological Baseball OOS research
        timeout-minutes: 40
        env:
          BASEBALL_TIME_BUDGET_SEC: '1500'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: python -u research_runner.py --league BOTH --mlb-start 2020 --mlb-end 2026 --retries 2

      - name: Verify research manifest
        run: |
          set -euo pipefail
          test -s results/research_execution_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/research_execution_manifest.json').read_text(encoding='utf-8'))
          print(json.dumps(obj, ensure_ascii=False, indent=2))
          if obj.get('overall_status') != 'SUCCESS':
              raise SystemExit('research manifest is not SUCCESS')
          for row in obj.get('results', []):
              if row.get('status') != 'SUCCESS' or int(row.get('predictions', 0)) <= 0:
                  raise SystemExit('invalid research result: ' + repr(row))
          PY

      - name: Execute evidence-based closed-loop lifecycle
        timeout-minutes: 15
        run: python -m research.closed_loop_execute

      - name: Generate lifecycle governance report
        if: always()
        timeout-minutes: 5
        run: python -m research.closed_loop_governance

      - name: Enforce lifecycle completion
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -s results/lifecycle_execution.json
          cat results/lifecycle_execution.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/lifecycle_execution.json').read_text(encoding='utf-8'))
          if obj.get('status') != 'READY':
              raise SystemExit('closed-loop lifecycle is BLOCKED: ' + '; '.join(obj.get('blockers', [])))
          PY

      - name: Preserve research diagnostics
        if: always()
        timeout-minutes: 5
        run: |
          for f in results/research_execution_manifest.json results/lifecycle_execution.json results/lifecycle_governance.json results/candidate_validation.json; do
            if [ -s "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done

      - name: Upload lifecycle artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: baseball-closed-loop-${{ github.run_id }}
          path: |
            results/**
            data/pit/**
          if-no-files-found: error
          retention-days: 30
