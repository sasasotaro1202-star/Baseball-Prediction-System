name: Baseball Closed Loop Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'data/pit/**'
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: baseball-closed-loop
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore immutable historical NPB PBP cache
        id: npb-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            data/2020-*_pbp.csv
            data/2021-*_pbp.csv
            data/2022-*_pbp.csv
            data/2023-*_pbp.csv
            data/2024-*_pbp.csv
            data/2025-*_pbp.csv
          key: baseball-npb-historical-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            baseball-npb-historical-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-
            baseball-npb-historical-v2-${{ runner.os }}-

      - name: Install research dependencies
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile and preflight
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -m compileall -q .
          python research/action_preflight.py

      - name: Acquire current PIT observations
        timeout-minutes: 8
        run: |
          set -euo pipefail
          last_error=''
          for attempt in 1 2 3; do
            echo "PIT acquisition attempt ${attempt}/3"
            if python -m data.pit_acquisition; then
              echo 'PIT acquisition succeeded'
              exit 0
            fi
            last_error="PIT acquisition attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "$last_error" >&2
          exit 1

      - name: Validate PIT before research
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.closed_loop_governance import pit_stage
          stage = pit_stage()
          print(stage)
          if stage.status != 'READY':
              raise SystemExit('PIT stage blocked: ' + '; '.join(stage.blockers))
          PY

      - name: Stage historical NPB PBP release data
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p data
          success=0
          for year in $(seq 2020 2025); do
            existing=$(find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" | wc -l | tr -d ' ')
            if [ "$existing" -gt 0 ]; then
              echo "NPB historical year ${year}: using cached file(s) (${existing})"
              success=$((success + 1))
              continue
            fi
            downloaded=0
            for attempt in 1 2 3; do
              if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber; then
                downloaded=1
                success=$((success + 1))
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            echo "NPB historical year ${year}: downloaded=${downloaded}"
          done

          # 2026 is live: always refresh it; never trust a stale cache.
          rm -f data/2026-*_pbp.csv
          current_downloaded=0
          for attempt in 1 2 3; do
            if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "2026-*_pbp.csv" --dir data --clobber; then
              current_downloaded=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "NPB current year 2026: downloaded=${current_downloaded}"

          echo "NPB historical release years available: $success/6"
          total_files=$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')
          echo "NPB PBP files staged: $total_files"
          if [ "$success" -lt 6 ] || [ "$current_downloaded" -ne 1 ] || [ "$total_files" -lt 7 ]; then
            echo "NPB historical/current release set is incomplete; refusing partial backtest" >&2
            exit 1
          fi

      - name: Validate staged NPB data integrity
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from data.npb_pbp_adapter import normalize_pbp_frame

          # Adapter-aware validation: the public release schema is allowed to
          # evolve, while the normalized research contract stays fixed.
          files = sorted(Path('data').glob('*_pbp.csv'))
          expected = {str(y) for y in range(2020, 2027)}
          years = {p.name[:4] for p in files}
          if not expected.issubset(years):
              raise SystemExit(f'missing NPB years: {sorted(expected-years)}')

          normalized_files = 0
          total_rows = 0
          for p in files:
              if p.stat().st_size == 0:
                  raise SystemExit(f'empty PBP file: {p}')

              sample = pd.read_csv(p, nrows=100, low_memory=False)
              required_raw = {'game_id', 'home_total_runs', 'away_total_runs'}
              legacy_raw = {'GameID', 'H_R', 'V_R'}
              if not (required_raw.issubset(sample.columns) or legacy_raw.issubset(sample.columns)):
                  raise SystemExit(f'unrecognized NPB PBP schema in {p}: {sorted(sample.columns.tolist())[:40]}')

              normalized = normalize_pbp_frame(sample)
              if normalized.empty:
                  raise SystemExit(f'NPB PBP file normalized to zero rows: {p}')
              for col in ('game_id', 'date', 'home_score', 'away_score'):
                  if col not in normalized.columns:
                      raise SystemExit(f'normalized NPB schema missing {col}: {p}')
              if pd.to_numeric(normalized['home_score'], errors='coerce').isna().all():
                  raise SystemExit(f'no usable home scores in sample: {p}')
              if pd.to_numeric(normalized['away_score'], errors='coerce').isna().all():
                  raise SystemExit(f'no usable away scores in sample: {p}')
              score_values = pd.to_numeric(normalized[['home_score', 'away_score']].stack(), errors='coerce')
              if (score_values < 0).any():
                  raise SystemExit(f'negative NPB scores in sample: {p}')
              normalized_files += 1
              total_rows += len(normalized)

          print(f'NPB staged integrity OK: {normalized_files} files, {total_rows} sampled normalized rows')
          PY

      - name: Save immutable historical NPB PBP cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/2020-*_pbp.csv
            data/2021-*_pbp.csv
            data/2022-*_pbp.csv
            data/2023-*_pbp.csv
            data/2024-*_pbp.csv
            data/2025-*_pbp.csv
          key: baseball-npb-historical-v2-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run chronological Baseball OOS research
        timeout-minutes: 40
        env:
          BASEBALL_TIME_BUDGET_SEC: '1500'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: python -u research_runner.py --league BOTH --mlb-start 2020 --mlb-end 2026 --retries 3

      - name: Verify research manifest
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -s results/research_execution_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/research_execution_manifest.json').read_text(encoding='utf-8'))
          print(json.dumps(obj, ensure_ascii=False, indent=2))
          if obj.get('overall_status') != 'SUCCESS':
              raise SystemExit('research manifest is not SUCCESS')
          if set(obj.get('requested_leagues', [])) != {'NPB', 'MLB'}:
              raise SystemExit('not all requested leagues were executed')
          for row in obj.get('results', []):
              if row.get('status') != 'SUCCESS' or int(row.get('predictions', 0)) <= 0:
                  raise SystemExit('invalid research result: ' + repr(row))
          PY

      - name: Execute evidence-based closed-loop lifecycle
        timeout-minutes: 15
        run: python -m research.closed_loop_execute

      - name: Generate lifecycle governance report
        if: always()
        timeout-minutes: 5
        run: python -m research.closed_loop_governance

      - name: Enforce lifecycle completion
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -s results/lifecycle_execution.json
          cat results/lifecycle_execution.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/lifecycle_execution.json').read_text(encoding='utf-8'))
          if obj.get('status') != 'READY':
              raise SystemExit('closed-loop lifecycle is BLOCKED: ' + '; '.join(obj.get('blockers', [])))
          PY

      - name: Preserve research diagnostics
        if: always()
        timeout-minutes: 5
        run: |
          for f in results/research_execution_manifest.json results/lifecycle_execution.json results/lifecycle_governance.json results/candidate_validation.json; do
            if [ -s "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done

      - name: Upload lifecycle artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: baseball-closed-loop-${{ github.run_id }}
          path: |
            results/**
            data/pit/**
          if-no-files-found: error
          retention-days: 30
