name: Baseball Closed Loop Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'data/pit/**'
      - '.github/workflows/baseball_24h_supervisor.yml'
  schedule:
    # Bounded cadence: enough independent OOS evidence to keep the lifecycle moving.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'

permissions:
  contents: read

concurrency:
  group: baseball-closed-loop
  # Closed-loop evidence must correspond to the current main commit. Stale
  # queued runs are discarded so the free runner queue stays available.
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    # 120-minute lifecycle timeout: fail closed instead of running unbounded.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore immutable historical NPB PBP and official-result cache
        id: npb-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            data/2020-*_pbp.csv
            data/2021-*_pbp.csv
            data/2022-*_pbp.csv
            data/2023-*_pbp.csv
            data/2024-*_pbp.csv
            data/2025-*_pbp.csv
            data/.npb_official_schedule_cache/**
          key: baseball-npb-historical-v6-${{ runner.os }}-${{ hashFiles('requirements.txt', 'research/npb_official_results.py') }}
          restore-keys: |
            baseball-npb-historical-v6-${{ runner.os }}-

      - name: Restore chronological OOS checkpoints
        id: oos-checkpoint-restore
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: results/checkpoints
          key: baseball-oos-checkpoints-v2-${{ runner.os }}-${{ hashFiles('requirements.txt', 'baseball_backtest.py', 'research_runner_v6.py', 'data/npb_pbp_adapter.py') }}-${{ github.run_number }}
          restore-keys: |
            baseball-oos-checkpoints-v2-${{ runner.os }}-${{ hashFiles('requirements.txt', 'baseball_backtest.py', 'research_runner_v6.py', 'data/npb_pbp_adapter.py') }}-

      - name: Install research dependencies
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile and preflight
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python -m compileall -q .
          python research/action_preflight.py

      - name: Run lightweight regression tests
        timeout-minutes: 5
        run: python -m pytest -q tests

      - name: Smoke-test NPB official score parser
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.npb_official_results import _parse_score_lines
          cases = [
              (['巨人 6 - 5 ヤクルト'], 6, 5),
              (['阪神 10-2 中日'], 10, 2),
              (['福岡ソフトバンクホークス 3−1 埼玉西武ライオンズ'], 3, 1),
              (['横浜DeNAベイスターズ 4–0 広島東洋カープ'], 4, 0),
              (['巨人', '6 - 5', 'ヤクルト'], 6, 5),
              (['阪神', '10-2', '中日'], 10, 2),
          ]
          for cells, expected_home, expected_away in cases:
              got = _parse_score_lines(cells, '2025-05-01', 'smoke://npb')
              if len(got) != 1 or got[0]['home_score'] != expected_home or got[0]['away_score'] != expected_away:
                  raise SystemExit(f'NPB parser smoke failure: cells={cells!r}, got={got!r}')
          print('NPB official score parser smoke test: PASS')
          PY

      - name: Acquire current PIT observations
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export PIT_ENABLE_MLB_GAME_PROBES=0
          last_error=''
          for attempt in 1 2 3; do
            echo "PIT acquisition attempt ${attempt}/3"
            if timeout --signal=TERM --kill-after=15s 120s python -m data.pit_acquisition; then
              echo 'PIT acquisition succeeded'
              exit 0
            fi
            last_error="PIT acquisition attempt ${attempt} failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "$last_error" >&2
          exit 1

      - name: Validate PIT before research
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.closed_loop_governance import pit_stage
          stage = pit_stage()
          print(stage)
          if stage.status != 'READY':
              raise SystemExit('PIT stage blocked: ' + '; '.join(stage.blockers))
          PY

      - name: Stage historical NPB PBP release data
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p data
          success=0
          for year in $(seq 2020 2025); do
            existing=$(find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" | wc -l | tr -d ' ')
            if [ "$existing" -gt 0 ]; then
              echo "NPB historical year ${year}: using cached file(s) (${existing})"
              success=$((success + 1))
              continue
            fi
            downloaded=0
            for attempt in 1 2 3; do
              if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber; then
                downloaded=1
                success=$((success + 1))
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            echo "NPB historical year ${year}: downloaded=${downloaded}"
          done

          rm -f data/2026-*_pbp.csv
          current_downloaded=0
          for attempt in 1 2 3; do
            if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "2026-*_pbp.csv" --dir data --clobber; then
              current_downloaded=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "NPB current year 2026: downloaded=${current_downloaded}"

          echo "NPB historical release years available: $success/6"
          total_files=$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')
          echo "NPB PBP files staged: $total_files"
          if [ "$success" -lt 6 ] || [ "$current_downloaded" -ne 1 ] || [ "$total_files" -lt 7 ]; then
            echo "NPB historical/current release set is incomplete; refusing partial backtest" >&2
            exit 1
          fi

      - name: Validate staged NPB data integrity
        id: npb-validate
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from data.npb_pbp_adapter import normalize_pbp_frame
          files = sorted(Path('data').glob('*_pbp.csv'))
          expected = {str(y) for y in range(2020, 2027)}
          years = {p.name[:4] for p in files}
          if not expected.issubset(years):
              raise SystemExit(f'missing NPB years: {sorted(expected-years)}')
          normalized_files = 0
          announcement_only_files = 0
          sampled_rows = 0
          usable_game_rows = 0
          for p in files:
              if p.stat().st_size == 0:
                  raise SystemExit(f'empty PBP file: {p}')
              sample = pd.read_csv(p, nrows=100, low_memory=False)
              required_raw = {'game_id', 'home_total_runs', 'away_total_runs'}
              legacy_raw = {'GameID', 'H_R', 'V_R'}
              if not (required_raw.issubset(sample.columns) or legacy_raw.issubset(sample.columns)):
                  raise SystemExit(f'unrecognized NPB PBP schema in {p}: {sorted(sample.columns.tolist())[:40]}')
              normalized = normalize_pbp_frame(sample, data_dir=None)
              if normalized.empty:
                  announcement_only_files += 1
                  print(f'NPB source accepted as empty/announcement-only sample: {p}')
                  continue
              for col in ('game_id', 'date', 'home', 'away', 'home_score', 'away_score'):
                  if col not in normalized.columns:
                      raise SystemExit(f'normalized NPB schema missing {col}: {p}')
              valid_ids = normalized['game_id'].astype(str).str.strip().ne('')
              valid_dates = pd.to_datetime(normalized['date'], errors='coerce', utc=True).notna()
              valid_teams = normalized['home'].astype(str).str.strip().ne('') & normalized['away'].astype(str).str.strip().ne('')
              usable = int((valid_ids & valid_dates & valid_teams).sum())
              if usable <= 0:
                  announcement_only_files += 1
              else:
                  usable_game_rows += usable
              normalized_files += 1
              sampled_rows += len(normalized)
          if normalized_files <= 0 or usable_game_rows <= 0:
              raise SystemExit('NPB staged release set contains no usable game rows')
          print(f'NPB staged source integrity OK: files={normalized_files}, announcement_only={announcement_only_files}, sampled_rows={sampled_rows}, usable_game_rows={usable_game_rows}')
          print('Final score integrity is deferred to the production NPB target-repair adapter.')
          PY
          mkdir -p data/.npb_official_schedule_cache
          printf '%s\n' 'NPB_SOURCE_STAGE_READY' > data/.npb_stage_ready

      - name: Save immutable historical NPB PBP and official-result cache
        if: always() && steps.npb-validate.outcome == 'success'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            data/2020-*_pbp.csv
            data/2021-*_pbp.csv
            data/2022-*_pbp.csv
            data/2023-*_pbp.csv
            data/2024-*_pbp.csv
            data/2025-*_pbp.csv
            data/.npb_official_schedule_cache/**
          key: baseball-npb-historical-v6-${{ runner.os }}-${{ hashFiles('requirements.txt', 'research/npb_official_results.py') }}

      - name: Run chronological Baseball OOS research
        timeout-minutes: 90
        env:
          BASEBALL_TIME_BUDGET_SEC: '3600'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: python -u research_runner_v6.py --league BOTH --mlb-start 2020 --mlb-end 2026 --retries 3

      - name: Save chronological OOS checkpoints
        if: always() && !cancelled()
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: results/checkpoints
          key: baseball-oos-checkpoints-v2-${{ runner.os }}-${{ hashFiles('requirements.txt', 'baseball_backtest.py', 'research_runner_v6.py', 'data/npb_pbp_adapter.py') }}-${{ github.run_number }}

      - name: Verify research manifest
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -s results/research_execution_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/research_execution_manifest.json').read_text(encoding='utf-8'))
          print(json.dumps(obj, ensure_ascii=False, indent=2))
          if obj.get('overall_status') != 'SUCCESS':
              raise SystemExit('research manifest is not SUCCESS')
          if set(obj.get('requested_leagues', [])) != {'NPB', 'MLB'}:
              raise SystemExit('not all requested leagues were executed')
          for row in obj.get('results', []):
              if row.get('status') != 'SUCCESS' or int(row.get('predictions', 0)) <= 0:
                  raise SystemExit('invalid research result: ' + repr(row))
          PY

      - name: Execute evidence-based closed-loop lifecycle
        timeout-minutes: 20
        run: python -m research.closed_loop_execute

      - name: Generate lifecycle governance report
        if: always()
        timeout-minutes: 5
        run: python -m research.closed_loop_governance

      - name: Enforce lifecycle completion
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -s results/lifecycle_execution.json
          cat results/lifecycle_execution.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/lifecycle_execution.json').read_text(encoding='utf-8'))
          if obj.get('status') != 'READY':
              raise SystemExit('closed-loop lifecycle is BLOCKED: ' + '; '.join(obj.get('blockers', [])))
          PY

      - name: Preserve research diagnostics
        if: always()
        timeout-minutes: 5
        run: |
          for f in results/research_execution_manifest.json results/lifecycle_execution.json results/lifecycle_governance.json results/candidate_validation.json; do
            if [ -s "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done

      - name: Upload lifecycle artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-closed-loop-${{ github.run_id }}
          path: |
            results/**
            data/pit/**
            data/.npb_stage_ready
          if-no-files-found: error
          retention-days: 30
