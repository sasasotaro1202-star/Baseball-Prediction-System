name: Baseball Closed Loop Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

a concurrency:
  group: baseball-closed-loop
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt

      - name: Compile and preflight
        run: |
          set -euo pipefail
          python -m compileall -q .
          python research/action_preflight.py

      - name: Acquire current PIT observations
        run: python data/pit_acquisition.py

      - name: Validate PIT before research
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.closed_loop_governance import pit_stage
          stage = pit_stage()
          print(stage)
          if stage.status != 'READY':
              raise SystemExit('PIT stage blocked: ' + '; '.join(stage.blockers))
          PY

      - name: Stage historical NPB data
        run: |
          set -euo pipefail
          mkdir -p data/npb_games
          python - <<'PY'
          import requests
          from pathlib import Path
          base = 'https://github.com/armstjc/Nippon-Baseball-Data-Repository/releases/download/pbp'
          out = Path('data/npb_games')
          for year in range(2020, 2027):
              for month in range(1, 13):
                  url = f'{base}/{year}-{month:02d}_pbp.csv'
                  r = requests.get(url, timeout=30)
                  if r.status_code == 200 and r.content:
                      (out / f'{year}-{month:02d}_pbp.csv').write_bytes(r.content)
          files = list(out.glob('*_pbp.csv'))
          if not files:
              raise SystemExit('No historical NPB PBP files were staged')
          print(f'Staged {len(files)} NPB files')
          PY

      - name: Run chronological Baseball OOS research
        env:
          BASEBALL_TIME_BUDGET_SEC: '1500'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: python research_runner.py --league BOTH --mlb-start 2020 --mlb-end 2026 --retries 2

      - name: Generate lifecycle governance report
        if: always()
        run: |
          mkdir -p results
          python research/closed_loop_governance.py

      - name: Preserve research diagnostics
        if: always()
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/research_execution_manifest.json')
          if p.exists():
              obj = json.loads(p.read_text(encoding='utf-8'))
              print(json.dumps(obj, ensure_ascii=False, indent=2))
          else:
              print('research_execution_manifest.json not produced')
          PY

      - name: Commit research and PIT ledgers
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/pit/*.jsonl || true
          git add results/lifecycle_governance.json results/research_execution_manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No lifecycle artifacts changed.'
          else
            git commit -m 'Update Baseball closed-loop research artifacts'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              if [ "$attempt" -lt 3 ]; then
                git fetch origin main
                git rebase origin/main
                sleep $((attempt * 3))
              fi
            done
            exit 1
          fi

      - name: Upload lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-closed-loop-${{ github.run_id }}
          path: |
            results/**
            data/pit/**
          if-no-files-found: warn
          retention-days: 30
