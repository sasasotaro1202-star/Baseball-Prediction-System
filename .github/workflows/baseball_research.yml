name: Baseball Research

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'Research league'
        required: true
        default: 'BOTH'
        type: choice
        options:
          - BOTH
          - NPB
          - MLB
      npb_year:
        description: 'NPB PBP release year to download (example: 2025)'
        required: true
        default: '2025'
        type: string
      mlb_start:
        description: 'MLB historical start year'
        required: true
        default: '2020'
        type: string
      mlb_end:
        description: 'MLB historical end year'
        required: true
        default: '2026'
        type: string

permissions:
  contents: read

concurrency:
  group: baseball-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          exit 1

      - name: Preflight repository and Python imports
        run: |
          set -euo pipefail
          python -m compileall -q .
          python - <<'PY'
          import importlib
          modules = [
              "baseball_backtest",
              "research_runner",
              "data.npb_pbp_adapter",
              "research.validation_pipeline",
              "research.adoption_gate",
              "prediction.runner",
              "prediction.prediction_log",
              "evaluation.calibration",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"OK: {name}")
          PY

      - name: Stage NPB PBP release data
        if: ${{ inputs.league == 'NPB' || inputs.league == 'BOTH' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          success=0
          for attempt in 1 2 3; do
            rm -f data/*_pbp.csv
            if gh release download pbp \
              --repo armstjc/Nippon-Baseball-Data-Repository \
              --pattern "${{ inputs.npb_year }}-*_pbp.csv" \
              --dir data \
              --clobber; then
              if find data -maxdepth 1 -name '*_pbp.csv' -print -quit | grep -q .; then
                success=1
                break
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          if [ "$success" -ne 1 ]; then
            echo "NPB release download failed after 3 attempts" >&2
            exit 1
          fi
          find data -maxdepth 1 -name '*_pbp.csv' -print

      - name: Run strict research runner
        env:
          BASEBALL_TIME_BUDGET_SEC: '1500'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: |
          set -euo pipefail
          python research_runner.py \
            --league "${{ inputs.league }}" \
            --mlb-start "${{ inputs.mlb_start }}" \
            --mlb-end "${{ inputs.mlb_end }}" \
            --retries 2

      - name: Verify research manifest
        run: |
          set -euo pipefail
          test -s results/research_execution_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("results/research_execution_manifest.json").read_text(encoding="utf-8"))
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          if manifest.get("overall_status") != "SUCCESS":
              raise SystemExit("Research manifest is not SUCCESS")
          for result in manifest.get("results", []):
              if result.get("status") != "SUCCESS" or int(result.get("predictions", 0)) <= 0:
                  raise SystemExit(f"Research league failed: {result}")
          PY

      - name: Write GitHub summary
        if: always()
        run: |
          {
            echo "## Baseball Research"
            if [ -s results/research_execution_manifest.json ]; then
              echo '```json'
              cat results/research_execution_manifest.json
              echo '```'
            else
              echo "Research manifest: NOT PRODUCED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-research-${{ github.run_id }}
          path: |
            results/**
            data/*_pbp.csv
          if-no-files-found: warn
          retention-days: 14
