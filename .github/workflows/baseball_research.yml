name: Baseball Research

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'Research league'
        required: true
        default: 'BOTH'
        type: choice
        options:
          - BOTH
          - NPB
          - MLB
      npb_year:
        description: 'NPB PBP release year to download (example: 2025)'
        required: true
        default: '2025'
        type: string
      mlb_start:
        description: 'MLB historical start year'
        required: true
        default: '2020'
        type: string
      mlb_end:
        description: 'MLB historical end year'
        required: true
        default: '2026'
        type: string

permissions:
  contents: read

concurrency:
  group: baseball-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        run: python -m pip install -r requirements.txt

      - name: Stage NPB PBP release data
        if: ${{ inputs.league == 'NPB' || inputs.league == 'BOTH' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download pbp \
            --repo armstjc/Nippon-Baseball-Data-Repository \
            --pattern "${{ inputs.npb_year }}-*_pbp.csv" \
            --dir data \
            --clobber
          test -n "$(find data -maxdepth 1 -name '*_pbp.csv' -print -quit)"

      - name: Run strict research runner
        env:
          BASEBALL_TIME_BUDGET_SEC: '1500'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: |
          python research_runner.py \
            --league "${{ inputs.league }}" \
            --mlb-start "${{ inputs.mlb_start }}" \
            --mlb-end "${{ inputs.mlb_end }}"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-research-${{ github.run_id }}
          path: |
            results/**
            data/*_pbp.csv
          if-no-files-found: warn
          retention-days: 14
