name: Baseball Research

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'Research league'
        required: true
        default: 'BOTH'
        type: choice
        options:
          - BOTH
          - NPB
          - MLB
      npb_year:
        description: 'NPB release year to stage (used as a minimum year; historical staging expands automatically)'
        required: true
        default: '2020'
        type: string
      mlb_start:
        description: 'MLB historical start year'
        required: true
        default: '2020'
        type: string
      mlb_end:
        description: 'MLB historical end year'
        required: true
        default: '2026'
        type: string

permissions:
  contents: read

concurrency:
  group: baseball-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          exit 1

      - name: Preflight repository and Python imports
        run: |
          set -euo pipefail
          python -m compileall -q .
          python - <<'PY'
          import importlib
          modules = [
              "baseball_backtest",
              "research_runner",
              "data.npb_pbp_adapter",
              "research.validation_pipeline",
              "research.adoption_gate",
              "prediction.runner",
              "prediction.prediction_log",
              "evaluation.calibration",
          ]
          for name in modules:
              importlib.import_module(name)
              print(f"OK: {name}")
          PY

      - name: Stage historical NPB PBP release data
        if: ${{ inputs.league == 'NPB' || inputs.league == 'BOTH' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          requested_start="${{ inputs.npb_year }}"
          if ! [[ "$requested_start" =~ ^[0-9]{4}$ ]]; then
            echo "Invalid npb_year: $requested_start" >&2
            exit 1
          fi
          start_year="$requested_start"
          [ "$start_year" -lt 2019 ] && start_year=2019
          [ "$start_year" -gt 2026 ] && start_year=2026
          for year in $(seq "$start_year" 2026); do
            downloaded=0
            for attempt in 1 2 3; do
              if gh release download pbp \
                --repo armstjc/Nippon-Baseball-Data-Repository \
                --pattern "${year}-*_pbp.csv" \
                --dir data \
                --clobber; then
                if find data -maxdepth 1 -name "${year}-*_pbp.csv" -print -quit | grep -q .; then
                  downloaded=1
                  break
                fi
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            if [ "$downloaded" -ne 1 ]; then
              echo "Warning: no NPB PBP CSV staged for $year" >&2
            fi
          done
          total_files=$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')
          echo "NPB PBP files staged: $total_files"
          if [ "$total_files" -lt 1 ]; then
            echo "NPB release download produced no PBP CSV files" >&2
            exit 1
          fi
          find data -maxdepth 1 -name '*_pbp.csv' -print | sort

      - name: Run strict research runner
        env:
          BASEBALL_TIME_BUDGET_SEC: '1500'
          NPB_RETRAIN_EVERY: '150'
          MLB_ENRICH_STARTERS: '0'
        run: |
          set -euo pipefail
          python research_runner.py \
            --league "${{ inputs.league }}" \
            --mlb-start "${{ inputs.mlb_start }}" \
            --mlb-end "${{ inputs.mlb_end }}" \
            --retries 2

      - name: Verify research manifest
        run: |
          set -euo pipefail
          test -s results/research_execution_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("results/research_execution_manifest.json").read_text(encoding="utf-8"))
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          if manifest.get("overall_status") != "SUCCESS":
              raise SystemExit("Research manifest is not SUCCESS")
          for result in manifest.get("results", []):
              if result.get("status") != "SUCCESS" or int(result.get("predictions", 0)) <= 0:
                  raise SystemExit(f"Research league failed: {result}")
          PY

      - name: Write GitHub summary
        if: always()
        run: |
          {
            echo "## Baseball Research"
            if [ -s results/research_execution_manifest.json ]; then
              echo '```json'
              cat results/research_execution_manifest.json
              echo '```'
            else
              echo "Research manifest: NOT PRODUCED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-research-${{ github.run_id }}
          path: |
            results/**
            data/*_pbp.csv
          if-no-files-found: warn
          retention-days: 14
