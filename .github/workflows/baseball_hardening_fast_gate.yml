name: Baseball Hardening Fast Gate

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/pit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-hardening-fast-gate
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  BASEBALL_INNER_JOBS: '2'

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Action preflight
        timeout-minutes: 3
        run: python research/action_preflight.py

      - name: Regression tests
        run: python -m pytest -q tests

      - name: PIT contract smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import tempfile
          from baseball_backtest import clip_prob
          import numpy as np

          assert np.allclose(clip_prob([2.0, 1.0]), [2/3, 1/3])
          for bad in ([np.nan, 1.0], [-1.0, 2.0], [0.0, 0.0]):
              try:
                  clip_prob(bad)
              except ValueError:
                  pass
              else:
                  raise SystemExit(f'clip_prob fail-opened invalid input: {bad!r}')

          valid = [{
              "event_id": "NPB-SMOKE-1",
              "league": "NPB",
              "event_start_at": "2026-09-23T18:00:00+09:00",
              "home": "読売ジャイアンツ",
              "away": "阪神タイガース",
              "home_starter": "投手A",
              "away_starter": "投手B",
              "home_starter_evidence_level": "OFFICIAL_ANNOUNCEMENT",
              "away_starter_evidence_level": "OFFICIAL_ANNOUNCEMENT",
              "home_starter_announced_at": "2026-09-23T09:00:00+09:00",
              "away_starter_announced_at": "2026-09-23T09:00:00+09:00",
              "home_starter_source": "https://npb.jp/",
              "away_starter_source": "https://npb.jp/",
          }]
          invalid = [dict(valid[0], home_starter_source="https://example.com/")]

          with tempfile.TemporaryDirectory() as d:
              root = Path(d)
              vp = root / "valid.json"
              ip = root / "invalid.json"
              vp.write_text(json.dumps(valid, ensure_ascii=False), encoding="utf-8")
              ip.write_text(json.dumps(invalid, ensure_ascii=False), encoding="utf-8")
              cutoff = "2026-09-23T12:00:00+09:00"

              ok = subprocess.run(
                  ["python", "production_pit_gate.py", str(vp), "--cutoff", cutoff],
                  check=False, capture_output=True, text=True,
              )
              if ok.returncode != 0:
                  raise SystemExit(f"production PIT valid fixture failed: {ok.stdout}\n{ok.stderr}")

              bad = subprocess.run(
                  ["python", "production_pit_gate.py", str(ip), "--cutoff", cutoff],
                  check=False, capture_output=True, text=True,
              )
              if bad.returncode == 0:
                  raise SystemExit("production PIT gate accepted a non-official starter source")

          from research.correlated_score import grid
          score = grid(3.0, 2.5, 0.0)
          if not np.isfinite(score).all() or abs(float(score.sum()) - 1.0) > 1e-12:
              raise SystemExit("zero shared-intensity score distribution failed")
          print("PIT/probability/score contract smoke: PASS")
          PY

      - name: Automation contract scan
        timeout-minutes: 2
        run: |
          set -euo pipefail
          closed=".github/workflows/baseball_closed_loop.yml"
          supervisor=".github/workflows/baseball_24h_supervisor.yml"
          recovery=".github/workflows/baseball_actions_recovery.yml"
          test -s "$closed"
          test -s "$supervisor"
          test -s "$recovery"

          grep -Fq "cancel-in-progress: false" "$closed"
          grep -Fq "cron: '17 0,3,6,9,12,15,18,21 * * *'" "$closed"
          grep -Fq "retries 0" "$closed"
          grep -Fq "BASEBALL_TIME_BUDGET_SEC: '4800'" "$closed"

          grep -Fq "cron: '*/15 * * * *'" "$supervisor"
          grep -Fq "gh workflow run" "$supervisor"
          grep -Fq "gh run view" "$supervisor"
          grep -Fq "headSha" "$supervisor"
          grep -Fq 'git/ref/heads/main' "$supervisor"

          grep -Fq "Re-run failed jobs with bounded recovery" "$recovery"
          grep -Fq "RUN_ATTEMPT" "$recovery"
          grep -Fq "Mixed transient and deterministic failures detected" "$recovery"

          grep -Fq "FAILED_WITH_LIMIT" "$recovery"
          grep -Fq "FAILED_NO_RETRYABLE_STEP" "$recovery"
          grep -Fq "FAILED_MIXED_FAILURES" "$recovery"
          grep -Fq "FAILED_RERUN_REQUEST" "$recovery"

          if grep -nE '\\.fillna\\([[:space:]]*0([.]0)?[[:space:]]*\\)' production_npb.py; then
            echo 'Production NPB target-feature implicit zero imputation detected.' >&2
            exit 1
          fi
          echo 'Automation contract scan: PASS'

      - name: Workflow fail-closed policy scan
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*continue-on-error:[[:space:]]*true|\|\|[[:space:]]*true([[:space:]]|$)' .github/workflows; then
            echo 'Unsafe workflow failure suppression detected.' >&2
            exit 1
          fi
          echo 'Workflow failure-suppression scan: PASS'
