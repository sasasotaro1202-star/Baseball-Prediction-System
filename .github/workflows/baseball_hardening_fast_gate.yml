name: Baseball Hardening Fast Gate

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-hardening-fast-gate
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  BASEBALL_INNER_JOBS: '2'

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Regression tests
        run: python -m pytest -q tests

      - name: PIT contract smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          from baseball_backtest import clip_prob
          import numpy as np
          assert np.allclose(clip_prob([2.0, 1.0]), [2/3, 1/3])
          for bad in ([np.nan, 1.0], [-1.0, 2.0], [0.0, 0.0]):
              try:
                  clip_prob(bad)
              except ValueError:
                  pass
              else:
                  raise SystemExit(f'clip_prob fail-opened invalid input: {bad!r}')
          print('probability contract smoke: PASS')
          PY
