name: Baseball Extreme Representation Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/extreme_representation_lab.py"
      - "research/model_profiles.py"
      - "scripts/verify_extreme_representation_lab.py"
      - "config/extreme_representation_lab.json"
      - "tests/test_extreme_representation_lab.py"
      - "baseball_backtest.py"
      - "research/ultimate_pattern_lab.py"
      - ".github/workflows/baseball_extreme_representation_lab.yml"

permissions:
  contents: read

concurrency:
  group: baseball-extreme-representation-lab
  # Preserve active evidence runs; snapshot gates invalidate evidence when main advances.
  cancel-in-progress: true

jobs:
  lab:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[fast-prediction]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        league: [NPB, MLB]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        timeout-minutes: 12
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Restore exact research result cache
        id: result-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: results/extreme_representation_lab_${{ matrix.league }}.json
          key: baseball-extreme-representation-v1-${{ matrix.league }}-${{ github.sha }}
      - name: Verify main snapshot before evidence generation
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current="$(git rev-parse origin/main)"
          test "$current" = "$EXPECTED_SHA"
      - name: Compile and focused tests
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m py_compile             baseball_backtest.py             research/feature_set_variants.py             research/feature_model_matrix.py             research/ultimate_pattern_lab.py             research/extreme_representation_lab.py             research/model_profiles.py             scripts/verify_extreme_representation_lab.py
          python -m pytest -q             tests/test_feature_set_router.py             tests/test_feature_set_variants.py             tests/test_verify_feature_model_matrix.py             tests/test_ultimate_pattern_lab.py             tests/test_extreme_representation_lab.py             tests/test_model_profiles.py             tests/test_feature_integrity.py             tests/test_mlb_starter_pit_provenance.py
      - name: Stage NPB historical data
        if: matrix.league == 'NPB' && steps.result-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            if find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" -print -quit | grep -q .; then continue; fi
            ok=0
            for attempt in 1 2 3; do
              if timeout --signal=TERM --kill-after=10s 150s gh release download pbp                 --repo armstjc/Nippon-Baseball-Data-Repository                 --pattern "${year}-*_pbp.csv" --dir data --clobber; then ok=1; break; fi
              sleep $((attempt * 3))
            done
            test "$ok" -eq 1
          done
          test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -ge 7
      - name: Run extreme representation matrix
        if: steps.result-cache.outputs.cache-hit != 'true'
        timeout-minutes: 125
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          GITHUB_SHA: ${{ github.sha }}
          BASEBALL_TIME_BUDGET_SEC: "6900"
          BASEBALL_HARD_CAP_SEC: "7200"
          BASEBALL_CATBOOST_DETERMINISTIC: "1"
          BASEBALL_FAST_OOS: "1"
          BASEBALL_SCORE_FAST_VALIDATION: "1"
          PIT_SAFE_STARTER_DATA: "0"
          BASEBALL_MAX_FIT_ROWS: "0"
        run: |
          set -euo pipefail
          python -m research.extreme_representation_lab             --league "${{ matrix.league }}"             --top-k-a 12             --top-k-b 4             --mlb-start 2020             --mlb-end 2026
      - name: Verify evidence
        run: |
          set -euo pipefail
          python scripts/verify_extreme_representation_lab.py             "results/extreme_representation_lab_${{ matrix.league }}.json"
      - name: Verify main snapshot after evidence generation
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current="$(git rev-parse origin/main)"
          test "$current" = "$EXPECTED_SHA"
      - name: Save exact research result cache
        if: steps.result-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: results/extreme_representation_lab_${{ matrix.league }}.json
          key: baseball-extreme-representation-v1-${{ matrix.league }}-${{ github.sha }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-extreme-representation-lab-${{ matrix.league }}-${{ github.run_id }}
          path: results/extreme_representation_lab_*.json
          if-no-files-found: error
          retention-days: 30
