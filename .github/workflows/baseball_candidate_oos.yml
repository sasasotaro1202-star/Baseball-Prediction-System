name: Baseball Candidate OOS Validation
# Phase 1 screening: NPB and MLB run concurrently; production defaults remain unchanged.
# Trusted-main workflow: candidate selection is OOS-only; holdout is locked before evaluation.
# Candidate calibration uses the same shared evaluation.calibration contract as closed-loop governance.
# Candidate scoring now preserves the learned bivariate shared-lambda term in Top-4 and Low/High holdout evaluation.\n# Retrigger after verified parser/calibration hardening.
# Shared calibration grid and multi-fold ensemble calibration were refreshed on 2026-09-22; candidate OOS is re-run from this commit.
# Candidate OOS must be re-executed after any calibration/core-model hardening.
# Final replay trigger after score tuple compatibility fixes; production defaults remain unchanged.
# Candidate screening must follow the newest main calibration/model contract before any holdout evidence is considered.
# Fresh post-hardening replay trigger: regenerate Development OOS -> locked holdout evidence after CI-verified gate hardening.
# Re-run after verified MLB score-validation compute bound; use latest main state.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/npb_candidate_replay.py'
      - 'research/mlb_candidate_replay.py'
      - 'research/real_data_validation.py'
      - 'research/validation_pipeline.py'
      - 'research/candidates.py'
      - 'research/regime_router.py'
      - 'research/correlated_score.py'
      - 'baseball_backtest.py'
      - 'core/**'
      - 'evaluation/**'
      - '.github/workflows/baseball_candidate_oos.yml'
  schedule:
    - cron: '47 2 * * 0'

permissions:
  contents: read

concurrency:
  group: baseball-candidate-oos
  # Candidate OOS is expensive evidence generation. Never interrupt a running
  # validation; a newer pending cycle can take the next slot.
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  BASEBALL_ENABLE_PIT_SAFE_BULLPEN_USAGE: '1'

jobs:
  candidate-oos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        league: [NPB, MLB]
    timeout-minutes: 260
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile
        timeout-minutes: 5
        run: python -m compileall -q .

      - name: Stage NPB historical PBP release data
        if: matrix.league == 'NPB'
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            existing=$(find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" | wc -l | tr -d ' ')
            if [ "$existing" -gt 0 ]; then
              echo "NPB ${year}: cached (${existing} file(s))"
              continue
            fi
            downloaded=0
            for attempt in 1 2 3; do
              if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber; then
                downloaded=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            if [ "$downloaded" -ne 1 ]; then
              echo "failed to stage NPB ${year}" >&2
              exit 1
            fi
          done
          test "$(find data -maxdepth 1 -name '*_pbp.csv' | wc -l | tr -d ' ')" -ge 7

      - name: Run candidate lifecycle
        timeout-minutes: 240
        env:
          BASEBALL_TIME_BUDGET_SEC: '7200'
          # 210-minute internal cap leaves ~30 minutes of headroom inside the
          # 240-minute candidate lifecycle step for final verification/upload.
          BASEBALL_HARD_CAP_SEC: '12600'
          NPB_RETRAIN_EVERY: '300'
          MLB_ENRICH_STARTERS: '0'
          PIT_SAFE_STARTER_DATA: '0'
          # Research-only reproducibility controls for CatBoost candidate fits.
          BASEBALL_CATBOOST_DETERMINISTIC: '1'
        run: |
          set -euo pipefail
          # MLB score validation is the remaining compute hotspot. Bound only
          # the score-regression trees for MLB; classification OOS and PIT
          # contracts remain unchanged.
          if [ "${{ matrix.league }}" = "MLB" ]; then
            export BASEBALL_SCORE_TREE_ESTIMATORS=60
            export BASEBALL_SCORE_HIST_MAX_ITER=100
            export BASEBALL_SCORE_FAST_VALIDATION=1
          fi
          python -m research.real_data_validation --league "${{ matrix.league }}" --mlb-start 2020 --mlb-end 2026

      - name: Verify lifecycle decision is explicit
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -s results/real_data_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('results/real_data_validation.json').read_text(encoding='utf-8'))
          if obj.get('status') != 'COMPLETED_WITH_FAIL_CLOSED_DECISION':
              raise SystemExit('candidate lifecycle did not complete under the explicit fail-closed contract')
          if obj.get('execution_status') != 'EXECUTED':
              raise SystemExit('candidate lifecycle execution failed; HOLD is reserved for a completed gate decision')
          if any(run.get('execution_status') == 'FAILED' or run.get('stage') == 'error' for run in obj.get('runs', [])):
              raise SystemExit('candidate lifecycle contains an execution failure; refusing false-green verification')
          if obj.get('overall_decision') not in {'ADOPT','HOLD'}:
              raise SystemExit('candidate lifecycle returned an invalid decision')
          print(json.dumps(obj, ensure_ascii=False, indent=2))
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-candidate-oos-${{ matrix.league }}-${{ github.run_id }}
          path: |
            results/real_data_validation.json
            results/npb_candidate_development.json
            results/npb_locked_holdout.json
            results/mlb_candidate_development.json
            results/mlb_locked_holdout.json
            pit_readiness_audit.json
          if-no-files-found: warn
          retention-days: 30
