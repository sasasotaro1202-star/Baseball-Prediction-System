name: Baseball 24h Research Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: baseball-24h-research-autopilot
  cancel-in-progress: false

env:
  RESEARCH_REF: ${{ github.sha }}
  PYTHONPATH: .
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  wave1-core-oos:
    name: 24h Wave 1 - Core chronological OOS
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify research snapshot
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_REF"
          echo "research_snapshot_sha=$actual"
      - name: Verify main has not advanced
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$EXPECTED_REF"
          echo "current_main_sha=$current_main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Stage NPB historical data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            found=$(find data -maxdepth 1 -name "${year}-*_pbp.csv" | wc -l | tr -d ' ')
            if [ "${found}" -gt 0 ]; then continue; fi
            gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber
          done
      - name: Validate targeted test paths
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/baseball_24h_research_autopilot.yml').read_text(encoding='utf-8')
          paths = sorted(set(re.findall(r'tests/[A-Za-z0-9_.-]+\.py', workflow)))
          if not paths:
              raise SystemExit('24h autopilot has no targeted test paths')
          missing = [path for path in paths if not Path(path).is_file()]
          if missing:
              raise SystemExit('24h autopilot references missing test files: ' + ', '.join(missing))
          print('targeted_test_paths_ok=', len(paths))
          PY

      - name: Compile and targeted tests
        run: |
          set -euo pipefail
          python -m compileall -q data research core
          # Keep this list aligned with checked-in focused tests; a repository invariant rejects stale paths.
          python -m pytest -q tests/test_auto_discovery_frontier.py tests/test_universal_source_matrix.py tests/test_universal_adapter_registry.py tests/test_availability_competitions.py tests/test_npb_tracking_source.py tests/test_pit_replay.py tests/test_pit_replay_reference.py tests/test_pit_ledger_validator.py tests/test_scope_router.py
      - name: Run chronological OOS
        timeout-minutes: 325
        env:
          BASEBALL_TIME_BUDGET_SEC: '18000'
          BASEBALL_FAST_OOS: '1'
          BASEBALL_MAX_FIT_ROWS: '6000'
          BASEBALL_FAST_MODEL_POOL: 'Logistic,HistGB,ExtraTrees'
          BASEBALL_FAST_MODEL_POOL_NPB: 'Logistic,HistGB,ExtraTrees,HierarchicalDrawResult'
          BASEBALL_SCORE_FAST_VALIDATION: '1'
          BASEBALL_SCORE_TREE_ESTIMATORS: '60'
          BASEBALL_SCORE_HIST_MAX_ITER: '100'
          NPB_RETRAIN_EVERY: '300'
          MLB_ENRICH_STARTERS: '0'
        run: python -u research_runner_v6.py --league BOTH --mlb-start 2020 --mlb-end 2026 --retries 0
      - name: Preserve wave evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-24h-wave1-${{ github.run_id }}
          path: |
            results/**
            data/pit/**
            data/.npb_stage_ready
            data/*_pbp.csv
          if-no-files-found: warn
          retention-days: 2

  wave2-frontier:
    name: 24h Wave 2 - Frontier game/source expansion
    needs: wave1-core-oos
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify research snapshot
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_REF"
          echo "research_snapshot_sha=$actual"
      - name: Verify main has not advanced
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$EXPECTED_REF"
          echo "current_main_sha=$current_main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install minimal research dependencies
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 pandas pytest requests
      - name: Baseline parser tests
        run: python -m pytest -q tests/test_auto_discovery_frontier.py tests/test_universal_source_matrix.py tests/test_universal_adapter_registry.py tests/test_availability_competitions.py tests/test_npb_tracking_source.py
      - name: Run frontier discovery loop
        timeout-minutes: 335
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results/24h
          start=$(date +%s)
          deadline=$((start + 20100))
          cycle=0
          failures=0
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            cycle=$((cycle + 1))
            cycle_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            status=PASS
            mkdir -p "results/24h/cycle_${cycle}"
            run_one() {
              name="$1"; shift
              timeout 90s "$@" >"results/24h/cycle_${cycle}/${name}.json" 2>"results/24h/cycle_${cycle}/${name}.stderr"
              rc=$?
              if [ "${rc}" -ne 0 ]; then failures=$((failures + 1)); status=DEGRADED; fi
            }
            run_one scope python research/scope_discovery.py
            run_one pit_history python -m research.pit_history_expansion
            run_one coverage_funnel python -m research.scope_coverage_audit
            run_one kbo python -m data.kbo_public_schedule
            run_one cpbl python -m data.cpbl_public_schedule
            run_one espn_mlb python -m data.espn_baseball_schedule MLB
            run_one espn_ncaa python -m data.espn_baseball_schedule NCAA
            run_one iblj python -m data.japan_independent_schedule IBLJ
            run_one bcl python -m data.japan_independent_schedule BCL
            printf '%s\n' "{\"cycle\":${cycle},\"started_at\":\"${cycle_start}\",\"status\":\"${status}\"}" >> results/24h/frontier_cycles.jsonl
            sleep 120
          done
          printf '%s\n' "frontier loop finished: cycles=${cycle} failures=${failures}"
          test "${cycle}" -gt 0
          if [ "${failures}" -gt 0 ]; then exit 1; fi
      - name: Preserve frontier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-24h-wave2-${{ github.run_id }}
          path: results/24h/**
          if-no-files-found: warn
          retention-days: 2

  wave3-candidate-oos:
    name: 24h Wave 3 - Candidate OOS / robustness
    needs: wave2-frontier
    # Candidate OOS must fail closed when frontier acquisition fails.
    if: ${{ always() && needs['wave2-frontier'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify research snapshot
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_REF"
          echo "research_snapshot_sha=$actual"
      - name: Verify main has not advanced
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$EXPECTED_REF"
          echo "current_main_sha=$current_main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Candidate NPB
        timeout-minutes: 150
        env:
          BASEBALL_TIME_BUDGET_SEC: '8100'
          NPB_RETRAIN_EVERY: '300'
          MLB_ENRICH_STARTERS: '0'
          PIT_SAFE_STARTER_DATA: '0'
        run: python -m research.real_data_validation --league NPB --mlb-start 2020 --mlb-end 2026
      - name: Candidate MLB
        timeout-minutes: 150
        env:
          BASEBALL_TIME_BUDGET_SEC: '8100'
          NPB_RETRAIN_EVERY: '300'
          MLB_ENRICH_STARTERS: '0'
          PIT_SAFE_STARTER_DATA: '0'
        run: python -m research.real_data_validation --league MLB --mlb-start 2020 --mlb-end 2026
      - name: Governance snapshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/24h
          python -m research.closed_loop_governance > results/24h/wave3_governance.txt
      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-24h-wave3-${{ github.run_id }}
          path: results/**
          if-no-files-found: warn
          retention-days: 2

  wave4-meta-research:
    name: 24h Wave 4 - Meta research / verification
    needs: wave3-candidate-oos
    # Meta-research must not consume candidate evidence from a failed OOS lane.
    if: ${{ always() && needs['wave3-candidate-oos'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify research snapshot
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_REF"
          echo "research_snapshot_sha=$actual"
      - name: Verify main has not advanced
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$EXPECTED_REF"
          echo "current_main_sha=$current_main"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Full regression
        run: python -m pytest -q tests
      - name: Scope and adapter audits
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p results/24h
          python -m research.scope_discovery > results/24h/scope_discovery_stdout.txt
          python -m research.universal_adapter_registry > results/24h/adapter_audit.json
          python -m research.universal_readiness > results/24h/readiness.json
          python -m research.scope_coverage_audit > results/24h/scope_coverage_audit.json
      - name: Extended OOS research slice
        timeout-minutes: 300
        env:
          BASEBALL_TIME_BUDGET_SEC: '16800'
          BASEBALL_FAST_OOS: '1'
          BASEBALL_MAX_FIT_ROWS: '8000'
          BASEBALL_FAST_MODEL_POOL: 'Logistic,HistGB,ExtraTrees'
          BASEBALL_FAST_MODEL_POOL_NPB: 'Logistic,HistGB,ExtraTrees,HierarchicalDrawResult'
          BASEBALL_SCORE_FAST_VALIDATION: '1'
          BASEBALL_SCORE_TREE_ESTIMATORS: '80'
          BASEBALL_SCORE_HIST_MAX_ITER: '120'
          NPB_RETRAIN_EVERY: '250'
          MLB_ENRICH_STARTERS: '0'
        run: python -u research_runner_v6.py --league BOTH --mlb-start 2020 --mlb-end 2026 --retries 0
      - name: Final governance
        if: always()
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python -m research.closed_loop_execute
          python -m research.closed_loop_governance
      - name: Preserve meta evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-24h-wave4-${{ github.run_id }}
          path: results/**
          if-no-files-found: warn
          retention-days: 2

  game-script-v4-fallback:
    name: 24h Auxiliary - Game-Script v4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify research snapshot
        env:
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_REF"
          git fetch --no-tags --prune origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$EXPECTED_REF"
          echo "research_snapshot_sha=$actual"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Focused Game-Script tests
        run: |
          set -euo pipefail
          python -m py_compile research/game_script_common.py research/game_script_wfo.py research/game_script_engine.py
          python -m pytest -q tests/test_game_script_engine.py tests/test_game_script_automation_contract.py

      - name: Build PBP manifest and detect delegated run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results
          gh api repos/armstjc/Nippon-Baseball-Data-Repository/releases/tags/pbp \
            --jq '.assets[]
              | select(.name | test("^(2022|2023|2024|2025|2026)-[0-9]{2}_pbp\\.csv$"))
              | [.name, (.digest // ""), (.size|tostring), (.updated_at // "")]
              | @tsv' \
            | sort > results/pbp_release_manifest.tsv
          test -s results/pbp_release_manifest.tsv
          sha256sum results/pbp_release_manifest.tsv | awk '{print $1}' > results/source_fingerprint.txt
          awk -F '\t' '$1 ~ /^(2022|2023|2024|2025)-[0-9]{2}_pbp\\.csv$/ {print}' results/pbp_release_manifest.tsv | sha256sum | awk '{print $1}' > results/validation_source_fingerprint.txt
          awk -F '\t' '$1 ~ /^2026-[0-9]{2}_pbp\\.csv$/ {print}' results/pbp_release_manifest.tsv | sha256sum | awk '{print $1}' > results/context_source_fingerprint.txt
          code_files=(research/game_script_common.py research/game_script_wfo.py research/game_script_engine.py tests/test_game_script_engine.py tests/test_game_script_automation_contract.py .github/workflows/npb_game_script_autoresearch.yml .github/workflows/npb_game_script_watchdog.yml docs/GAME_SCRIPT_V5.md)
          (for f in "${code_files[@]}"; do sha256sum "$f"; done) | sha256sum | awk '{print $1}' > results/code_fingerprint.txt

          dedicated_query_status="PASS"
          dedicated_query_rc=0
          if dedicated_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow npb_game_script_autoresearch.yml --branch main --limit 20 --json databaseId,conclusion,createdAt,headSha 2>results/dedicated_query_error.log)"; then
            dedicated_json="${dedicated_json:-[]}"
          else
            dedicated_query_rc=$?
            dedicated_query_status="UNAVAILABLE"
            dedicated_json="[]"
            echo "Dedicated Game-Script run inspection unavailable (rc=${dedicated_query_rc}); fallback lane will remain research-only."
          fi
          dedicated_success_id="$(echo "$dedicated_json" | jq -r '[.[] | select(.conclusion=="success")] | .[0].databaseId // empty')"
          dedicated_success_created="$(echo "$dedicated_json" | jq -r '[.[] | select(.conclusion=="success")] | .[0].createdAt // empty')"
          dedicated_success_sha="$(echo "$dedicated_json" | jq -r '[.[] | select(.conclusion=="success")] | .[0].headSha // empty')"
          delegated_recent=0
          if [ -n "$dedicated_success_created" ] && [ "$dedicated_success_sha" = "$GITHUB_SHA" ]; then
            created_epoch="$(date -d "$dedicated_success_created" +%s)"
            age_minutes=$(( ($(date +%s) - created_epoch) / 60 ))
            if [ "$age_minutes" -le 1500 ]; then delegated_recent=1; fi
          fi

          printf 'dedicated_success_id=%s\ndedicated_recent=%s\ndedicated_query_status=%s\ndedicated_query_rc=%s\n' "$dedicated_success_id" "$delegated_recent" "$dedicated_query_status" "$dedicated_query_rc" | tee results/delegation_decision.txt

      - name: Restore previous Game-Script evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .previous_evidence
          delegated_id="$(awk -F= '$1=="dedicated_success_id"{print $2; exit}' results/delegation_decision.txt)"
          delegated_download_status="NOT_REQUESTED"
          delegated_download_rc=0
          if [ -n "$delegated_id" ]; then
            if gh run download "$delegated_id" --repo "$GITHUB_REPOSITORY" --dir .previous_evidence 2>results/dedicated_download_error.log; then
              delegated_download_status="PASS"
            else
              delegated_download_rc=$?
              delegated_download_status="FAILED"
              echo "Dedicated Game-Script evidence download failed (rc=${delegated_download_rc}); continuing without delegated evidence."
            fi
          fi
          if ! find .previous_evidence -type f -name 'game_script_checkpoint.json' -print -quit | grep -q .; then
            autopilot_query_status="PASS"
            autopilot_query_rc=0
            if autopilot_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow baseball_24h_research_autopilot.yml --branch main --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success")] | .[0].databaseId // empty' 2>results/autopilot_query_error.log)"; then
              autopilot_id="${autopilot_json}"
            else
              autopilot_query_rc=$?
              autopilot_query_status="UNAVAILABLE"
              autopilot_id=""
              echo "Autopilot fallback evidence inspection unavailable (rc=${autopilot_query_rc}); no prior fallback evidence will be restored."
            fi
            if [ -n "$autopilot_id" ]; then
              if gh run download "$autopilot_id" --repo "$GITHUB_REPOSITORY" --name npb-game-script-fallback --dir .previous_evidence 2>results/autopilot_download_error.log; then
                autopilot_download_status="PASS"
              else
                autopilot_download_rc=$?
                autopilot_download_status="FAILED"
                echo "Autopilot Game-Script fallback evidence download failed (rc=${autopilot_download_rc}); continuing without restore."
              fi
            else
              autopilot_download_status="NOT_REQUESTED"
              autopilot_download_rc=0
            fi
          else
            autopilot_query_status="NOT_REQUESTED"
            autopilot_query_rc=0
            autopilot_download_status="NOT_REQUESTED"
            autopilot_download_rc=0
          fi

      - name: Stage only the PBP needed for Game-Script
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 55
        run: |
          set -euo pipefail
          mkdir -p data/pbp
          required_file() {
            local name="$1"
            grep -Fq "$(printf '%s\t' "$name")" results/pbp_release_manifest.tsv
          }
          download_if_needed() {
            local name="$1"
            local digest
            digest=$(awk -F '\t' -v n="$name" '$1==n {print $2; exit}' results/pbp_release_manifest.tsv)
            test -n "$digest"
            local target="data/pbp/$name"
            local wanted
            wanted=$(printf '%s' "$digest" | sed 's/^sha256://')
            if [ -s "$target" ] && [ "$(sha256sum "$target" | awk '{print $1}')" = "$wanted" ]; then
              echo "cache hit: $name"
            else
              gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "$name" --dir data/pbp --clobber
              test -s "$target"
              test "$(sha256sum "$target" | awk '{print $1}')" = "$wanted"
            fi
          }
          for year in 2022 2023 2024 2025; do
            for m in $(seq 3 10); do
              file="$year-$(printf '%02d' "$m")_pbp.csv"
              required_file "$file"
              download_if_needed "$file"
            done
          done
          current_month_num=$((10#$(TZ=Asia/Tokyo date +%m)))
          if [ "$current_month_num" -ge 3 ]; then
            for m in $(seq 3 "$current_month_num"); do
              file="2026-$(printf '%02d' "$m")_pbp.csv"
              required_file "$file"
              download_if_needed "$file"
            done
          fi

      - name: Run bounded Game-Script fallback or skip delegated duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 90
        run: |
          set -euo pipefail
          delegated_recent="$(awk -F= '$1=="dedicated_recent"{print $2; exit}' results/delegation_decision.txt)"
          current_code="$(tr -d '[:space:]' < results/code_fingerprint.txt)"
          current_validation="$(tr -d '[:space:]' < results/validation_source_fingerprint.txt)"
          current_context="$(tr -d '[:space:]' < results/context_source_fingerprint.txt)"
          previous_json="$(find .previous_evidence -type f -name 'game_script_screening.json' -print -quit)"
          previous_code=""
          previous_validation=""
          previous_context=""
          if [ -n "$previous_json" ]; then
            previous_code="$(python - "$previous_json" <<'PY'
            import json, sys
            try: print(json.load(open(sys.argv[1],encoding="utf-8")).get("code_fingerprint",""))
            except Exception: print("")
            PY
)"
            previous_validation="$(python - "$previous_json" <<'PY'
            import json, sys
            try: print(json.load(open(sys.argv[1],encoding="utf-8")).get("validation_source_fingerprint",""))
            except Exception: print("")
            PY
)"
            previous_context="$(python - "$previous_json" <<'PY'
            import json, sys
            try: print(json.load(open(sys.argv[1],encoding="utf-8")).get("context_source_fingerprint",""))
            except Exception: print("")
            PY
)"
          fi

          mode="FULL_WFO_FALLBACK"
          if [ "$delegated_recent" = "1" ] && [ "$previous_context" = "$current_context" ]; then
            python - <<'PY'
            import json, os
            from pathlib import Path
            Path("results/game_script_fallback.json").write_text(json.dumps({
            "schema_version":"game-script-v5",
            "status":"RESEARCH_DELEGATED_RECENT",
            "candidate_role":"CHALLENGER_RESEARCH",
            "decision":"NOOP_DELEGATED_RECENT_SUCCESS",
            "pit_status":"UNVERIFIABLE_HISTORICAL_PBP_AVAILABILITY",
            "production_eligible":False,
            "delegation_source":"npb_game_script_autoresearch.yml",
            "git_sha":os.environ["GITHUB_SHA"],
            "source_fingerprint":Path("results/source_fingerprint.txt").read_text().strip(),
            "validation_source_fingerprint":Path("results/validation_source_fingerprint.txt").read_text().strip(),
            "context_source_fingerprint":Path("results/context_source_fingerprint.txt").read_text().strip(),
            "code_fingerprint":Path("results/code_fingerprint.txt").read_text().strip(),
            },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
            PY
            exit 0
          fi

          checkpoint="$(find .previous_evidence -type f -name 'game_script_checkpoint.json' -print -quit)"
          if [ "$delegated_recent" = "1" ] && [ "$previous_context" != "$current_context" ] && [ -n "$checkpoint" ] && [ "$previous_code" = "$current_code" ] && [ "$previous_validation" = "$current_validation" ]; then
            echo "Dedicated run is recent but current-season PBP changed; forcing shadow refresh."
            cp "$checkpoint" results/game_script_checkpoint.json
            mode="SHADOW_REFRESH_FALLBACK_CONTEXT_UPDATE"
          elif [ -n "$checkpoint" ] && [ "$previous_code" = "$current_code" ] && [ "$previous_validation" = "$current_validation" ]; then
            cp "$checkpoint" results/game_script_checkpoint.json
            mode="SHADOW_REFRESH_FALLBACK"
          fi
          echo "mode=$mode" | tee -a results/delegation_decision.txt
          export GAME_SCRIPT_FALLBACK_MODE="$mode"

          current_month=$(TZ=Asia/Tokyo date +%Y-%m)
          args=(
            --data-glob 'data/pbp/*.csv'
            --development-end 2024-12-31
            --validation-start 2025-01-01
            --validation-end 2025-12-31
            --shadow-start "$current_month-01"
            --shadow-end "$(TZ=Asia/Tokyo date +%Y-%m-%d)"
            --max-validation-games 160
            --max-shadow-games 60
            --simulations 300
            --seed 42
            --checkpoint-path results/game_script_checkpoint.json
            --checkpoint-every 1
            --output results/game_script_screening.json
          )
          if [ "$mode" = "SHADOW_REFRESH_FALLBACK" ] || [ "$mode" = "SHADOW_REFRESH_FALLBACK_CONTEXT_UPDATE" ]; then
            args+=(--shadow-only)
          fi
          python -m research.game_script_engine "${args[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("results/game_script_screening.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          obj["git_sha"]=os.environ["GITHUB_SHA"]
          obj["source_fingerprint"]=Path("results/source_fingerprint.txt").read_text().strip()
          obj["validation_source_fingerprint"]=Path("results/validation_source_fingerprint.txt").read_text().strip()
          obj["context_source_fingerprint"]=Path("results/context_source_fingerprint.txt").read_text().strip()
          obj["code_fingerprint"]=Path("results/code_fingerprint.txt").read_text().strip()
          obj["fallback_mode"]=__import__("os").environ.get("GAME_SCRIPT_FALLBACK_MODE","")
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Verify fallback evidence
        run: |
          set -euo pipefail
          test -s results/game_script_fallback.json || test -s results/game_script_screening.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("game_script_fallback.json","game_script_screening.json"):
          p=Path("results")/name
          if not p.exists(): continue
          o=json.loads(p.read_text())
          assert str(o.get("pit_status","")).startswith("UNVERIFIABLE")
          assert o.get("production_eligible") is False
          assert o.get("source_fingerprint")
          assert o.get("validation_source_fingerprint")
          assert o.get("context_source_fingerprint")
          assert o.get("code_fingerprint")
          break
          PY

      - name: Preserve fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npb-game-script-fallback
          path: |
            results/game_script_fallback.json
            results/game_script_screening.json
            results/game_script_checkpoint.json
            results/pbp_release_manifest.tsv
            results/source_fingerprint.txt
            results/validation_source_fingerprint.txt
            results/context_source_fingerprint.txt
            results/code_fingerprint.txt
            results/delegation_decision.txt
            tests/test_game_script_engine.py
            tests/test_game_script_automation_contract.py
          if-no-files-found: warn
          retention-days: 14

  closeout:
    name: 24h Closeout - Evidence manifest
    needs: [wave1-core-oos, wave2-frontier, wave3-candidate-oos, wave4-meta-research]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download all wave evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: baseball-24h-wave*-${{ github.run_id }}
          path: evidence
          merge-multiple: false
      - name: Build closeout manifest
        env:
          W1: ${{ needs.wave1-core-oos.result }}
          W2: ${{ needs.wave2-frontier.result }}
          W3: ${{ needs.wave3-candidate-oos.result }}
          W4: ${{ needs.wave4-meta-research.result }}
          EXPECTED_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          current_main="$(git rev-parse origin/main)"
          stale_run=false
          if [ "$current_main" != "$EXPECTED_REF" ]; then stale_run=true; fi
          export STALE_RUN="$stale_run"
          export CURRENT_MAIN_SHA="$current_main"
          mkdir -p results/24h
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('evidence')
          files=sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()) if root.exists() else []
          lane_results={
              'wave1_core_oos': os.environ['W1'],
              'wave2_frontier': os.environ['W2'],
              'wave3_candidate_oos': os.environ['W3'],
              'wave4_meta_research': os.environ['W4'],
          }
          manifest={
              'schema_version':2,
              'workflow':'Baseball 24h Research Autopilot',
              'run_id':'${{ github.run_id }}',
              'research_ref':'${{ env.RESEARCH_REF }}',
              'current_main_sha':os.environ['CURRENT_MAIN_SHA'],
              'max_execution_minutes':1440,
              'status':'COMPLETED' if all(v == 'success' for v in lane_results.values()) and not stale_run else 'PARTIAL_OR_BLOCKED',
              'lane_results':lane_results,
              'stale_run':stale_run,
              'evidence_file_count':len(files),
              'evidence_files':files[:2000],
              'research_only':True,
              'production_changed':False,
              'promotion_by_workflow':False,
          }
          Path('results/24h/closeout_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload closeout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-24h-closeout-${{ github.run_id }}
          path: results/24h/closeout_manifest.json
          if-no-files-found: error
          retention-days: 7