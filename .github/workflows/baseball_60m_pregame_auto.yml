name: Baseball 60m Pregame Auto Prediction
# Includes a bounded 60-90m rapid research-shadow lane; production remains on the canonical 50-60m PIT slot.

on:
  push:
    branches: [main]
    paths:
      - "scripts/pregame_auto.sh"
      - "scripts/npb_rapid_pregame.py"
      - ".github/workflows/baseball_60m_pregame_auto.yml"
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: "Recovery provenance for an explicit supervisor dispatch."
        required: false
        default: "manual"
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: baseball-pregame-auto-prediction
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIT_SAFE_STARTER_DATA: "1"
  BASEBALL_TIME_BUDGET_SEC: "3600"
  GH_TOKEN: ${{ github.token }}

jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Syntax-check pregame automation
        run: bash -n scripts/pregame_auto.sh

      - name: Run pregame automation
        run: bash scripts/pregame_auto.sh

      - name: Upload scheduler and prediction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-pregame-auto
          path: |
            pregame_scheduler.json
            due_dates.txt
            research_shadow_due_dates.txt
            rapid_due_dates.txt
            rapid_pregame_scheduler.json
            results/npb_production_*.json
            results/npb_shadow_*.json
            results/npb_rapid_shadow_*.json
            results/npb_fast_stdout.log
            results/npb_fast_stderr.log
          if-no-files-found: warn
          retention-days: 14
