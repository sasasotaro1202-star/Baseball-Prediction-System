name: Baseball Asian Games Research

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'

permissions:
  contents: read

concurrency:
  group: baseball-asian-games-research
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile and tests
        run: |
          set -euo pipefail
          python -m compileall -q research/asian_games_baseball.py tests/test_asian_games_baseball.py
          python -m pytest -q tests/test_asian_games_baseball.py tests/test_global_competition_registry.py

      - name: Collect official competition evidence
        run: |
          set -euo pipefail
          python -m research.asian_games_baseball --output results/asian_games_baseball_schedule.json

      - name: Validate research-only gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('results/asian_games_baseball_schedule.json').read_text(encoding='utf-8'))
          assert obj['competition_id'] == 'asian_games_baseball'
          assert obj['status'] == 'RESEARCH_ONLY'
          assert obj['prediction_eligible'] is False
          assert obj['starter_evidence_status'] == 'NOT_ASSESSED'
          assert obj['historical_oos_status'] == 'NOT_READY'
          assert obj['bbl_session_codes']
          assert obj['sources']['bfj_event_registry']['validation']['status'] == 'PASS'
          print('Asian Games research gate: PASS (research-only, production blocked)')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-asian-games-research-${{ github.run_id }}
          path: results/asian_games_baseball_schedule.json
          if-no-files-found: error
          retention-days: 14
