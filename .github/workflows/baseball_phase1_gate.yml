name: Baseball Phase 1 Production Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: baseball-phase1-gate
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q tests

  registry:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce Phase 1 scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("config/global_baseball_competition_registry.json")
          obj=json.loads(p.read_text())
          active={x["competition_id"] for x in obj["competitions"] if x.get("execution_scope")=="ACTIVE"}
          expected={"npb","mlb","asian_games_baseball"}
          assert active==expected, (active, expected)
          print("Phase 1 scope OK:", sorted(active))
          PY

  decision-contract:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        league: [NPB, MLB]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --retries 10 --timeout 120 --prefer-binary -r requirements.txt
      - name: Resolve published NPB PBP release fingerprint
        if: matrix.league == 'NPB'
        id: npb-pbp-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(gh api repos/armstjc/Nippon-Baseball-Data-Repository/git/ref/tags/pbp --jq '.object.sha')"
          test -n "${release_sha}"
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Restore NPB historical PBP cache
        if: matrix.league == 'NPB'
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            data/2020-*_pbp.csv
            data/2021-*_pbp.csv
            data/2022-*_pbp.csv
            data/2023-*_pbp.csv
            data/2024-*_pbp.csv
            data/2025-*_pbp.csv
          # Raw-data cache identity includes the published release snapshot.
          key: baseball-npb-historical-v6-${{ runner.os }}-${{ steps.npb-pbp-release.outputs.sha }}-${{ hashFiles('requirements.txt', 'research/npb_official_results.py') }}
          restore-keys: |
            baseball-npb-historical-v6-${{ runner.os }}-${{ steps.npb-pbp-release.outputs.sha }}-
      - name: Stage NPB historical PBP when cache is cold
        if: matrix.league == 'NPB'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025 2026; do
            if find data -maxdepth 1 -type f -name "${year}-*_pbp.csv" | grep -q .; then
              echo "NPB ${year}: using cached/staged file"
              continue
            fi
            downloaded=0
            for attempt in 1 2 3; do
              if gh release download pbp --repo armstjc/Nippon-Baseball-Data-Repository --pattern "${year}-*_pbp.csv" --dir data --clobber; then
                downloaded=1
                break
              fi
              if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            if [ "${downloaded}" -ne 1 ]; then
              echo "NPB ${year} PBP download failed" >&2
              exit 1
            fi
          done
          files="$(find data -maxdepth 1 -type f -name '*_pbp.csv' | wc -l | tr -d ' ')"
          test "${files}" -ge 7
      - name: Validate fail-closed decision contract
        env:
          LEAGUE: ${{ matrix.league }}
        run: |
          python - <<'PY'
          import os
          from research.real_data_validation import run_real_data_validation
          league=os.environ["LEAGUE"]
          result=run_real_data_validation(league=league)
          assert result["status"]=="COMPLETED_WITH_FAIL_CLOSED_DECISION"
          assert result["overall_decision"] in {"ADOPT","HOLD"}
          print(league, result["overall_decision"])
          PY
