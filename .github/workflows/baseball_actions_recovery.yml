name: Baseball Actions Recovery

on:
  workflow_run:
    workflows:
      - Baseball Closed Loop Research
      - Baseball PIT Acquisition
      - Baseball Regression Tests
      - Baseball Research
      - Baseball Research Preflight
      - Baseball Research Readiness
      - Baseball Candidate OOS Validation
      - NPB Production Prediction
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  recover:
    # Recover only transient infrastructure/data-acquisition failures.
    # Deterministic code/test/lifecycle failures must remain visible instead
    # of being masked by automatic retries.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'startup_failure'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery repository context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Re-run failed jobs with bounded recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          echo "Workflow=${{ github.event.workflow_run.name }}"
          echo "Run=${RUN_ID} attempt=${RUN_ATTEMPT} conclusion=${{ github.event.workflow_run.conclusion }}"

          if [ "${RUN_ATTEMPT}" -ge 3 ]; then
            echo 'Recovery limit reached; refusing another automatic rerun.' >&2
            echo 'Recovery terminal state: FAILED_WITH_LIMIT; parent failure remains authoritative.' >&2
            printf '%s
' 'Recovery terminal state: FAILED_WITH_LIMIT (parent failure remains authoritative).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          failed_steps=''
          inspect_ok=0
          for inspect_attempt in 1 2 3; do
            if failed_steps="$(gh run view "${RUN_ID}" --json jobs --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | join("\n")')"; then
              inspect_ok=1
              break
            fi
            if [ "${inspect_attempt}" -lt 3 ]; then
              sleep_seconds=$((inspect_attempt * 5))
              echo "Unable to inspect failed steps; retrying in ${sleep_seconds}s..." >&2
              sleep "${sleep_seconds}"
            fi
          done

          # Recovery must never become a second false-red caused by an
          # inspection/API problem. The parent workflow's failure remains
          # authoritative; if inspection is unavailable, preserve it and stop.
          if [ "${inspect_ok}" -ne 1 ]; then
            echo 'Recovery could not inspect the parent run after 3 attempts; recovery itself is FAILED and the original failure signal remains authoritative.' >&2
            printf '%s
' 'Recovery terminal state: FAILED_INSPECTION (parent failure remains authoritative).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'Failed steps:'
          printf '%s\n' "${failed_steps:-<none>}"

          # Retry only when every failed step is explicitly classified as
          # transient. A mixed transient + deterministic failure is preserved
          # for diagnosis instead of being accidentally masked by rerunning
          # the whole failed job.
          retryable=0
          non_retryable=0
          while IFS= read -r step; do
            [ -n "${step}" ] || continue
            case "${step}" in
              'Install research dependencies'|'Install dependencies'|'Install production dependencies'|'Acquire current PIT observations'|'Install acquisition dependencies'|'Run PIT acquisition'|'Commit PIT observations'|'Acquire PIT-safe public NPB PBP data'|'Stage historical NPB PBP release data'|'Restore immutable historical NPB PBP and official-result cache'|'Restore chronological OOS checkpoints')
                retryable=$((retryable + 1))
                ;;
              *)
                non_retryable=$((non_retryable + 1))
                ;;
            esac
          done <<< "${failed_steps}"

          if [ "${retryable}" -eq 0 ]; then
            echo 'No retryable transient failure detected; preserving the failure for diagnosis.' >&2
            echo 'Recovery terminal state: FAILED_NO_RETRYABLE_STEP; parent failure remains authoritative.' >&2
            printf '%s
' 'Recovery terminal state: FAILED_NO_RETRYABLE_STEP (parent failure remains authoritative).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${non_retryable}" -ne 0 ]; then
            echo 'Mixed transient and deterministic failures detected; refusing automatic rerun.' >&2
            echo 'Recovery terminal state: FAILED_MIXED_FAILURES; parent failure remains authoritative.' >&2
            printf '%s
' 'Recovery terminal state: FAILED_MIXED_FAILURES (parent failure remains authoritative).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The recovery API call itself can fail transiently. Retry the
          # recovery request, but never bypass the parent workflow's gates.
          for recovery_attempt in 1 2 3; do
            if gh run rerun "${RUN_ID}" --failed; then
              echo "Automatic failed-job recovery requested on recovery attempt ${recovery_attempt}."
              exit 0
            fi
            if [ "${recovery_attempt}" -eq 3 ]; then
              echo 'Recovery request failed after 3 attempts; preserving the original failure signal.' >&2
              echo 'Recovery terminal state: FAILED_RERUN_REQUEST; parent failure remains authoritative.' >&2
              printf '%s
' 'Recovery terminal state: FAILED_RERUN_REQUEST (parent failure remains authoritative).' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep_seconds=$((recovery_attempt * 10))
            echo "Recovery API request failed; retrying in ${sleep_seconds}s..." >&2
            sleep "${sleep_seconds}"
          done
