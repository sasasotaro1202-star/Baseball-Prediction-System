name: Baseball Research Audit Unit Tests

on:
  push:
    branches:
      - hardening/permutation-and-feature-stability-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-research-audit-unit-tests
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 120 --prefer-binary -r requirements.txt

      - name: Compile new audit modules
        run: |
          set -euo pipefail
          python -m py_compile research/target_permutation_oos.py research/feature_influence_stability.py
          python -m py_compile tests/test_target_permutation_oos.py tests/test_feature_influence_stability.py

      - name: Run new audit regression tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_target_permutation_oos.py tests/test_feature_influence_stability.py
